<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Legend - Working Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: sans-serif; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .btn { padding: 15px 40px; background: #00d2d3; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid white; display: none; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: white; border-radius: 50%; }
    </style>
</head>
<body>

<div id="overlay">
    <h1 id="status">INITIALIZING CITY...</h1>
    <div id="loading-bar" style="width:200px; height:10px; background:#333; border-radius:5px; overflow:hidden;">
        <div id="fill" style="width:0%; height:100%; background:#00d2d3;"></div>
    </div>
    <button id="start-btn" class="btn" style="display:none;">START MISSION</button>
    <p id="error-log" style="color: #ff4d4d; font-size: 12px; margin-top: 10px;"></p>
</div>

<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. ENGINE
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 500, 3500);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
    const player = new THREE.Group();
    player.position.set(0, 15, 300); 
    scene.add(player);
    player.add(camera);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(100, 500, 100);
    scene.add(sun);

    // 2. THE ROAD (Built with Code, Not GLB)
    const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(240, 15000), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    asphalt.rotation.x = -Math.PI / 2;
    scene.add(asphalt);

    // Yellow Divider & White Dashes
    const centerLine = new THREE.Mesh(new THREE.PlaneGeometry(4, 15000), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
    centerLine.rotation.x = -Math.PI/2; centerLine.position.y = 0.1;
    scene.add(centerLine);

    for(let i=0; i<100; i++) {
        const z = 5000 - (i * 150);
        [-80, -40, 40, 80].forEach(x => {
            const dash = new THREE.Mesh(new THREE.PlaneGeometry(2, 25), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            dash.rotation.x = -Math.PI/2; dash.position.set(x, 0.2, z);
            scene.add(dash);
        });
    }

    // 3. ASSET LOADER (Safe Mode)
    const loader = new GLTFLoader();
    let toLoad = 3, loaded = 0;

    const onDone = () => {
        loaded++;
        document.getElementById('fill').style.width = (loaded/toLoad)*100 + "%";
        if(loaded >= toLoad) {
            document.getElementById('status').innerText = "CITY READY";
            document.getElementById('start-btn').style.display = "block";
        }
    };

    // Spacing buildings at X=450 and X=-450
    const spawnRow = (url, x, scale, spacing) => {
        loader.load(url, (gltf) => {
            for(let i=0; i<12; i++) {
                const b = gltf.scene.clone();
                b.scale.setScalar(scale);
                b.position.set(x, 0, -spacing * i);
                scene.add(b);
            }
            onDone();
        }, undefined, (e) => {
            document.getElementById('error-log').innerText += " Failed: " + url.split('/').pop() + " |";
            onDone(); 
        });
    };

    spawnRow('./models/building.glb', -450, 50, 1000);
    spawnRow('./models/b1.glb', 450, 50, 1000);
    // Tree row
    loader.load('./models/t1.glb', (gltf) => {
        for(let i=0; i<50; i++) {
            const tL = gltf.scene.clone(); tL.scale.setScalar(2.5); tL.position.set(-140, 0, -300 * i); scene.add(tL);
            const tR = gltf.scene.clone(); tR.scale.setScalar(2.5); tR.position.set(140, 0, -300 * i); scene.add(tR);
        }
        onDone();
    }, undefined, () => onDone());

    // 4. CONTROLS
    let moveDir = { x: 0, z: 0 }, yaw = 0, pitch = 0, active = false;
    const jBase = document.getElementById('joy-base'), jKnob = document.getElementById('joy-knob');

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('overlay').style.display = "none";
        jBase.style.display = "block";
        animate();
    };

    jBase.onpointerdown = (e) => { active = true; jBase.setPointerCapture(e.pointerId); };
    jBase.onpointermove = (e) => {
        if(!active) return;
        const r = jBase.getBoundingClientRect();
        const dx = (e.clientX - (r.left + 50)) / 50, dy = (e.clientY - (r.top + 50)) / 50;
        const d = Math.min(Math.sqrt(dx*dx + dy*dy), 1);
        const a = Math.atan2(dy, dx);
        jKnob.style.transform = `translate(${Math.cos(a)*d*30}px, ${Math.sin(a)*d*30}px)`;
        moveDir.x = Math.cos(a) * d; moveDir.z = Math.sin(a) * d;
    };
    window.onpointerup = () => { active = false; jKnob.style.transform = ''; moveDir = {x:0, z:0}; };

    window.addEventListener('pointermove', (e) => {
        if(active && e.clientX < window.innerWidth/2) return;
        if(e.buttons === 1 || e.pointerType === 'touch') {
            yaw -= e.movementX * 0.004;
            pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.004));
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        player.rotation.y = yaw;
        camera.rotation.x = pitch;
        const f = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
        const s = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
        player.position.addScaledVector(f, -moveDir.z * 10);
        player.position.addScaledVector(s, moveDir.x * 10);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
