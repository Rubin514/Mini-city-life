<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini City Life</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body { margin: 0; overflow: hidden; background: black; }
  #log {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #00ff00;
    font-family: monospace;
    font-size: 14px;
    white-space: pre;
  }
</style>
</head>

<body>
<div id="log">Initializing Game...</div>

<!-- THREE JS -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const log = document.getElementById("log");
const write = msg => log.textContent += "\n> " + msg;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// Camera
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 6, 12);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1);
dir.position.set(5, 10, 5);
scene.add(dir);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Loader
const loader = new THREE.GLTFLoader();

// Fallback cube
function fallback(x, z) {
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xff3333 })
  );
  box.position.set(x, 0.5, z);
  scene.add(box);
}

// Load model
function loadModel(file, x, z, scale = 1) {
  write("Loading " + file + "...");
  loader.load(
    "models/" + file,
    gltf => {
      const model = gltf.scene;
      model.position.set(x, 0, z);
      model.scale.set(scale, scale, scale);
      scene.add(model);
      write(file + " loaded");
    },
    undefined,
    () => {
      write("ERROR: " + file + " failed. Using box.");
      fallback(x, z);
    }
  );
}

// Load city
loadModel("building.glb", -4, 0, 1);
loadModel("building2.glb", 0, 0, 1);
loadModel("tree1.glb", 4, 0, 1);

// Animate
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

write("Building City Grid...");
write("City Ready!");

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
