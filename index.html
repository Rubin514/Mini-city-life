<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Fixed Loader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* HUD */
        #hud { position: fixed; top: 15px; left: 15px; z-index: 100; pointer-events: none; }
        #minimap { width: 120px; height: 120px; background: rgba(0,0,0,0.7); border: 2px solid #fff; position: relative; border-radius: 5px; }
        #pDot { width: 8px; height: 8px; background: #fff; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
        #targetDot { width: 10px; height: 10px; background: #f0f; position: absolute; border-radius: 2px; display: none; }
        #missionBox { background: rgba(0,0,0,0.85); color: #0f0; padding: 10px; margin-top: 10px; border-radius: 5px; font-size: 14px; max-width: 200px; border-left: 4px solid #fbc02d; }

        /* UI */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; }
        .menu-btn { padding: 12px 25px; margin: 6px; background: #333; border: 1px solid #777; color: #fff; border-radius: 5px; width: 220px; cursor: pointer; font-weight: bold; }
        
        #controls { position: fixed; bottom: 30px; left: 30px; z-index: 100; display: grid; grid-template-areas: ". u ." "l d r"; gap: 10px; }
        .btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        #jump { position: fixed; bottom: 40px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: #ff9800; border: 3px solid #fff; }
        
        #topBtns { position: fixed; top: 15px; right: 15px; z-index: 100; display: flex; gap: 8px; }
        #loading-screen { position: fixed; inset: 0; background: #111; color: #0f0; display: flex; align-items: center; justify-content: center; z-index: 1000; font-family: monospace; }
    </style>
</head>
<body>

<div id="loading-screen">DOWNLOADING ASSETS...</div>

<div id="hud">
    <div id="minimap"><div id="pDot"></div><div id="targetDot"></div></div>
    <div id="missionBox">
        <div id="mTitle" style="font-weight:bold;">NO MISSION</div>
        <div id="mGoal">Open the Mission Menu</div>
    </div>
</div>

<div id="topBtns">
    <button class="menu-btn" style="width:auto;" onclick="openMenu('missionMenu')">MISSIONS</button>
</div>

<div id="missionMenu" class="overlay">
    <h2>SELECT MISSION</h2>
    <div id="missionList" style="overflow-y:auto; max-height: 60vh;"></div>
    <button class="menu-btn" style="background:#800;" onclick="closeMenu('missionMenu')">CLOSE</button>
</div>

<div id="controls">
    <div class="btn" style="grid-area:u" id="u">▲</div>
    <div class="btn" style="grid-area:l" id="l">◀</div>
    <div class="btn" style="grid-area:d" id="d">▼</div>
    <div class="btn" style="grid-area:r" id="r">▶</div>
</div>
<button id="jump" class="btn">JUMP</button>

<script type="importmap">
{
    "imports": { 
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js", 
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/" 
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* --- SCENE SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(50, 100, 50);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x44aa44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* --- ASSET MANAGEMENT --- */
const models = { b1: null, b2: null, tree: null };
const colliders = [];
const loader = new GLTFLoader();
let assetsToLoad = 3;
let assetsLoaded = 0;

// This ensures the city only builds AFTER models load
const checkReady = () => {
    assetsLoaded++;
    if (assetsLoaded >= assetsToLoad) {
        document.getElementById('loading-screen').style.display = 'none';
        initCity();
    }
};

const loadAsset = (url, key) => {
    loader.load(url, 
        (gltf) => { 
            console.log("Loaded:", url);
            models[key] = gltf.scene; 
            checkReady(); 
        }, 
        undefined, 
        (err) => { 
            console.error("Missing file:", url);
            // Create a temporary box so the game doesn't crash
            const box = new THREE.Group();
            box.add(new THREE.Mesh(new THREE.BoxGeometry(40, 100, 40), new THREE.MeshLambertMaterial({color: 0x555555})));
            models[key] = box;
            checkReady(); 
        }
    );
};

// Start loading from your models folder
loadAsset('models/building.glb', 'b1');
loadAsset('models/building2.glb', 'b2');
loadAsset('models/tree.glb', 'tree');

/* --- CITY & PLAYER --- */
const initCity = () => {
    const spacing = 450;
    for(let x=-5; x<=5; x++){
        for(let z=-5; z<=5; z++){
            if(x === 0 && z === 0) continue;
            const px = x * spacing;
            const pz = z * spacing;
            
            const model = (x+z) % 2 === 0 ? models.b1 : models.b2;
            const b = model.clone();
            b.position.set(px, 0, pz);
            scene.add(b);
            colliders.push({x: px, z: pz, r: 80});

            if(models.tree && Math.random() > 0.5) {
                const t = models.tree.clone();
                t.position.set(px + 100, 0, pz + 100);
                scene.add(t);
            }
        }
    }
};

const player = new THREE.Object3D();
player.position.set(0, 10, 400);
scene.add(player);
player.add(camera);

let yaw=0, pitch=0, vY=0, input={f:0,b:0,l:0,r:0}, config={sens: 0.004};

function animate() {
    requestAnimationFrame(animate);
    let nx = player.position.x, nz = player.position.z, spd = 7;
    
    if(input.f){ nx -= Math.sin(yaw)*spd; nz -= Math.cos(yaw)*spd; }
    if(input.b){ nx += Math.sin(yaw)*spd; nz += Math.cos(yaw)*spd; }
    if(input.l){ nx -= Math.cos(yaw)*spd; nz += Math.sin(yaw)*spd; }
    if(input.r){ nx += Math.cos(yaw)*spd; nz -= Math.sin(yaw)*spd; }

    let hit = false;
    for(let c of colliders) if(Math.hypot(nx-c.x, nz-c.z) < c.r) hit=true;
    if(!hit){ player.position.x=nx; player.position.z=nz; }

    vY -= 0.02; player.position.y += vY;
    if(player.position.y < 10){ player.position.y=10; vY=0; }

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}

/* --- UI HELPERS --- */
window.openMenu = (id) => document.getElementById(id).style.display = 'flex';
window.closeMenu = (id) => document.getElementById(id).style.display = 'none';

const bind = (id, k) => {
    const e = document.getElementById(id);
    e.onpointerdown = (ev) => { ev.preventDefault(); input[k]=1; };
    e.onpointerup = () => input[k]=0;
    e.onpointerleave = () => input[k]=0;
};
bind("u","f"); bind("d","b"); bind("l","l"); bind("r","r");

document.getElementById("jump").onpointerdown = () => { if(player.position.y <= 11) vY = 0.5; };

let drag=false, lx, ly;
renderer.domElement.onpointerdown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
window.onpointerup = () => drag=false;
window.onpointermove = e => { 
    if(drag){ 
        yaw -= (e.clientX - lx) * config.sens; 
        pitch = Math.max(-1, Math.min(1, pitch - (e.clientY - ly) * config.sens));
        lx = e.clientX; ly = e.clientY; 
    }
};

animate();
</script>
</body>
</html>
