<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini City Life – FIXED</title>
<style>
    body { margin: 0; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
/* =========================
   SCENE
========================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* =========================
   CAMERA
========================= */
const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
);
camera.position.set(80, 60, 120);

/* =========================
   RENDERER
========================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* =========================
   CONTROLS
========================= */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.update();

/* =========================
   LIGHTING
========================= */
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(100, 200, 100);
scene.add(sun);

/* =========================
   GROUND
========================= */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* =========================
   DEBUG CUBE (PROVES RENDERING)
========================= */
const debugCube = new THREE.Mesh(
    new THREE.BoxGeometry(10, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
debugCube.position.y = 5;
scene.add(debugCube);

/* =========================
   LOAD MODELS
========================= */
const loader = new THREE.GLTFLoader();
const models = {
    buildings: [],
    tree: null
};

let loaded = 0;
const TOTAL = 3;

function ready() {
    loaded++;
    if (loaded === TOTAL) generateCity();
}

loader.load("models/building.glb", g => {
    models.buildings.push(g.scene);
    ready();
});

loader.load("models/building1.glb", g => {
    models.buildings.push(g.scene);
    ready();
});

loader.load("models/tree1.glb", g => {
    models.tree = g.scene;
    ready();
});

/* =========================
   CITY GENERATION
========================= */
function generateCity() {
    const spacing = 40;
    const size = 3;

    for (let x = -size; x <= size; x++) {
        for (let z = -size; z <= size; z++) {

            if (x === 0 && z === 0) continue;

            let obj;

            if (Math.random() < 0.3 && models.tree) {
                obj = models.tree.clone();
                obj.scale.set(0.5, 0.5, 0.5);
            } else {
                const b =
                    models.buildings[
                        Math.floor(Math.random() * models.buildings.length)
                    ];
                obj = b.clone();
                obj.scale.set(0.3, 0.3, 0.3);
            }

            obj.position.set(x * spacing, 0, z * spacing);
            obj.rotation.y = Math.random() * Math.PI * 2;
            scene.add(obj);
        }
    }

    console.log("City generated ✔");
}

/* =========================
   RESIZE
========================= */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================
   ANIMATE
========================= */
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
