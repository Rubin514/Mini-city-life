<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini City Life - Expanded</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
/**
 * 1. SCENE SETUP
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Sky blue
scene.fog = new THREE.Fog(0x87ceeb, 10, 50); // Adds depth by fading distant objects

/**
 * 2. CAMERA & RENDERER
 */
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(10, 10, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/**
 * 3. CONTROLS
 */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; // Adds smooth weight to camera movement

/**
 * 4. LIGHTING
 */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
sunLight.position.set(15, 20, 10);
scene.add(sunLight);

/**
 * 5. GROUND & ENVIRONMENT
 */
const grid = new THREE.GridHelper(100, 50, 0x000000, 0x555555);
scene.add(grid);

const groundGeo = new THREE.PlaneGeometry(100, 100);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/**
 * 6. MODEL LOADING & CITY GENERATION
 */
const loader = new THREE.GLTFLoader();

function createCity(model) {
    const spacing = 10; // Distance between buildings
    const gridSize = 3;  // 3x3 grid

    for (let x = -gridSize; x <= gridSize; x++) {
        for (let z = -gridSize; z <= gridSize; z++) {
            // Clone the loaded model
            const building = model.clone();
            
            // Set position based on loop indices
            building.position.set(x * spacing, 0, z * spacing);
            
            // Randomize rotation slightly for variety
            building.rotation.y = Math.floor(Math.random() * 4) * (Math.PI / 2);
            
            scene.add(building);
        }
    }
}

loader.load(
    "models/building.glb",
    (gltf) => {
        console.log("Model loaded successfully");
        const masterModel = gltf.scene;
        createCity(masterModel);
    },
    (xhr) => {
        console.log((xhr.loaded / xhr.total * 100) + '% loaded');
    },
    (error) => {
        console.error("Error loading GLB. Ensure you are using a local server.", error);
    }
);

/**
 * 7. WINDOW RESIZE HANDLING
 */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/**
 * 8. ANIMATION LOOP
 */
function animate() {
    requestAnimationFrame(animate);
    controls.update(); // Only required if damping is enabled
    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
