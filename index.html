<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini City Life – DEBUGGED</title>

<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: monospace; touch-action: none; }
  #status {
    position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8);
    color: #0f0; padding: 10px; z-index: 100; font-size: 11px; border-radius: 5px;
    max-height: 200px; overflow-y: auto; pointer-events: none;
  }
  #joystick-base { 
    position: absolute; bottom: 40px; left: 40px; width: 80px; height: 80px; 
    background: rgba(255,255,255,0.3); border-radius: 50%; z-index: 10;
    touch-action: none;
  }
  #joystick-knob { 
    position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; 
    background: #fff; border-radius: 50%; pointer-events: none;
  }
</style>
</head>
<body>

<div id="status">System Initializing...</div>
<div id="joystick-base"><div id="joystick-knob"></div></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

const statusUI = document.getElementById("status");
const log = (t) => {
    statusUI.innerHTML += "<br>" + t;
    statusUI.scrollTop = statusUI.scrollHeight;
};

/* SCENE SETUP */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 100, 50);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* LOADER & PLAYER GROUP */
const loader = new GLTFLoader();
const playerGroup = new THREE.Group(); 
scene.add(playerGroup);

function loadGLB(file, x, z, isPlayer = false) {
  // Using the path you specified
  const path = `./models/${file}?v=${Date.now()}`;
  
  loader.load(
    path,
    (gltf) => {
      const model = gltf.scene;

      // Calculate dimensions for auto-scaling
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const scale = 10 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);

      // IMPORTANT: Adjust position so the bottom of the model hits Y=0
      const updatedBox = new THREE.Box3().setFromObject(model);
      model.position.y = -updatedBox.min.y; 

      if (isPlayer) {
        playerGroup.add(model);
        log(`✅ Player Ready: ${file}`);
      } else {
        const buildingWrap = new THREE.Group();
        buildingWrap.position.set(x, 0, z);
        buildingWrap.add(model);
        scene.add(buildingWrap);
        log(`✅ Building Placed: ${file}`);
      }
    },
    undefined,
    (e) => log(`❌ Load Error: ${file}`)
  );
}

loadGLB("building.glb", -25, -15);
loadGLB("b1.glb", 25, -15);
loadGLB("t1.glb", 0, 0, true);

/* JOYSTICK CONTROLS */
let moveX = 0, moveZ = 0, dragging = false;
const knob = document.getElementById('joystick-knob');
const base = document.getElementById('joystick-base');

base.addEventListener('pointerdown', (e) => {
    dragging = true;
    base.setPointerCapture(e.pointerId);
});

window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const b = base.getBoundingClientRect();
    const centerX = b.left + b.width / 2;
    const centerY = b.top + b.height / 2;
    
    let dx = e.clientX - centerX;
    let dy = e.clientY - centerY;
    
    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 35);
    const angle = Math.atan2(dy, dx);
    
    knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
    
    // Smooth input values
    moveX = (Math.cos(angle) * dist) / 35;
    moveZ = (Math.sin(angle) * dist) / 35;
});

window.addEventListener('pointerup', () => {
    dragging = false;
    knob.style.transform = 'translate(0,0)';
    moveX = 0;
    moveZ = 0;
});

/* ANIMATION LOOP */
function animate() {
  requestAnimationFrame(animate);
  
  if (dragging) {
    // Movement speed
    playerGroup.position.x += moveX * 0.5;
    playerGroup.position.z += moveZ * 0.5;
    
    // Rotate player to face movement direction
    playerGroup.rotation.y = Math.atan2(-moveX, -moveZ);
  }
  
  // Camera Follow with Offset
  camera.position.lerp(new THREE.Vector3(
    playerGroup.position.x, 
    playerGroup.position.y + 25, 
    playerGroup.position.z + 45
  ), 0.1);
  
  camera.lookAt(playerGroup.position);
  
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
