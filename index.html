<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fixed City</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
        #loading-screen { position: fixed; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        #start-btn { padding: 15px 40px; background: #00d2d3; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #fff; border-radius: 50%; }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1 id="status">LOADING MODELS...</h1>
    <button id="start-btn" style="display:none">ENTER CITY</button>
</div>

<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 500, 2500);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
    const player = new THREE.Group();
    player.position.set(0, 15, 0); 
    scene.add(player);
    player.add(camera);

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    // --- 🛣️ THE HIGHWAY (Simple Geometry) ---
    const road = new THREE.Mesh(new THREE.PlaneGeometry(200, 10000), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // --- 🏗️ THE LOADING FIX ---
    const loader = new GLTFLoader();
    let modelsToLoad = 3;
    let modelsLoaded = 0;

    function checkLoad() {
        modelsLoaded++;
        document.getElementById('status').innerText = `LOADED ${modelsLoaded}/3`;
        if(modelsLoaded >= modelsToLoad) {
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('status').innerText = "READY!";
        }
    }

    // Spawn Buildings (Spread out on Z and X)
    const loadBuilding = (path, x) => {
        loader.load(path, (gltf) => {
            for(let i = 0; i < 10; i++) {
                const b = gltf.scene.clone();
                b.scale.setScalar(40);
                b.position.set(x, 0, -800 * i);
                scene.add(b);
            }
            checkLoad();
        }, undefined, () => { console.error("Error loading building"); checkLoad(); });
    };

    loadBuilding('./models/building.glb', -300);
    loadBuilding('./models/b1.glb', 300);

    // Trees (Small scale)
    loader.load('./models/t1.glb', (gltf) => {
        for(let i = 0; i < 30; i++) {
            const tL = gltf.scene.clone(); tL.scale.setScalar(2); tL.position.set(-120, 0, -250 * i); scene.add(tL);
            const tR = gltf.scene.clone(); tR.scale.setScalar(2); tR.position.set(120, 0, -250 * i); scene.add(tR);
        }
        checkLoad();
    }, undefined, () => { checkLoad(); });

    // --- 🎮 CONTROLS ---
    let moveDir = { x: 0, z: 0 };
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('loading-screen').style.display = 'none';
        animate();
    };

    // (Add your joystick logic here from the previous code)

    function animate() {
        requestAnimationFrame(animate);
        // Movement Logic
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
