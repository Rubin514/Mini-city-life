<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini City Life 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; }
        /* Joystick UI */
        #joystick-base { 
            position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; 
            background: rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; 
        }
        #joystick-knob { 
            position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; 
            background: #fff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
    </style>
</head>
<body>
    <div id="joystick-base"><div id="joystick-knob"></div></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // 2. THE PLAYER CONTAINER (Tree)
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // 3. GLB LOADER LOGIC
        const loader = new GLTFLoader();

        // Load Static Building 1
        loader.load('models/building.glb', (gltf) => {
            const b1 = gltf.scene;
            b1.position.set(-15, 0, -10); // Position to the left
            b1.scale.set(3, 3, 3);
            scene.add(b1);
        });

        // Load Static Building 2
        loader.load('models/building1.glb', (gltf) => {
            const b2 = gltf.scene;
            b2.position.set(15, 0, -10); // Position to the right
            b2.scale.set(3, 3, 3);
            scene.add(b2);
        });

        // Load Tree1 as the Moving Player
        loader.load('models/tree1.glb', (gltf) => {
            const tree = gltf.scene;
            tree.scale.set(2, 2, 2);
            playerGroup.add(tree);
        });

        // 4. JOYSTICK INPUT
        const knob = document.getElementById('joystick-knob');
        const base = document.getElementById('joystick-base');
        let moveX = 0, moveZ = 0, dragging = false;

        base.addEventListener('pointerdown', () => dragging = true);
        window.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const rect = base.getBoundingClientRect();
            let dx = e.clientX - (rect.left + 50);
            let dy = e.clientY - (rect.top + 50);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const angle = Math.atan2(dy, dx);
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = (Math.cos(angle) * dist) / 40;
            moveZ = (Math.sin(angle) * dist) / 40;
        });
        window.addEventListener('pointerup', () => {
            dragging = false;
            knob.style.transform = `translate(0,0)`;
            moveX = 0; moveZ = 0;
        });

        // 5. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);

            // Move the Tree Player
            playerGroup.position.x += moveX * 0.2;
            playerGroup.position.z += moveZ * 0.2;

            // Camera Follow (Offset from player)
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 10, playerGroup.position.z + 20);
            camera.lookAt(playerGroup.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
