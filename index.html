<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini City Life - Debug Mode</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
  #status {
    position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
    color: #0f0; padding: 10px; z-index: 100; font-size: 10px; border-radius: 5px;
    pointer-events: none; max-width: 90%; word-wrap: break-word;
  }
  #start-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: flex; justify-content: center;
    align-items: center; z-index: 1000; color: white; flex-direction: column;
  }
  #start-btn {
    padding: 20px 40px; font-size: 24px; cursor: pointer; background: #4caf50;
    border: none; color: white; border-radius: 10px;
  }
</style>
</head>
<body>

<div id="start-screen">
  <h2 id="loading-msg">Mini City Life</h2>
  <button id="start-btn">TAP TO START</button>
</div>

<div id="status">System: Waiting for tap...</div>

<script type="module">
// --- EMERGENCY ERROR CATCHER ---
window.onerror = function(msg, url, line) {
    alert("CRITICAL ERROR: " + msg + "\nLine: " + line);
};

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { DRACOLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js";

const statusUI = document.getElementById("status");
const log = (t) => { 
    console.log(t);
    statusUI.innerHTML += "<br>" + t; 
};

// Start the game logic only after button click
document.getElementById('start-btn').onclick = function() {
    try {
        document.getElementById('start-screen').style.display = 'none';
        initGame();
    } catch (e) {
        alert("Init Error: " + e.message);
    }
};

function initGame() {
    log("🚀 Engine Starting...");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(50, 100, 50);
    scene.add(sun);

    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    /* LOADER CONFIG */
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    function loadGLB(file, x, z, isPlayer = false) {
        const path = `./models/${file}`;
        log(`Fetching ${file}...`);

        loader.load(path, (gltf) => {
            const model = gltf.scene;
            model.position.set(x, 0, z);
            
            // Basic auto-scale
            model.scale.setScalar(5); 

            if (isPlayer) {
                playerGroup.add(model);
                log(`✅ Player OK`);
            } else {
                scene.add(model);
                log(`✅ Building OK`);
            }
        }, undefined, (err) => {
            log(`❌ Load Error: ${file}`);
        });
    }

    // Load calls
    loadGLB("building.glb", -30, -20);
    loadGLB("b1.glb", 30, -20);
    loadGLB("t1.glb", 0, 0, true);

    function animate() {
        requestAnimationFrame(animate);
        camera.position.set(playerGroup.position.x, 35, playerGroup.position.z + 50);
        camera.lookAt(playerGroup.position);
        renderer.render(scene, camera);
    }
    animate();
}
</script>
</body>
</html>
