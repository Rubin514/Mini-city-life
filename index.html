<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mini City Life</title>

<style>
    body { margin: 0; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }

    /* Mobile controls */
    .controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10;
    }
    .controls button {
        width: 60px;
        height: 60px;
        margin: 5px;
        border-radius: 50%;
        border: none;
        background: rgba(0,0,0,0.4);
        color: white;
        font-size: 20px;
    }
    .enter {
        position: fixed;
        bottom: 30px;
        right: 20px;
        background: orange;
        color: black;
        border-radius: 10px;
        padding: 15px 25px;
        font-size: 18px;
        border: none;
        z-index: 10;
    }
</style>
</head>

<body>

<!-- MOBILE CONTROLS -->
<div class="controls">
    <button id="up">↑</button><br/>
    <button id="left">←</button>
    <button id="down">↓</button>
    <button id="right">→</button>
</div>
<button class="enter">ENTER</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 3, 10);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* CONTROLS (for desktop testing) */
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.enablePan = false;
orbit.maxPolarAngle = Math.PI / 2.1;

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50, 50, 50);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

scene.add(new THREE.GridHelper(500, 50));

/* PLAYER (camera holder) */
const player = new THREE.Object3D();
player.position.y = 3; // human height
player.add(camera);
scene.add(player);

/* MOVEMENT */
const speed = 0.15;
const move = { up:false, down:false, left:false, right:false };

document.getElementById("up").ontouchstart = () => move.up = true;
document.getElementById("up").ontouchend   = () => move.up = false;
document.getElementById("down").ontouchstart = () => move.down = true;
document.getElementById("down").ontouchend   = () => move.down = false;
document.getElementById("left").ontouchstart = () => move.left = true;
document.getElementById("left").ontouchend   = () => move.left = false;
document.getElementById("right").ontouchstart = () => move.right = true;
document.getElementById("right").ontouchend   = () => move.right = false;

/* LOAD BUILDING & CREATE CITY */
const loader = new GLTFLoader();

loader.load("models/building.glb", (gltf) => {

    const base = gltf.scene;

    // 🔥 AUTO HEIGHT FIX (YOUR BUG FIXED)
    const box = new THREE.Box3().setFromObject(base);
    const height = box.max.y - box.min.y;

    const spacing = 25;
    const citySize = 4;

    for (let x = -citySize; x <= citySize; x++) {
        for (let z = -citySize; z <= citySize; z++) {

            const building = base.clone();

            building.position.set(
                x * spacing,
                height / 2, // PERFECT ground alignment
                z * spacing
            );

            building.rotation.y = Math.random() * Math.PI * 2;
            scene.add(building);
        }
    }
});

/* RESIZE */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ANIMATE */
function animate() {
    requestAnimationFrame(animate);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    dir.y = 0;
    dir.normalize();

    if (move.up) player.position.addScaledVector(dir, speed);
    if (move.down) player.position.addScaledVector(dir, -speed);
    if (move.left) player.rotation.y += 0.03;
    if (move.right) player.rotation.y -= 0.03;

    orbit.target.copy(player.position);
    orbit.update();

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
