<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini City Life</title>

<style>
    body { margin: 0; overflow: hidden; background:#87ceeb; }
    canvas { display: block; }

    /* Mobile controls */
    .controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        display: grid;
        grid-template-columns: 60px 60px 60px;
        grid-template-rows: 60px 60px;
        gap: 10px;
        z-index: 10;
    }
    .btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(0,0,0,0.5);
        color: white;
        font-size: 24px;
        border: none;
    }
</style>
</head>

<body>

<!-- Mobile buttons -->
<div class="controls">
    <button class="btn" id="up">↑</button>
    <button class="btn" id="left">←</button>
    <button class="btn" id="right">→</button>
    <button class="btn" id="down">↓</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 6, 10);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* CONTROLS */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2.2;

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50,50,50);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500,500),
    new THREE.MeshStandardMaterial({color:0x555555})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* GRID */
scene.add(new THREE.GridHelper(500, 100));

/* PLAYER (INVISIBLE COLLIDER) */
const player = new THREE.Object3D();
player.position.set(0, 0, 0);
scene.add(player);

/* PLAYER COLLISION BOX */
const playerBox = new THREE.Box3();
const playerSize = new THREE.Vector3(1, 2, 1);

/* BUILDING COLLIDERS */
const buildingBoxes = [];

/* LOAD BUILDING */
const loader = new GLTFLoader();
loader.load("models/building.glb", (gltf) => {

    const baseModel = gltf.scene;

    const baseBox = new THREE.Box3().setFromObject(baseModel);
    const baseSize = new THREE.Vector3();
    baseBox.getSize(baseSize);

    const spacing = baseSize.x + 20;
    const citySize = 4;

    for (let x = -citySize; x <= citySize; x++) {
        for (let z = -citySize; z <= citySize; z++) {

            const building = baseModel.clone(true);

            const box = new THREE.Box3().setFromObject(building);

            building.position.y = -box.min.y; // FIX FLOATING
            building.position.x = x * spacing;
            building.position.z = z * spacing;

            building.rotation.y = Math.random() * Math.PI * 2;

            scene.add(building);

            // COLLISION BOX
            const collider = new THREE.Box3().setFromObject(building);
            buildingBoxes.push(collider);
        }
    }
});

/* MOVEMENT */
const speed = 0.15;
const move = { up:false, down:false, left:false, right:false };

function tryMove(dx, dz) {
    const nextPos = player.position.clone();
    nextPos.x += dx;
    nextPos.z += dz;

    playerBox.setFromCenterAndSize(
        new THREE.Vector3(nextPos.x, 1, nextPos.z),
        playerSize
    );

    for (const box of buildingBoxes) {
        if (playerBox.intersectsBox(box)) return;
    }

    player.position.copy(nextPos);
    camera.position.x += dx;
    camera.position.z += dz;
}

/* BUTTON EVENTS */
up.onclick = ()=> move.up = true;
down.onclick = ()=> move.down = true;
left.onclick = ()=> move.left = true;
right.onclick = ()=> move.right = true;

document.body.addEventListener("touchend", ()=> {
    move.up = move.down = move.left = move.right = false;
});

/* LOOP */
function animate(){
    requestAnimationFrame(animate);

    if(move.up) tryMove(0, -speed);
    if(move.down) tryMove(0, speed);
    if(move.left) tryMove(-speed, 0);
    if(move.right) tryMove(speed, 0);

    controls.target.copy(player.position);
    controls.update();
    renderer.render(scene, camera);
}
animate();

/* RESIZE */
addEventListener("resize", ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
