<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fixed City Grid</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
        #loader { position: fixed; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .btn { padding: 15px 40px; background: #00d2d3; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 20px; }
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; display:none; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #fff; border-radius: 50%; }
    </style>
</head>
<body>

<div id="loader">
    <h1 id="status">CHECKING MODELS...</h1>
    <div id="progress-text">0%</div>
    <button id="start-btn" class="btn" style="display:none">START MISSION</button>
    <button id="skip-btn" class="btn" style="background:#555">SKIP LOADING (DEBUG)</button>
</div>

<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. SCENE SETUP
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 500, 2500);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 4000);
    const player = new THREE.Group();
    player.position.set(0, 15, 200); 
    scene.add(player);
    player.add(camera);

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    // 2. 🛣️ THE HIGHWAY (Created with code so it NEVER fails to load)
    const road = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 20000), 
        new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // Yellow Median
    const line = new THREE.Mesh(new THREE.PlaneGeometry(3, 20000), new THREE.MeshBasicMaterial({color: 0xffcc00}));
    line.rotation.x = -Math.PI/2; line.position.y = 0.2;
    scene.add(line);

    // 3. 🏗️ LOADING LOGIC (Fixing the "Stuck" Issue)
    const loader = new GLTFLoader();
    let toLoad = 3, loaded = 0;

    function itemDone() {
        loaded++;
        let p = Math.floor((loaded / toLoad) * 100);
        document.getElementById('progress-text').innerText = p + "%";
        if(loaded >= toLoad) showStart();
    }

    function showStart() {
        document.getElementById('status').innerText = "READY";
        document.getElementById('start-btn').style.display = "block";
    }

    // Spawn Buildings to the side (X = 350) and spread on Z (-800 * i)
    const loadGroup = (path, xPos) => {
        loader.load(path, (gltf) => {
            const model = gltf.scene;
            model.scale.setScalar(45);
            for(let i=0; i<15; i++) {
                const c = model.clone();
                c.position.set(xPos, 0, -900 * i);
                scene.add(c);
            }
            itemDone();
        }, undefined, (err) => { 
            console.warn("Could not find: " + path); 
            itemDone(); // Still count it as "done" so it doesn't get stuck!
        });
    };

    loadGroup('./models/building.glb', -350);
    loadGroup('./models/b1.glb', 350);
    
    // Trees at X = 110 (Side of road)
    loader.load('./models/t1.glb', (gltf) => {
        const tree = gltf.scene;
        tree.scale.setScalar(3);
        for(let i=0; i<40; i++) {
            const tL = tree.clone(); tL.position.set(-110, 0, -300 * i); scene.add(tL);
            const tR = tree.clone(); tR.position.set(110, 0, -300 * i); scene.add(tR);
        }
        itemDone();
    }, undefined, (err) => itemDone());

    // 4. START & CONTROLS
    document.getElementById('start-btn').onclick = document.getElementById('skip-btn').onclick = () => {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('joy-base').style.display = 'block';
        animate();
    };

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
