<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini City – Smart Loader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #loader-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="loader-ui">
    <h2 id="status">Initializing...</h2>
    <p id="sub-status">Check console (F12) for path errors</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
/**
 * SETUP SCENE
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(100, 100, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 100, 50);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x44aa44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/**
 * SMART LOADER LOGIC
 */
const models = { buildings: [], tree: null };
const uiStatus = document.getElementById('status');
const uiContainer = document.getElementById('loader-ui');

// 1. Define your assets here
const assetsToLoad = [
    { name: 'Building A', url: 'models/building.glb', type: 'building' },
    { name: 'Building B', url: 'models/building1.glb', type: 'building' },
    { name: 'Tree', url: 'models/tree1.glb', type: 'tree' }
];

// 2. Setup the Loading Manager
const manager = new THREE.LoadingManager();

manager.onStart = (url, itemsLoaded, itemsTotal) => {
    uiStatus.innerText = `Loading Assets: 0%`;
};

manager.onProgress = (url, itemsLoaded, itemsTotal) => {
    uiStatus.innerText = `Loading Assets: ${Math.round((itemsLoaded / itemsTotal) * 100)}%`;
};

manager.onLoad = () => {
    uiContainer.style.display = 'none'; // Hide UI when done
    generateCity();
};

manager.onError = (url) => {
    console.error('Error loading:', url);
    uiStatus.innerHTML = "Error detected!<br><small>Running with fallback models</small>";
    // We don't hide the UI here so the user sees the error, 
    // but the manager will still trigger onLoad eventually if we handle errors per-loader.
};

// 3. The Loader
const gltfLoader = new THREE.GLTFLoader(manager);

assetsToLoad.forEach(asset => {
    gltfLoader.load(asset.url, 
        (gltf) => {
            if (asset.type === 'tree') models.tree = gltf.scene;
            else models.buildings.push(gltf.scene);
        },
        undefined,
        (error) => {
            console.warn(`Skipping ${asset.url}: Not found or CORS error.`);
        }
    );
});

/**
 * CITY GENERATION (With Fallbacks)
 */
function generateCity() {
    const spacing = 45;
    const range = 3;

    for (let x = -range; x <= range; x++) {
        for (let z = -range; z <= range; z++) {
            if (x === 0 && z === 0) continue;

            let obj;
            
            // Logic: Try to use GLB, if not, use a Box
            if (Math.random() > 0.3 && models.buildings.length > 0) {
                const randomModel = models.buildings[Math.floor(Math.random() * models.buildings.length)];
                obj = randomModel.clone();
                obj.scale.set(0.4, 0.4, 0.4);
            } else if (models.tree && Math.random() < 0.2) {
                obj = models.tree.clone();
                obj.scale.set(2, 2, 2);
            } else {
                // FALLBACK MESH
                const h = 20 + Math.random() * 30;
                obj = new THREE.Mesh(
                    new THREE.BoxGeometry(15, h, 15),
                    new THREE.MeshStandardMaterial({ color: 0x888888, wireframe: true })
                );
                obj.position.y = h / 2;
            }

            // Apply grid position
            if (obj.position.y === 0) obj.position.y = 0; // Adjust if GLB pivot is at center
            obj.position.x = x * spacing;
            obj.position.z = z * spacing;
            obj.rotation.y = Math.random() * Math.PI;
            
            scene.add(obj);
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
