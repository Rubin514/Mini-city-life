<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini City Life</title>

<style>
    body { margin: 0; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }

    /* Mobile controls */
    .controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10;
    }
    .btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(0,0,0,0.4);
        color: white;
        font-size: 22px;
        border: none;
        margin: 5px;
    }
    .enter {
        position: fixed;
        bottom: 30px;
        right: 20px;
        background: orange;
        color: black;
        width: 90px;
        height: 60px;
        font-size: 20px;
        border-radius: 12px;
        border: none;
    }
</style>
</head>

<body>

<!-- MOBILE CONTROLS -->
<div class="controls">
    <div style="text-align:center">
        <button class="btn" id="up">↑</button>
    </div>
    <div>
        <button class="btn" id="left">←</button>
        <button class="btn">●</button>
        <button class="btn" id="right">→</button>
    </div>
    <div style="text-align:center">
        <button class="btn" id="down">↓</button>
    </div>
</div>

<button class="enter">ENTER</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff, 0.9));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50, 50, 50);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

scene.add(new THREE.GridHelper(500, 50));

/* PLAYER */
const player = new THREE.Object3D();
player.position.set(0, 2, 10);
scene.add(player);

camera.position.set(0, 2, 5);
player.add(camera);

/* MOVEMENT */
const move = { forward:false, back:false, left:false, right:false };

const speed = 0.15;

/* MOBILE BUTTON EVENTS */
up.ontouchstart = () => move.forward = true;
up.ontouchend   = () => move.forward = false;

down.ontouchstart = () => move.back = true;
down.ontouchend   = () => move.back = false;

left.ontouchstart = () => move.left = true;
left.ontouchend   = () => move.left = false;

right.ontouchstart = () => move.right = true;
right.ontouchend   = () => move.right = false;

/* BUILDINGS */
const loader = new GLTFLoader();

loader.load(
    "models/building.glb",
    (gltf) => {

        const base = gltf.scene;
        base.scale.set(1, 1, 1);

        const spacing = 20;
        const size = 4;

        for (let x = -size; x <= size; x++) {
            for (let z = -size; z <= size; z++) {

                const b = base.clone();

                /* 🔥 GROUND FLOOR HEIGHT FIX */
                b.position.set(
                    x * spacing,
                    1.8,   // <-- THIS FIXES SINKING
                    z * spacing
                );

                b.rotation.y = Math.random() * Math.PI * 2;
                scene.add(b);
            }
        }
    }
);

/* RESIZE */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* LOOP */
function animate() {
    requestAnimationFrame(animate);

    if (move.forward) player.translateZ(-speed);
    if (move.back)    player.translateZ(speed);
    if (move.left)    player.rotation.y += 0.03;
    if (move.right)   player.rotation.y -= 0.03;

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
