<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini City Life - Final</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: sans-serif; }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.5s;
        }
        #loading-text { color: #fff; font-size: 18px; margin-bottom: 15px; }
        #bar-bg { width: 250px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.3s; }
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 80px; height: 80px; background: rgba(255,255,255,0.3); border-radius: 50%; display: none; }
        #joystick-knob { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div id="loading-text">Loading City Assets: 0%</div>
    <div id="bar-bg"><div id="bar-fill"></div></div>
</div>

<div id="joystick-base"><div id="joystick-knob"></div></div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // UI Elements
    const lOverlay = document.getElementById("loading-overlay");
    const lText = document.getElementById("loading-text");
    const lFill = document.getElementById("bar-fill");
    const jBase = document.getElementById("joystick-base");

    // Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lights - Improved for Draco models
    scene.add(new THREE.AmbientLight(0xffffff, 2.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(10, 30, 10);
    scene.add(sun);

    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 500), 
        new THREE.MeshStandardMaterial({ color: 0x4caf50 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Loading Manager
    const manager = new THREE.LoadingManager();
    manager.onProgress = (url, loaded, total) => {
        const p = Math.round((loaded / total) * 100);
        lText.innerText = `Loading Assets: ${p}%`;
        lFill.style.width = p + "%";
    };
    manager.onLoad = () => {
        lOverlay.style.opacity = "0";
        setTimeout(() => {
            lOverlay.style.display = "none";
            jBase.style.display = "block";
        }, 500);
    };

    // Draco Setup
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    const loader = new GLTFLoader(manager);
    loader.setDRACOLoader(draco);

    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    function loadCity(file, x, z, isPlayer = false) {
        loader.load(`./models/${file}`, (gltf) => {
            const m = gltf.scene;
            const box = new THREE.Box3().setFromObject(m);
            const size = box.getSize(new THREE.Vector3());
            const s = 15 / Math.max(size.x, size.y, size.z);
            m.scale.setScalar(s);

            if (isPlayer) {
                playerGroup.add(m);
            } else {
                m.position.set(x, 0, z);
                scene.add(m);
            }
        });
    }

    // Load Files into a Street Layout
    loadCity("building.glb", -35, -20);
    loadCity("b1.glb", 35, -20);
    loadCity("t1.glb", 0, 0, true);

    // Joystick
    let moveX = 0, moveZ = 0, dragging = false;
    const knob = document.getElementById('joystick-knob');
    jBase.onpointerdown = () => dragging = true;
    window.onpointermove = (e) => {
        if (!dragging) return;
        const b = jBase.getBoundingClientRect();
        let dx = e.clientX - (b.left + 40);
        let dy = e.clientY - (b.top + 40);
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 30);
        const angle = Math.atan2(dy, dx);
        knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        moveX = (Math.cos(angle) * dist) / 30;
        moveZ = (Math.sin(angle) * dist) / 30;
    };
    window.onpointerup = () => { dragging = false; knob.style.transform = ''; moveX = 0; moveZ = 0; };

    function animate() {
        requestAnimationFrame(animate);
        playerGroup.position.x += moveX * 0.4;
        playerGroup.position.z += moveZ * 0.4;

        // Camera follow logic
        camera.position.set(playerGroup.position.x, 25, playerGroup.position.z + 55);
        camera.lookAt(playerGroup.position);
        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
