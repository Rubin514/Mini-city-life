<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini City Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #debug-ui {
            position: absolute; top: 10px; left: 10px;
            color: white; font-family: monospace;
            background: rgba(0,0,0,0.8); padding: 10px;
            border-radius: 5px; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

<div id="debug-ui">Status: Loading Engine...</div>

<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
  }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const statusLabel = document.getElementById('debug-ui');

    /* 1. SCENE SETUP */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky Blue

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    /* 2. HELPERS & LIGHTS */
    const grid = new THREE.GridHelper(20, 20);
    scene.add(grid);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 2);
    sunLight.position.set(5, 10, 7);
    scene.add(sunLight);

    /* 3. CONTROLS */
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    /* 4. LOADING THE MODEL */
    const loader = new GLTFLoader();
    
    // NOTE: Ensure your folder is 'models' and file is 'building.glb' (all lowercase)
    const modelPath = './models/building.glb'; 
    
    statusLabel.innerText = "Status: Fetching " + modelPath;

    loader.load(
        modelPath,
        (gltf) => {
            const model = gltf.scene;
            scene.add(model);

            // Center the camera on the model automatically
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            controls.target.copy(center);
            
            statusLabel.innerText = "Status: Online";
            statusLabel.style.color = "#00ff00";
        },
        (xhr) => {
            if (xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                statusLabel.innerText = `Status: Loading ${percent}%`;
            }
        },
        (error) => {
            console.error(error);
            statusLabel.innerText = "Status: Error loading GLB. Check file path/name.";
            statusLabel.style.color = "#ff4444";
        }
    );

    /* 5. ANIMATION LOOP */
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    /* 6. RESIZE HANDLING */
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
