<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Life - Fixed Scale</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #joy-base { position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 50%; z-index: 20; }
        #joy-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: #fff; border-radius: 50%; }
        #loading { position: absolute; inset: 0; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body>

<div id="loading">OPTIMIZING CITY SCALE...</div>
<div id="crosshair"></div>
<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // 1. SCENE SETUP
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 2.0));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(50, 100, 50);
    scene.add(sun);

    // 2. ROAD & SIDEWALK (Widened for comfort)
    const road = new THREE.Mesh(new THREE.PlaneGeometry(80, 5000), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    const sidewalkL = new THREE.Mesh(new THREE.PlaneGeometry(100, 5000), new THREE.MeshStandardMaterial({ color: 0x777777 }));
    sidewalkL.rotation.x = -Math.PI / 2;
    sidewalkL.position.set(-90, 0.1, 0); // Pushed out further
    scene.add(sidewalkL);

    const sidewalkR = sidewalkL.clone();
    sidewalkR.position.set(90, 0.1, 0);
    scene.add(sidewalkR);

    // 3. PLAYER SETUP
    const player = new THREE.Group();
    scene.add(player);
    camera.position.set(0, 15, 0); // Eye Level
    player.add(camera);

    // 4. LOADING MODELS
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);

    function load(file, x, z, s, isP = false) {
        loader.load(`./models/${file}`, (gltf) => {
            const m = gltf.scene;
            m.scale.setScalar(s); 
            if (isP) {
                player.add(m);
                m.position.set(0, -10, -5); // Position tree body slightly forward & down so it's visible but not blocking
                document.getElementById('loading').style.display = 'none';
            } else {
                m.position.set(x, 0, z);
                scene.add(m);
            }
        });
    }

    // Fixed Scaling: 40 instead of 100 (Much more natural)
    for(let i = 0; i < 8; i++) {
        // Pushing buildings 140 units away from center so they stay on the sidewalk
        load("building.glb", -140, -400 * i, 40); 
        load("b1.glb", 140, -400 * i, 40);
    }
    load("t1.glb", 0, 0, 10, true);

    // 5. CONTROLS (One Joystick + Screen Swipe)
    let moveInput = { x: 0, z: 0 };
    let joyActive = false;
    const base = document.getElementById('joy-base'), knob = document.getElementById('joy-knob');

    base.onpointerdown = (e) => { joyActive = true; base.setPointerCapture(e.pointerId); };
    base.onpointermove = (e) => {
        if (!joyActive) return;
        const r = base.getBoundingClientRect();
        const dx = (e.clientX - (r.left + 50)) / 50, dy = (e.clientY - (r.top + 50)) / 50;
        const d = Math.min(Math.sqrt(dx*dx + dy*dy), 1);
        const a = Math.atan2(dy, dx);
        knob.style.transform = `translate(${Math.cos(a)*d*40}px, ${Math.sin(a)*d*40}px)`;
        moveInput.x = Math.cos(a) * d; moveInput.z = Math.sin(a) * d;
    };
    window.onpointerup = () => { joyActive = false; knob.style.transform = ''; moveInput = {x:0, z:0}; };

    let yaw = 0, pitch = 0;
    window.onpointermove = (e) => {
        if (joyActive) return; // Only use screen for looking if not using joystick
        if (e.pointerType === 'touch' || e.buttons === 1) {
            yaw -= e.movementX * 0.005;
            pitch -= e.movementY * 0.005;
            pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
        }
    };

    // 6. GAME LOOP
    function animate() {
        requestAnimationFrame(animate);
        player.rotation.y = yaw;
        camera.rotation.x = pitch;

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
        player.position.addScaledVector(forward, -moveInput.z * 1.5);
        player.position.addScaledVector(right, moveInput.x * 1.5);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
