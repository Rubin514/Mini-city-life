<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini City Life – FIXED</title>
<style>
    body { margin: 0; overflow: hidden; background: #222; }
    #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #fff;
        background: rgba(0,0,0,0.6);
        padding: 10px;
        font-family: monospace;
    }
</style>
</head>
<body>
<div id="info">Loading models…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);
camera.position.set(0, 40, 80);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 100, 50);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshStandardMaterial({ color: 0x55aa55 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* MODEL LOADER */
const loader = new GLTFLoader();
const info = document.getElementById('info');

function smartLoad(path, x) {
    loader.load(
        path,
        (gltf) => {
            const model = gltf.scene;

            // 🔑 CRITICAL FIX
            model.updateMatrixWorld(true);

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            const scale = 20 / maxDim;
            model.scale.setScalar(scale);

            // Center model properly
            model.position.set(x, 0, 0);

            // Lift above ground
            model.position.y = -box.min.y * scale;

            scene.add(model);
            info.innerHTML += `<br>✔ Loaded ${path}`;
        },
        undefined,
        () => {
            info.innerHTML += `<br>❌ Failed ${path}`;
        }
    );
}

/* LOAD ALL MODELS */
smartLoad('models/building.glb', -30);
smartLoad('models/building1.glb', 30);
smartLoad('models/tree1.glb', 0);

/* ANIMATE */
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

/* RESIZE */
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
