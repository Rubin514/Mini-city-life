<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - GTA Style</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* HUD & Minimap */
        #hud { position: fixed; top: 15px; left: 15px; z-index: 100; pointer-events: none; }
        #minimap { width: 120px; height: 120px; background: rgba(0,0,0,0.7); border: 2px solid #fff; position: relative; border-radius: 5px; }
        #pDot { width: 8px; height: 8px; background: #fff; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border: 1px solid #000; }
        #targetDot { width: 10px; height: 10px; background: #f0f; position: absolute; border-radius: 2px; display: none; box-shadow: 0 0 5px #f0f; }
        #missionBox { background: rgba(0,0,0,0.85); color: #0f0; padding: 10px; margin-top: 10px; border-radius: 5px; font-size: 14px; max-width: 200px; border-left: 4px solid #fbc02d; }

        /* Overlays */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; }
        .menu-btn { padding: 12px 25px; margin: 6px; background: #333; border: 1px solid #777; color: #fff; border-radius: 5px; width: 220px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .menu-btn:hover { background: #555; border-color: #fff; }

        /* Controls */
        #controls { position: fixed; bottom: 30px; left: 30px; z-index: 100; display: grid; grid-template-areas: ". u ." "l d r"; gap: 10px; }
        .btn { width: 60px; height: 60px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.8); border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; user-select: none; }
        .btn:active { background: rgba(255,255,255,0.4); }
        #jump { position: fixed; bottom: 40px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: #ff9800; border: 3px solid #fff; font-weight: bold; }
        
        #topBtns { position: fixed; top: 15px; right: 15px; z-index: 100; display: flex; gap: 8px; }
        #loading-screen { position: fixed; inset: 0; background: #111; color: #0f0; display: flex; align-items: center; justify-content: center; z-index: 1000; font-family: monospace; }
    </style>
</head>
<body>

<div id="loading-screen">INITIALIZING CITY ASSETS...</div>

<div id="hud">
    <div id="minimap"><div id="pDot"></div><div id="targetDot"></div></div>
    <div id="missionBox">
        <div id="mTitle" style="font-weight:bold;">NO MISSION</div>
        <div id="mGoal">Open the Mission Menu</div>
    </div>
</div>

<div id="topBtns">
    <button class="menu-btn" style="width:auto;" onclick="openMenu('missionMenu')">MISSIONS</button>
    <button class="menu-btn" style="width:auto;" onclick="openMenu('settings')">⚙️</button>
</div>

<div id="missionMenu" class="overlay">
    <h2>SELECT MISSION</h2>
    <div id="missionList" style="overflow-y:auto; max-height: 70vh;"></div>
    <button class="menu-btn" style="background:#800;" onclick="closeMenu('missionMenu')">CLOSE</button>
</div>

<div id="settings" class="overlay">
    <h2>SETTINGS</h2>
    <div style="margin: 20px 0;">
        <label>Sensitivity</label><br>
        <input type="range" id="sens" min="1" max="10" value="4" style="width: 200px;">
    </div>
    <button class="menu-btn" onclick="closeMenu('settings')">BACK</button>
</div>

<div id="controls">
    <div class="btn" style="grid-area:u" id="u">▲</div>
    <div class="btn" style="grid-area:l" id="l">◀</div>
    <div class="btn" style="grid-area:d" id="d">▼</div>
    <div class="btn" style="grid-area:r" id="r">▶</div>
</div>
<button id="jump" class="btn">JUMP</button>

<script type="importmap">
{
    "imports": { 
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js", 
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/" 
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* --- ENGINE SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(100, 200, 100);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x44aa44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* --- ASSET LOADING --- */
const models = { b1: null, b2: null, tree: null };
const colliders = [];
const loader = new GLTFLoader();
let assetsToLoad = 3;
let assetsLoaded = 0;

const createFallback = (color, w, h, d) => {
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
    m.position.y = h/2;
    g.add(m);
    return g;
};

const checkReady = () => {
    assetsLoaded++;
    if (assetsLoaded >= assetsToLoad) {
        document.getElementById('loading-screen').style.display = 'none';
        initCity();
    }
};

const loadAsset = (url, key, fallback) => {
    loader.load(url, 
        (g) => { models[key] = g.scene; checkReady(); }, 
        undefined, 
        () => { models[key] = fallback; checkReady(); }
    );
};

loadAsset('./models/building.glb', 'b1', createFallback(0x777777, 40, 100, 40));
loadAsset('./models/building2.glb', 'b2', createFallback(0x555555, 50, 150, 50));
loadAsset('./models/tree.glb', 'tree', createFallback(0x228B22, 10, 30, 10));

/* --- MISSIONS --- */
const missions = [
    { title: "Pizza Delivery", goal: "Blue House", x: 800, z: -400, color: 0x0000ff },
    { title: "Key Thief", goal: "Golden Cache", x: -1200, z: 1200, color: 0xffff00 },
    { title: "Lookout", goal: "Pink Tower", x: 400, z: 1600, color: 0xff00ff },
    { title: "Stolen Crate", goal: "Red Zone", x: -400, z: -1200, color: 0xff0000 },
    { title: "Radio Fix", goal: "Grey Antenna", x: 1800, z: 1800, color: 0x888888 },
    { title: "Park Ranger", goal: "Green Field", x: 0, z: -1800, color: 0x00ff00 },
    { title: "Secret Meeting", goal: "The Black Wall", x: -1800, z: 200, color: 0x222222 },
    { title: "Water Supply", goal: "Cyan Station", x: 1200, z: 600, color: 0x00ffff }
];

let targetObj = null;
window.startMission = (id) => {
    const m = missions[id % missions.length];
    if(targetObj) scene.remove(targetObj);
    
    targetObj = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 40), new THREE.MeshBasicMaterial({ color: m.color }));
    targetObj.position.set(m.x, 20, m.z);
    scene.add(targetObj);
    
    document.getElementById('mTitle').innerText = m.title;
    document.getElementById('mGoal').innerText = "Target: " + m.goal;
    closeMenu('missionMenu');
};

/* --- CITY GENERATION --- */
const initCity = () => {
    const spacing = 400;
    for(let x=-6; x<=6; x++){
        for(let z=-6; z<=6; z++){
            if(x === 0 && z === 0) continue;
            
            const px = x * spacing;
            const pz = z * spacing;
            const model = (x+z) % 2 === 0 ? models.b1 : models.b2;
            
            const b = model.clone();
            b.position.set(px, 0, pz);
            scene.add(b);
            colliders.push({x: px, z: pz, r: 70});

            if(Math.random() > 0.5 && models.tree) {
                const t = models.tree.clone();
                t.position.set(px + 120, 0, pz + 120);
                scene.add(t);
            }
        }
    }
};

/* --- PLAYER LOGIC --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 400);
scene.add(player);
player.add(camera);

let yaw=0, pitch=0, vY=0, input={f:0,b:0,l:0,r:0}, config={sens:0.004};

function animate() {
    requestAnimationFrame(animate);
    let nx = player.position.x, nz = player.position.z, spd = 6;
    
    if(input.f){ nx -= Math.sin(yaw)*spd; nz -= Math.cos(yaw)*spd; }
    if(input.b){ nx += Math.sin(yaw)*spd; nz += Math.cos(yaw)*spd; }
    if(input.l){ nx -= Math.cos(yaw)*spd; nz += Math.sin(yaw)*spd; }
    if(input.r){ nx += Math.cos(yaw)*spd; nz -= Math.sin(yaw)*spd; }

    let hit = false;
    for(let c of colliders) if(Math.hypot(nx-c.x, nz-c.z) < c.r) hit=true;
    if(!hit){ player.position.x=nx; player.position.z=nz; }

    vY -= 0.02; player.position.y += vY;
    if(player.position.y < 10){ player.position.y=10; vY=0; }

    if(targetObj){
        targetObj.rotation.y += 0.04;
        const dist = player.position.distanceTo(targetObj.position);
        const tDot = document.getElementById('targetDot');
        tDot.style.display = 'block';
        // Relative position on 120px minimap
        tDot.style.left = (60 + (targetObj.position.x - player.position.x)/35) + 'px';
        tDot.style.top = (60 + (targetObj.position.z - player.position.z)/35) + 'px';
        if(dist < 60) { alert("Objective Reached!"); scene.remove(targetObj); targetObj=null; tDot.style.display='none'; }
    }

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}

/* --- UI & BINDINGS --- */
window.openMenu = (id) => document.getElementById(id).style.display = 'flex';
window.closeMenu = (id) => document.getElementById(id).style.display = 'none';

const list = document.getElementById('missionList');
for(let i=1; i<=20; i++) {
    const b = document.createElement('button');
    b.className = 'menu-btn';
    b.innerText = "Mission " + i;
    b.onclick = () => startMission(i-1);
    list.appendChild(b);
}

const bind = (id, k) => {
    const e = document.getElementById(id);
    e.onpointerdown = (ev) => { ev.preventDefault(); input[k]=1; };
    e.onpointerup = () => input[k]=0;
    e.onpointerleave = () => input[k]=0;
};
bind("u","f"); bind("d","b"); bind("l","l"); bind("r","r");

document.getElementById("jump").onpointerdown = () => { if(player.position.y <= 11) vY = 0.5; };
document.getElementById("sens").oninput = (e) => config.sens = e.target.value * 0.001;

let drag=false, lx, ly;
renderer.domElement.onpointerdown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
window.onpointerup = () => drag=false;
window.onpointermove = e => { 
    if(drag){ 
        yaw -= (e.clientX - lx) * config.sens; 
        pitch -= (e.clientY - ly) * config.sens; 
        pitch = Math.max(-1.2, Math.min(1.2, pitch));
        lx = e.clientX; ly = e.clientY; 
    }
};

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
        </html>
