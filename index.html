<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini City Life</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
    }
</style>
</head>
<body>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

/* ---------------- SCENE ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* ---------------- CAMERA ---------------- */
const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 8, 18);

/* ---------------- RENDERER ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------------- LIGHTS ---------------- */
scene.add(new THREE.AmbientLight(0xffffff, 1.3));

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(10, 20, 10);
scene.add(sun);

/* ---------------- GROUND ---------------- */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------------- MODEL LOADER ---------------- */
const loader = new GLTFLoader();

/* 🔑 ABSOLUTE PATH (VERY IMPORTANT) */
const BASE = "https://rubin514.github.io/Mini-city-life/models/";

/* ---------------- BUILDING 1 ---------------- */
loader.load(
    BASE + "building.glb",
    gltf => {
        const model = gltf.scene;
        model.position.set(-12, 0, -10);
        scene.add(model);
    },
    undefined,
    error => console.error("building.glb error", error)
);

/* ---------------- BUILDING 2 ---------------- */
loader.load(
    BASE + "b1.glb",
    gltf => {
        const model = gltf.scene;
        model.position.set(12, 0, -10);
        scene.add(model);
    },
    undefined,
    error => console.error("b1.glb error", error)
);

/* ---------------- PLAYER (TREE) ---------------- */
const player = new THREE.Group();
scene.add(player);

loader.load(
    BASE + "t1.glb",
    gltf => {
        const model = gltf.scene;
        model.scale.set(1.5, 1.5, 1.5);
        player.add(model);
    },
    undefined,
    error => console.error("t1.glb error", error)
);

/* ---------------- ANIMATE ---------------- */
function animate() {
    requestAnimationFrame(animate);

    // small rotation so you KNOW it loaded
    player.rotation.y += 0.01;

    // camera follow
    camera.position.lerp(
        new THREE.Vector3(
            player.position.x,
            player.position.y + 8,
            player.position.z + 18
        ),
        0.1
    );
    camera.lookAt(player.position);

    renderer.render(scene, camera);
}
animate();

/* ---------------- RESIZE ---------------- */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
