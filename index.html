<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City - 20 Missions Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }

        /* HUD */
        #hud { position: fixed; top: 15px; left: 15px; z-index: 100; color: #fff; pointer-events: none; }
        #missionHUD { background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; border-left: 5px solid #00ff00; display: none; }

        /* Controls */
        #ctrls { position: fixed; bottom: 20px; left: 20px; z-index: 100; display: grid; grid-template-areas: ". u ." "l d r"; }
        .btn { width: 60px; height: 60px; margin: 4px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; }
        #jump { position: fixed; bottom: 30px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: #ff9800; border: 3px solid #fff; color: white; font-weight: bold; }
        
        #menuBtn { position: fixed; top: 15px; right: 15px; padding: 12px 20px; background: #00ff00; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 500; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; color: white; }
        .m-item { background: #222; padding: 15px; margin: 5px; width: 90%; border-radius: 8px; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="hud">
    <div id="missionHUD">
        <b id="mTitle">City Mission</b><br>
        <span id="mDist">Distance: 0m</span>
    </div>
</div>

<button id="menuBtn" onclick="toggleMenu(true)">MISSIONS</button>

<div id="overlay">
    <h1>20 MISSIONS</h1>
    <div id="list"></div>
    <button onclick="toggleMenu(false)" style="margin-top:20px; padding:15px; background:red; color:#fff; border:none; border-radius:8px;">CLOSE</button>
</div>

<div id="ctrls">
    <div class="btn" style="grid-area:u" id="u">▲</div>
    <div class="btn" style="grid-area:l" id="l">◀</div>
    <div class="btn" style="grid-area:d" id="d">▼</div>
    <div class="btn" style="grid-area:r" id="r">▶</div>
</div>
<button id="jump">JUMP</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.152.2/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(100, 500, 100);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x3a9d23 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* --- LOADING ASSETS --- */
const loader = new GLTFLoader();
const assets = { b1: null, b2: null, tree: null };

// Manual check: Make sure these names match your files exactly!
loader.load('building.glb', (g) => { assets.b1 = g.scene; buildCity(); });
loader.load('building2.glb', (g) => { assets.b2 = g.scene; buildCity(); });
loader.load('tree1.glb', (g) => { assets.tree = g.scene; buildCity(); });

/* --- CITY GENERATOR --- */
const colliders = [];
let cityBuilt = false;

function buildCity() {
    // Only build once all 3 models are ready
    if (!assets.b1 || !assets.b2 || !assets.tree || cityBuilt) return;
    cityBuilt = true;

    for (let x = -8; x <= 8; x++) {
        for (let z = -8; z <= 8; z++) {
            if (x === 0 && z === 0) continue;
            const px = x * 800, pz = z * 800;

            // USE BUILDING 1 and BUILDING 2
            const bModel = (x + z) % 2 === 0 ? assets.b1.clone() : assets.b2.clone();
            bModel.position.set(px, 0, pz);
            scene.add(bModel);
            colliders.push({ x: px, z: pz, r: 100 });

            // USE TREE 1
            const tModel = assets.tree.clone();
            tModel.position.set(px + 200, 0, pz + 200);
            scene.add(tModel);
        }
    }
}

/* --- MISSIONS --- */
const missions = Array.from({length: 20}, (_, i) => ({
    id: i, title: `Mission ${i+1}`,
    pos: { x: (Math.random()-0.5)*7000, z: (Math.random()-0.5)*7000 }
}));

let activeM = null, targetMesh = null;
window.startMission = (i) => {
    activeM = missions[i];
    if (targetMesh) scene.remove(targetMesh);
    targetMesh = new THREE.Mesh(new THREE.SphereGeometry(40), new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true }));
    targetMesh.position.set(activeM.pos.x, 40, activeM.pos.z);
    scene.add(targetMesh);
    document.getElementById('mTitle').innerText = activeM.title;
    document.getElementById('missionHUD').style.display = 'block';
    toggleMenu(false);
};

/* --- PLAYER --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 400);
scene.add(player);
player.add(camera);

let yaw=0, pitch=0, vY=0, input={f:0,b:0,l:0,r:0};

function animate() {
    requestAnimationFrame(animate);
    let nx=player.position.x, nz=player.position.z, spd=7;
    if(input.f){ nx -= Math.sin(yaw)*spd; nz -= Math.cos(yaw)*spd; }
    if(input.b){ nx += Math.sin(yaw)*spd; nz += Math.cos(yaw)*spd; }
    if(input.l){ nx -= Math.cos(yaw)*spd; nz += Math.sin(yaw)*spd; }
    if(input.r){ nx += Math.cos(yaw)*spd; nz -= Math.sin(yaw)*spd; }

    let hit = false;
    for(let c of colliders) if(Math.hypot(nx-c.x, nz-c.z) < c.r) hit=true;
    if(!hit){ player.position.x=nx; player.position.z=nz; }

    vY -= 0.02; player.position.y += vY;
    if(player.position.y < 10){ player.position.y=10; vY=0; }

    if(activeM) {
        const d = player.position.distanceTo(targetMesh.position);
        document.getElementById('mDist').innerText = `Distance: ${Math.round(d)}m`;
        if(d < 70) { alert("Mission Clear!"); activeM=null; scene.remove(targetMesh); document.getElementById('missionHUD').style.display = 'none'; }
    }

    player.rotation.y = yaw;
    renderer.render(scene, camera);
}
animate();

/* --- UI --- */
window.toggleMenu = (s) => document.getElementById('overlay').style.display = s?'flex':'none';
const list = document.getElementById('list');
missions.forEach((m, i) => {
    const b = document.createElement('div');
    b.className = 'm-item';
    b.innerHTML = `<b>${m.title}</b>`;
    b.onclick = () => startMission(i);
    list.appendChild(b);
});

const b = (id, k) => {
    const e = document.getElementById(id);
    e.onpointerdown = (ev) => { ev.preventDefault(); input[k]=1; };
    e.onpointerup = () => input[k]=0;
};
b("u","f"); b("d","b"); b("l","l"); b("r","r");
document.getElementById("jump").onpointerdown = () => { if(player.position.y<=11) vY=0.6; };

let drag=false, lx;
renderer.domElement.onpointerdown = e => { drag=true; lx=e.clientX; };
window.onpointerup = () => drag=false;
window.onpointermove = e => { if(drag){ yaw-=(e.clientX-lx)*0.005; lx=e.clientX; }};
</script>
</body>
</html>
