<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Fixed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
        canvas { display: block; touch-action: none; }
        #homeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; }
        #loaderBar { width: 240px; height: 12px; background: #333; border-radius: 6px; margin-top: 20px; overflow: hidden; }
        #loaderProgress { width: 0%; height: 100%; background: #00ff00; }
        #playBtn { font-size: 22px; padding: 12px 50px; border: 2px solid #00ff00; background: none; color: #00ff00; cursor: pointer; border-radius: 50px; display: none; margin-top: 25px; }
        #controls { position: fixed; bottom: 25px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; margin: 5px; border-radius: 15px; font-size: 24px; background: rgba(0,0,0,0.6); border: 1px solid #fff; color: white; display: flex; align-items: center; justify-content: center; user-select: none; }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }
        #jumpBtn { position: fixed; bottom: 35px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: #ff9800; color: white; border: 2px solid #fff; font-weight: bold; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>MINI CITY LIFE</h1>
    <div id="loaderBar"><div id="loaderProgress"></div></div>
    <div id="percentText" style="color:#00ff00; margin-top:10px;">0%</div>
    <button id="playBtn">START GAME</button>
</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>
<button id="jumpBtn">JUMP</button>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 2000);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(100, 500, 100);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshLambertMaterial({ color: 0x4CAF50 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* --- LOADING LOGIC --- */
const manager = new THREE.LoadingManager();
const loader = new GLTFLoader(manager);
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(draco);

const models = { b: [], tree: null };
const colliders = [];

manager.onProgress = (url, loaded, total) => {
    let p = (loaded / total) * 100;
    document.getElementById('loaderProgress').style.width = p + '%';
    document.getElementById('percentText').innerText = Math.round(p) + '%';
};

manager.onLoad = () => {
    document.getElementById('playBtn').style.display = "block";
    generateCity();
};

// Load both building types
loader.load('./models/building.glb', (g) => models.b.push(g.scene));
loader.load('./models/building2.glb', (g) => models.b.push(g.scene));
loader.load('./models/tree1.glb', (g) => { models.tree = g.scene; });

function generateCity() {
    // 5x5 Grid for better performance
    for (let x = -2; x <= 2; x++) {
        for (let z = -2; z <= 2; z++) {
            if (x === 0 && z === 0) continue; 
            
            const px = x * 600;
            const pz = z * 600;

            if (models.b.length > 0) {
                // Randomly pick building 1 or 2
                const bIndex = Math.floor(Math.random() * models.b.length);
                const b = models.b[bIndex].clone();
                
                // FIXED SCALE: Set to 1 because your models are already huge
                b.scale.set(1, 1, 1); 
                b.position.set(px, 0, pz);
                scene.add(b);
                
                // Collision radius (how close you can get)
                colliders.push({ x: px, z: pz, r: 80 });
            }

            if (models.tree) {
                const t = models.tree.clone();
                t.scale.set(0.5, 0.5, 0.5); // Trees were also too big
                t.position.set(px + 150, 0, pz + 150);
                scene.add(t);
            }
        }
    }
}

/* --- MOVEMENT --- */
const player = new THREE.Object3D();
player.position.set(0, 5, 100); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, velocityY = 0;
const move = { up: false, down: false, left: false, right: false };

function update() {
    let nx = player.position.x, nz = player.position.z, spd = 3.5;
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    let hit = false;
    for (let c of colliders) {
        if (Math.hypot(nx - c.x, nz - c.z) < c.r) { hit = true; break; }
    }
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY -= 0.02; player.position.y += velocityY;
    if (player.position.y < 5) { player.position.y = 5; velocityY = 0; }
}

function animate() {
    requestAnimationFrame(animate);
    update();
    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}
animate();

// Inputs
const bind = (id, k) => {
    document.getElementById(id).onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    document.getElementById(id).onpointerup = () => move[k] = false;
};
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");
document.getElementById("jumpBtn").onclick = () => { if(player.position.y <= 5.1) velocityY = 0.5; };
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

// Touch look
let drag = false, lx, ly;
window.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => {
    if (drag) {
        yaw -= (e.clientX - lx) * 0.005;
        pitch = Math.max(-1, Math.min(1, pitch - (e.clientY - ly) * 0.005));
        lx = e.clientX; ly = e.clientY;
    }
};
</script>
</body>
</html>
