<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Master Build</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; }
        
        /* LOADING SCREEN */
        #loader {
            position: fixed; inset: 0; background: #111; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #00ff00; transition: opacity 0.5s;
        }
        .bar-container { width: 250px; height: 15px; background: #333; border-radius: 8px; margin-top: 15px; overflow: hidden; border: 2px solid #555; }
        #bar { width: 0%; height: 100%; background: #00ff00; box-shadow: 0 0 15px #00ff00; transition: width 0.2s; }
        
        /* HUD */
        #hud { position: fixed; top: 15px; left: 15px; pointer-events: none; z-index: 100; }
        .mission-box { background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-radius: 10px; border-left: 5px solid #00ff00; display: none; }
        
        /* CONTROLS */
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 100; display: grid; grid-template-areas: ". u ." "l d r"; gap: 10px; }
        .btn { width: 65px; height: 65px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; backdrop-filter: blur(5px); }
        .btn:active { background: rgba(0,255,0,0.5); border-color: #00ff00; }
        
        #jump { position: fixed; bottom: 40px; right: 30px; width: 85px; height: 85px; background: #ff9800; border-radius: 50%; border: 3px solid #fff; color: white; font-weight: bold; font-size: 18px; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #jump:active { transform: scale(0.95); }

        #missionBtn { position: fixed; top: 15px; right: 15px; padding: 12px 25px; background: #00ff00; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; z-index: 100; box-shadow: 0 4px 0 #00aa00; }
        #missionBtn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<div id="loader">
    <h2 id="status">CONNECTING...</h2>
    <div class="bar-container"><div id="bar"></div></div>
    <p id="perc">0%</p>
</div>

<div id="hud">
    <div id="missionBox" class="mission-box">
        <b id="mTitle" style="color:#00ff00; font-size: 18px;">TARGET ACQUIRED</b><br>
        <span id="mDist" style="font-size: 24px;">0m</span>
    </div>
</div>

<button id="missionBtn">NEW MISSION</button>

<div id="controls">
    <div class="btn" style="grid-area:u" id="btnU">▲</div>
    <div class="btn" style="grid-area:l" id="btnL">◀</div>
    <div class="btn" style="grid-area:d" id="btnD">▼</div>
    <div class="btn" style="grid-area:r" id="btnR">▶</div>
</div>
<button id="jump">JUMP</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.152.2/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* 1. SETUP */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Sky Blue
scene.fog = new THREE.Fog(0x87ceeb, 200, 2000); // Distance Fog

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(100, 500, 100);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x33aa33 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* 2. LOADING ASSETS (Models Folder) */
const manager = new THREE.LoadingManager();
const loader = new GLTFLoader(manager);
const assets = { b1: null, b2: null, tree: null };
const colliders = [];

manager.onProgress = (url, loaded, total) => {
    const p = Math.floor((loaded / total) * 100);
    document.getElementById('bar').style.width = p + "%";
    document.getElementById('perc').innerText = p + "%";
    document.getElementById('status').innerText = "LOADING CITY...";
};

manager.onLoad = () => {
    generateCity();
    document.getElementById('loader').style.opacity = 0;
    setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);
};

// CRITICAL: PATHS TO YOUR MODELS FOLDER
loader.load('models/building.glb', (g) => { assets.b1 = g.scene; });
loader.load('models/building2.glb', (g) => { assets.b2 = g.scene; });
loader.load('models/tree1.glb', (g) => { assets.tree = g.scene; });

function generateCity() {
    // We increase grid size to 1500 to prevent overlap
    for(let x = -6; x <= 6; x++) {
        for(let z = -6; z <= 6; z++) {
            if(x === 0 && z === 0) continue; // Save spawn area
            
            const px = x * 1500;
            const pz = z * 1500;
            
            // 50% chance for Building 1 or Building 2
            const buildType = (x + z) % 2 === 0 ? assets.b1 : assets.b2;
            
            if(buildType) {
                const b = buildType.clone();
                // SCALE FIX: Make them huge so you can definitely see them
                b.scale.set(60, 60, 60); 
                b.position.set(px, 0, pz);
                scene.add(b);
                // Invisible wall around building
                colliders.push({x: px, z: pz, r: 250});
            }
            
            if(assets.tree) {
                const t = assets.tree.clone();
                t.scale.set(30, 30, 30);
                t.position.set(px + 500, 0, pz + 500);
                scene.add(t);
            }
        }
    }
}

/* 3. GAMEPLAY & MISSIONS */
const missions = Array.from({length: 20}, (_, i) => ({
    id: i,
    title: `CONTRACT #${i+101}`,
    pos: { x: (Math.random()-0.5)*9000, z: (Math.random()-0.5)*9000 }
}));

let activeM = null, targetMark = null;

document.getElementById('missionBtn').onclick = () => {
    activeM = missions[Math.floor(Math.random() * missions.length)];
    
    if(targetMark) scene.remove(targetMark);
    targetMark = new THREE.Mesh(new THREE.SphereGeometry(80), new THREE.MeshBasicMaterial({color: 0xff00ff, wireframe: true}));
    targetMark.position.set(activeM.pos.x, 100, activeM.pos.z);
    scene.add(targetMark);
    
    document.getElementById('missionBox').style.display = 'block';
    document.getElementById('mTitle').innerText = activeM.title;
};

/* 4. PLAYER MOVEMENT */
const player = new THREE.Object3D();
player.position.set(0, 10, 600);
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, vY = 0;
const input = { f:0, b:0, l:0, r:0 };

function animate() {
    requestAnimationFrame(animate);
    
    // Move
    const speed = 15;
    let nx = player.position.x;
    let nz = player.position.z;

    if(input.f) { nx -= Math.sin(yaw) * speed; nz -= Math.cos(yaw) * speed; }
    if(input.b) { nx += Math.sin(yaw) * speed; nz += Math.cos(yaw) * speed; }
    if(input.l) { nx -= Math.cos(yaw) * speed; nz += Math.sin(yaw) * speed; }
    if(input.r) { nx += Math.cos(yaw) * speed; nz -= Math.sin(yaw) * speed; }

    // Collision Check
    let hit = false;
    for(let c of colliders) {
        if(Math.hypot(nx - c.x, nz - c.z) < c.r) hit = true;
    }
    if(!hit) {
        player.position.x = nx;
        player.position.z = nz;
    }

    // Gravity
    vY -= 0.05;
    player.position.y += vY;
    if(player.position.y < 20) { player.position.y = 20; vY = 0; }

    // Mission Logic
    if(activeM) {
        targetMark.rotation.y += 0.05;
        const dist = Math.round(player.position.distanceTo(targetMark.position));
        document.getElementById('mDist').innerText = dist + "m";
        
        if(dist < 200) {
            alert("MISSION COMPLETE! +$500");
            activeM = null;
            scene.remove(targetMark);
            document.getElementById('missionBox').style.display = 'none';
        }
    }

    player.rotation.y = yaw;
    renderer.render(scene, camera);
}
animate();

/* 5. INPUT HANDLING */
const bindBtn = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); input[key] = 1; });
    el.addEventListener('pointerup', (e) => { e.preventDefault(); input[key] = 0; });
    el.addEventListener('pointerleave', (e) => { e.preventDefault(); input[key] = 0; });
};

bindBtn('btnU', 'f');
bindBtn('btnD', 'b');
bindBtn('btnL', 'l');
bindBtn('btnR', 'r');

document.getElementById('jump').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if(player.position.y <= 21) vY = 1.2;
});

// Touch to look around
let isDragging = false, lastX = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX;
});
window.addEventListener('pointermove', (e) => {
    if(isDragging) {
        const delta = e.clientX - lastX;
        yaw -= delta * 0.005;
        lastX = e.clientX;
    }
});
window.addEventListener('pointerup', () => isDragging = false);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
