<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Smart Loading</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; touch-action: none; }
        canvas { display: block; }

        /* --- PERCENTAGE LOADING SCREEN --- */
        #loaderScreen {
            position: fixed; inset: 0; background: #111;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; color: #00ff00; transition: opacity 0.8s ease;
        }
        .load-container { width: 250px; text-align: center; }
        .bar-bg { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 15px; border: 1px solid #444; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: #00ff00; transition: width 0.3s; box-shadow: 0 0 10px #00ff00; }
        #percentText { font-size: 24px; font-weight: bold; margin-bottom: 5px; }

        /* HUD & Controls */
        #missionHUD { position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; border-left: 5px solid #00ff00; color: white; display: none; z-index: 10; }
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; margin: 3px; border-radius: 15px; background: rgba(0,0,0,0.5); border: 2px solid #fff; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        #jumpBtn { position: fixed; bottom: 30px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: #ff9800; color: white; border: 2px solid #fff; font-weight: bold; }
        #menuBtn { position: fixed; top: 15px; right: 15px; padding: 12px 20px; background: #00ff00; color: #000; border-radius: 8px; font-weight: bold; z-index: 50; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="loaderScreen">
    <div class="load-container">
        <div id="percentText">0%</div>
        <div style="font-size: 12px; letter-spacing: 2px;">DOWNLOADING ASSETS</div>
        <div class="bar-bg"><div id="bar"></div></div>
    </div>
</div>

<div id="missionHUD">
    <b id="hudTitle">Mission Active</b><br>
    <span id="hudDistance">Locating target...</span>
</div>

<button id="menuBtn" onclick="alert('Select a mission from the list below!')">MISSIONS</button>

<div id="controls">
    <div class="btn" style="grid-area: up" id="up">▲</div>
    <div class="btn" style="grid-area: left" id="left">◀</div>
    <div class="btn" style="grid-area: down" id="down">▼</div>
    <div class="btn" style="grid-area: right" id="right">▶</div>
</div>
<button id="jumpBtn">JUMP</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.152.2/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* --- ENGINE SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 500, 4000);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(200, 1000, 200);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(15000, 15000), new THREE.MeshLambertMaterial({ color: 0x44aa44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* --- PERCENTAGE LOADER LOGIC --- */
const manager = new THREE.LoadingManager();
const loader = new GLTFLoader(manager);
const assets = { b1: null, b2: null, tree: null };
const colliders = [];

// This function runs every time a piece of a file is downloaded
manager.onProgress = (url, itemsLoaded, itemsTotal) => {
    const progress = Math.floor((itemsLoaded / itemsTotal) * 100);
    document.getElementById('bar').style.width = progress + '%';
    document.getElementById('percentText').innerText = progress + '%';
};

// This function runs when EVERYTHING is finished
manager.onLoad = () => {
    console.log("All assets loaded. Building city...");
    generateCity();
    
    // Hide loading screen with a fade
    const loader = document.getElementById('loaderScreen');
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 800);
};

// Start Loading (Using your folder structure)
loader.load('building.glb', (g) => { assets.b1 = g.scene; });
loader.load('building2.glb', (g) => { assets.b2 = g.scene; });
loader.load('tree1.glb', (g) => { assets.tree = g.scene; });

function generateCity() {
    for (let x = -6; x <= 6; x++) {
        for (let z = -6; z <= 6; z++) {
            if (x === 0 && z === 0) continue; 
            const px = x * 1000, pz = z * 1000;
            
            // Alternating Buildings
            const source = (x + z) % 2 === 0 ? assets.b1 : assets.b2;
            if (source) {
                const b = source.clone();
                b.scale.set(12, 12, 12); 
                b.position.set(px, 0, pz);
                scene.add(b);
                colliders.push({ x: px, z: pz, r: 120 });
            }

            // Adding Trees
            if (assets.tree) {
                const t = assets.tree.clone();
                t.scale.set(6, 6, 6);
                t.position.set(px + 250, 0, pz + 250);
                scene.add(t);
            }
        }
    }
}

/* --- PLAYER & CONTROLS --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 500); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, velocityY = 0;
const move = { up: false, down: false, left: false, right: false };

function animate() {
    requestAnimationFrame(animate);
    let nx = player.position.x, nz = player.position.z, spd = 6;
    
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    let hit = false;
    for (let c of colliders) { if (Math.hypot(nx - c.x, nz - c.z) < c.r) { hit = true; break; } }
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY -= 0.02; player.position.y += velocityY;
    if (player.position.y < 10) { player.position.y = 10; velocityY = 0; }

    player.rotation.y = yaw;
    renderer.render(scene, camera);
}
animate();

/* --- UI BINDINGS --- */
const bind = (id, k) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); move[k] = true; });
    el.addEventListener('pointerup', () => move[k] = false);
};
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

document.getElementById("jumpBtn").addEventListener('pointerdown', (e) => {
    e.preventDefault(); if(player.position.y <= 10.5) velocityY = 0.5;
});

// Touch Look
let isDragging = false, lastX;
renderer.domElement.addEventListener('pointerdown', e => { isDragging = true; lastX = e.clientX; });
window.addEventListener('pointerup', () => isDragging = false);
window.addEventListener('pointermove', e => {
    if (isDragging) {
        yaw -= (e.clientX - lastX) * 0.004;
        lastX = e.clientX;
    }
});
</script>
</body>
</html>
