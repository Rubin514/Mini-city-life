<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City - Full Asset Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }

        /* Loader Screen */
        #loader { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: #00e5ff; transition: opacity 0.8s; }
        .bar-bg { width: 200px; height: 8px; background: #222; border-radius: 4px; margin-top: 15px; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: #00e5ff; transition: width 0.3s; }

        /* HUD */
        #hud { position: fixed; top: 15px; left: 15px; z-index: 100; pointer-events: none; visibility: hidden; }
        #minimap { width: 120px; height: 120px; background: rgba(0,0,0,0.8); border: 2px solid #00e5ff; position: relative; border-radius: 50%; overflow: hidden; }
        #pDot { width: 8px; height: 8px; background: #fff; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border: 1px solid #000; }
        #tDot { width: 12px; height: 12px; background: #ff00ff; position: absolute; border-radius: 3px; display: none; border: 1px solid #fff; }
        #missionBox { background: rgba(0,0,0,0.8); color: #fff; padding: 12px; margin-top: 10px; border-radius: 8px; font-size: 13px; border-left: 4px solid #00e5ff; width: 200px; }

        /* UI Buttons */
        #ctrls { position: fixed; bottom: 30px; left: 30px; z-index: 100; display: grid; grid-template-areas: ". u ." "l d r"; }
        .btn { width: 65px; height: 65px; margin: 5px; background: rgba(0,0,0,0.4); border: 2px solid #fff; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        #jump { position: fixed; bottom: 40px; right: 40px; width: 85px; height: 85px; border-radius: 50%; background: #00e5ff; border: 4px solid #fff; color: #000; font-weight: bold; }
        #menuBtn { position: fixed; top: 15px; right: 15px; padding: 12px 25px; background: #fff; color: #000; border-radius: 10px; font-weight: bold; z-index: 100; border: none; cursor: pointer; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; display: none; flex-direction: column; align-items: center; padding: 30px; overflow-y: auto; color: white; }
        .m-card { background: #1a1a1a; padding: 20px; margin: 10px; width: 90%; border-radius: 12px; border: 1px solid #333; transition: transform 0.2s; }
        .m-card:active { transform: scale(0.95); background: #333; }
    </style>
</head>
<body>

<div id="loader">
    <h2 id="status">LOADING CITY...</h2>
    <div class="bar-bg"><div id="bar"></div></div>
</div>

<div id="hud">
    <div id="minimap"><div id="pDot"></div><div id="tDot"></div></div>
    <div id="missionBox"><b id="title">FREE ROAM</b><br><span id="goal">Check the mission menu</span></div>
</div>

<button id="menuBtn" onclick="toggleMenu(true)">MISSIONS</button>

<div id="overlay">
    <h2>SELECT A CONTRACT</h2>
    <div id="list"></div>
    <button onclick="toggleMenu(false)" style="margin-top:20px; padding:15px; width:200px; border-radius:10px; background:red; color:white; border:none;">BACK</button>
</div>

<div id="ctrls">
    <div class="btn" style="grid-area:u" id="u">▲</div>
    <div class="btn" style="grid-area:l" id="l">◀</div>
    <div class="btn" style="grid-area:d" id="d">▼</div>
    <div class="btn" style="grid-area:r" id="r">▶</div>
</div>
<button id="jump">JUMP</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.152.2/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const Assets = { b1: null, b2: null, tree: null };
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111122);
scene.fog = new THREE.Fog(0x111122, 500, 3000);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(200, 500, 200);
scene.add(light);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x111111 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* --- SMART LOADER FOR YOUR 3 FILES --- */
const manager = new THREE.LoadingManager();
const loader = new GLTFLoader(manager);

function makeBox(w, h, d, col) {
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col }));
    m.position.y = h/2;
    g.add(m);
    return g;
}

manager.onProgress = (u, l, t) => { document.getElementById('bar').style.width = (l/t*100)+'%'; };
manager.onLoad = () => {
    document.getElementById('loader').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('hud').style.visibility = 'visible';
        initCity();
    }, 800);
};

// Loading your specific files
loader.load('building.glb', (g) => Assets.b1 = g.scene, undefined, () => Assets.b1 = makeBox(60, 120, 60, 0x444444));
loader.load('building2.glb', (g) => Assets.b2 = g.scene, undefined, () => Assets.b2 = makeBox(70, 200, 70, 0x222222));
loader.load('tree1.glb', (g) => Assets.tree = g.scene, undefined, () => Assets.tree = makeBox(10, 30, 10, 0x003300));

/* --- 20 MISSIONS --- */
const missions = Array.from({length: 20}, (_, i) => ({
    id: i+1,
    title: `CONTRACT #${i+1}`,
    goal: `Secure the ${['Alpha', 'Beta', 'Gamma', 'Delta'][i%4]} point`,
    pos: { x: (Math.random()-0.5)*4000, z: (Math.random()-0.5)*4000 },
    color: 0x00e5ff
}));

let activeM = null, targetMesh = null;
window.startMission = (id) => {
    activeM = missions[id-1];
    if(targetMesh) scene.remove(targetMesh);
    targetMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(20, 0), new THREE.MeshBasicMaterial({ color: activeM.color, wireframe: true }));
    targetMesh.position.set(activeM.pos.x, 40, activeM.pos.z);
    scene.add(targetMesh);
    document.getElementById('title').innerText = activeM.title;
    document.getElementById('goal').innerText = activeM.goal;
    toggleMenu(false);
};

/* --- WORLD --- */
const colliders = [];
function initCity() {
    for(let x=-8; x<=8; x++) {
        for(let z=-8; z<=8; z++) {
            if(x==0 && z==0) continue;
            const px=x*500, pz=z*500;
            const model = (x+z)%2==0 ? Assets.b1 : Assets.b2;
            const b = model.clone();
            b.position.set(px, 0, pz);
            scene.add(b);
            colliders.push({x:px, z:pz, r:75});
            
            const t = Assets.tree.clone();
            t.position.set(px+120, 0, pz+120);
            scene.add(t);
        }
    }
}

/* --- PLAYER --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 300);
scene.add(player);
player.add(camera);

let yaw=0, pitch=0, vY=0, input={f:0,b:0,l:0,r:0};

function animate() {
    requestAnimationFrame(animate);
    let nx=player.position.x, nz=player.position.z, spd=6;
    if(input.f){ nx -= Math.sin(yaw)*spd; nz -= Math.cos(yaw)*spd; }
    if(input.b){ nx += Math.sin(yaw)*spd; nz += Math.cos(yaw)*spd; }
    if(input.l){ nx -= Math.cos(yaw)*spd; nz += Math.sin(yaw)*spd; }
    if(input.r){ nx += Math.cos(yaw)*spd; nz -= Math.sin(yaw)*spd; }

    let hit = false;
    for(let c of colliders) if(Math.hypot(nx-c.x, nz-c.z) < c.r) hit=true;
    if(!hit){ player.position.x=nx; player.position.z=nz; }

    vY -= 0.02; player.position.y += vY;
    if(player.position.y < 10){ player.position.y=10; vY=0; }

    if(activeM) {
        targetMesh.rotation.y += 0.04;
        const d = player.position.distanceTo(targetMesh.position);
        document.getElementById('tDot').style.display = 'block';
        document.getElementById('tDot').style.left = (50 + (activeM.pos.x - player.position.x)/50) + 'px';
        document.getElementById('tDot').style.top = (50 + (activeM.pos.z - player.position.z)/50) + 'px';
        if(d < 60) { alert("CONTRACT COMPLETE!"); activeM=null; scene.remove(targetMesh); }
    }

    player.rotation.y = yaw; camera.rotation.x = pitch;
    renderer.render(scene, camera);
}
animate();

/* --- UI HELPERS --- */
window.toggleMenu = (s) => document.getElementById('overlay').style.display = s?'flex':'none';
const list = document.getElementById('list');
missions.forEach(m => {
    const d = document.createElement('div');
    d.className = 'm-card';
    d.innerHTML = `<b>${m.title}</b><p>${m.goal}</p>`;
    d.onclick = () => startMission(m.id);
    list.appendChild(d);
});

const bind = (id, k) => {
    const e = document.getElementById(id);
    e.onpointerdown = (ev) => { ev.preventDefault(); input[k]=1; };
    e.onpointerup = () => input[k]=0;
};
bind("u","f"); bind("d","b"); bind("l","l"); bind("r","r");
document.getElementById("jump").onpointerdown = () => { if(player.position.y<=11) vY=0.5; };

let drag=false, lx, ly;
renderer.domElement.onpointerdown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
window.onpointerup = () => drag=false;
window.onpointermove = e => { if(drag){ yaw-=(e.clientX-lx)*0.005; pitch-=(e.clientY-ly)*0.005; lx=e.clientX; ly=e.clientY; }};
</script>
</body>
</html>
