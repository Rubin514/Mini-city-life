<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini City Life - Success</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; }
        /* Mobile Joystick */
        #joystick-base { 
            position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; 
            background: rgba(255,255,255,0.3); border-radius: 50%; z-index: 10;
        }
        #joystick-knob { 
            position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; 
            background: #fff; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="joystick-base"><div id="joystick-knob"></div></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // Ground (Grass)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x4caf50 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // --- 2. LOADING MODELS ---
        const loader = new GLTFLoader();

        // Building 1 (Left)
        loader.load('models/building.glb', (gltf) => {
            const m = gltf.scene;
            m.position.set(-15, 0, -10);
            scene.add(m);
        });

        // Building 2 (Right - Corrected Path)
        loader.load('models/building1.glb', (gltf) => {
            const m = gltf.scene;
            m.position.set(15, 0, -10);
            scene.add(m);
        });

        // Tree (Player - Corrected Path)
        const player = new THREE.Group();
        scene.add(player);
        loader.load('models/tree1.glb', (gltf) => {
            const m = gltf.scene;
            m.scale.set(1.5, 1.5, 1.5);
            player.add(m);
        });

        // --- 3. JOYSTICK ---
        const knob = document.getElementById('joystick-knob');
        const base = document.getElementById('joystick-base');
        let moveX = 0, moveZ = 0, dragging = false;

        base.addEventListener('pointerdown', () => dragging = true);
        window.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const rect = base.getBoundingClientRect();
            let dx = e.clientX - (rect.left + 50);
            let dy = e.clientY - (rect.top + 50);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const angle = Math.atan2(dy, dx);
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = (Math.cos(angle) * dist) / 40;
            moveZ = (Math.sin(angle) * dist) / 40;
        });
        window.addEventListener('pointerup', () => {
            dragging = false;
            knob.style.transform = `translate(0,0)`;
            moveX = 0; moveZ = 0;
        });

        // --- 4. ANIMATION & FOLLOW CAMERA ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Move Player
            player.position.x += moveX * 0.25;
            player.position.z += moveZ * 0.25;

            // Camera Follow Logic (GTA-style follow)
            const camOffset = new THREE.Vector3(0, 8, 18);
            camera.position.lerp(player.position.clone().add(camOffset), 0.1);
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
