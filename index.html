<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini City Life Debug</title>
  <style> body{margin:0; background:#222; color:#0f0; font-family:monospace;}#log{padding:10px;} </style>
</head>
<body>
<div id="log">Starting…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const log = document.getElementById('log');
const BASE = "https://rubin514.github.io/Mini-city-life/models/";

function msg(t) { log.innerHTML += "<br>" + t; }

msg("Three starting");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0,5,15);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const loader = new GLTFLoader();

["building.glb", "b1.glb", "t1.glb"].forEach((file, i) => {
  msg("Loading " + file);
  loader.load(
    BASE + file,
    gltf => {
      msg("✅ Loaded: " + file);
      const m = gltf.scene;
      m.position.set((i-1)*6, 0, 0);
      scene.add(m);
    },
    xhr => msg(` ${Math.round(xhr.loaded/xhr.total*100)}%`),
    err => msg("❌ FAILED: " + file)
  );
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
