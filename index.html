<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - 20 Missions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Arial Black', sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* HUD & Minimap */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
        #minimap { width: 110px; height: 110px; background: rgba(0,0,0,0.8); border: 2px solid #fff; position: relative; border-radius: 10px; }
        #pDot { width: 6px; height: 6px; background: #fff; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 5; }
        #targetDot { width: 10px; height: 10px; background: #ff00ff; position: absolute; border-radius: 2px; display: none; border: 1px solid white; }
        #missionBox { background: rgba(0,0,0,0.85); color: #fbc02d; padding: 12px; margin-top: 10px; border-radius: 5px; font-size: 14px; border-left: 5px solid #fbc02d; width: 180px; }

        /* Mission Menu */
        #missionOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 500; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; color: white; }
        .mission-btn { background: #333; padding: 15px; margin: 5px; width: 90%; border-radius: 8px; border: 1px solid #555; text-align: left; color: #fff; font-size: 16px; }
        .mission-btn:active { background: #fbc02d; color: #000; }

        /* Controls */
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 100; display: grid; grid-template-areas: ". u ." "l d r"; }
        .btn { width: 65px; height: 65px; margin: 4px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
        #jump { position: fixed; bottom: 30px; right: 20px; width: 85px; height: 85px; border-radius: 50%; background: #ff9800; border: 3px solid #fff; color: white; font-weight: bold; }
        #menuOpen { position: fixed; top: 10px; right: 10px; padding: 12px 20px; background: #fbc02d; color: #000; border-radius: 8px; font-weight: bold; z-index: 100; border: none; }
    </style>
</head>
<body>

<div id="hud">
    <div id="minimap"><div id="pDot"></div><div id="targetDot"></div></div>
    <div id="missionBox">
        <b id="mTitle">CITY FREE ROAM</b><br>
        <span id="mGoal">Open the menu to start a mission</span>
    </div>
</div>

<button id="menuOpen" onclick="toggleMenu(true)">MISSIONS</button>

<div id="missionOverlay">
    <h1>CHOOSE A MISSION</h1>
    <div id="missionList"></div>
    <button onclick="toggleMenu(false)" style="margin-top:20px; padding:15px 50px; background:#cc0000; color:#fff; border:none; border-radius:8px;">CLOSE</button>
</div>

<div id="controls">
    <div class="btn" style="grid-area:u" id="u">▲</div>
    <div class="btn" style="grid-area:l" id="l">◀</div>
    <div class="btn" style="grid-area:d" id="d">▼</div>
    <div class="btn" style="grid-area:r" id="r">▶</div>
</div>
<button id="jump">JUMP</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.152.2/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* --- 1. CORE ENGINE --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(200, 500, 200);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x3a9d23 }));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* --- 2. BUILT-IN 3D MODELS (No files required!) --- */
function createBuilding(color, h) {
    const g = new THREE.Group();
    // Main Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(70, h, 70), new THREE.MeshLambertMaterial({ color }));
    body.position.y = h/2;
    // Window detailing
    const winGeo = new THREE.BoxGeometry(72, 10, 10);
    const winMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    for(let i=20; i < h; i+=30) {
        const w = new THREE.Mesh(winGeo, winMat);
        w.position.y = i;
        g.add(w);
    }
    g.add(body);
    return g;
}

function createTree() {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 25), new THREE.MeshLambertMaterial({ color: 0x4d2600 }));
    trunk.position.y = 12.5;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(25, 50, 8), new THREE.MeshLambertMaterial({ color: 0x1a5d1a }));
    leaves.position.y = 45;
    g.add(trunk, leaves);
    return g;
}

const models = { 
    b1: createBuilding(0x999999, 140), 
    b2: createBuilding(0x666666, 220), 
    tree: createTree() 
};

/* --- 3. 20 MISSIONS DATA --- */
const missions = [];
for(let i=1; i<=20; i++) {
    missions.push({
        id: i,
        name: "Mission " + i,
        desc: "Find the " + (i%2==0 ? "Neon Signal" : "Old Landmark"),
        pos: { x: (Math.random()-0.5)*5000, z: (Math.random()-0.5)*5000 },
        color: i % 2 == 0 ? 0xff00ff : 0x00ffff
    });
}

let activeM = null;
let targetMesh = null;

window.startMission = (idx) => {
    const m = missions[idx];
    activeM = m;
    if(targetMesh) scene.remove(targetMesh);
    targetMesh = new THREE.Mesh(new THREE.TorusGeometry(30, 8, 12, 24), new THREE.MeshBasicMaterial({ color: m.color }));
    targetMesh.position.set(m.pos.x, 30, m.pos.z);
    scene.add(targetMesh);
    
    document.getElementById('mTitle').innerText = m.name.toUpperCase();
    document.getElementById('mGoal').innerText = m.desc;
    toggleMenu(false);
};

/* --- 4. WORLD BUILDING --- */
const colliders = [];
for(let x=-10; x<=10; x++) {
    for(let z=-10; z<=10; z++) {
        if(Math.abs(x) < 1 && Math.abs(z) < 1) continue;
        const px=x*600, pz=z*600;
        const type = (x+z) % 2 == 0 ? models.b1 : models.b2;
        const b = type.clone();
        b.position.set(px, 0, pz);
        scene.add(b);
        colliders.push({x:px, z:pz, r:90});
        
        const t = models.tree.clone();
        t.position.set(px+200, 0, pz+200);
        scene.add(t);
    }
}

/* --- 5. PLAYER & MOVEMENT --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 500);
scene.add(player);
player.add(camera);

let yaw=0, pitch=0, vY=0, input={f:0,b:0,l:0,r:0};

function animate() {
    requestAnimationFrame(animate);
    let nx=player.position.x, nz=player.position.z, spd=6;
    
    if(input.f){ nx -= Math.sin(yaw)*spd; nz -= Math.cos(yaw)*spd; }
    if(input.b){ nx += Math.sin(yaw)*spd; nz += Math.cos(yaw)*spd; }
    if(input.l){ nx -= Math.cos(yaw)*spd; nz += Math.sin(yaw)*spd; }
    if(input.r){ nx += Math.cos(yaw)*spd; nz -= Math.sin(yaw)*spd; }

    let hit = false;
    for(let c of colliders) if(Math.hypot(nx-c.x, nz-c.z) < c.r) hit=true;
    if(!hit){ player.position.x=nx; player.position.z=nz; }

    vY -= 0.02; player.position.y += vY;
    if(player.position.y < 10){ player.position.y=10; vY=0; }

    if(activeM) {
        targetMesh.rotation.y += 0.05;
        const d = player.position.distanceTo(targetMesh.position);
        document.getElementById('targetDot').style.display = 'block';
        document.getElementById('targetDot').style.left = (50 + (activeM.pos.x - player.position.x)/50) + 'px';
        document.getElementById('targetDot').style.top = (50 + (activeM.pos.z - player.position.z)/50) + 'px';
        if(d < 70) { alert("MISSION COMPLETE!"); activeM=null; scene.remove(targetMesh); }
    }

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}
animate();

/* --- 6. UI --- */
window.toggleMenu = (show) => document.getElementById('missionOverlay').style.display = show ? 'flex' : 'none';

const list = document.getElementById('missionList');
missions.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'mission-btn';
    b.innerHTML = `<b>${m.name}</b><br><small>${m.desc}</small>`;
    b.onclick = () => startMission(i);
    list.appendChild(b);
});

const b = (id, k) => {
    const e = document.getElementById(id);
    e.onpointerdown = (ev) => { ev.preventDefault(); input[k]=1; };
    e.onpointerup = () => input[k]=0;
};
b("u","f"); b("d","b"); b("l","l"); b("r","r");
document.getElementById("jump").onpointerdown = () => { if(player.position.y<=11) vY=0.5; };

let drag=false, lx, ly;
renderer.domElement.onpointerdown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
window.onpointerup = () => drag=false;
window.onpointermove = e => { if(drag){ yaw-=(e.clientX-lx)*0.005; pitch-=(e.clientY-ly)*0.005; lx=e.clientX; ly=e.clientY; }};
</script>
</body>
    </html>
