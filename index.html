<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mini City Life</title>

<style>
  body { margin: 0; overflow: hidden; background:#87ceeb; }
  canvas { display:block; }

  /* Mobile controls */
  .controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-gap: 10px;
    opacity: 0.85;
  }

  .btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #555;
    color: white;
    font-size: 20px;
    border: none;
  }

  .jump {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 90px;
    height: 60px;
    background: orange;
    font-weight: bold;
    border-radius: 12px;
    border: none;
  }
</style>
</head>

<body>

<!-- Mobile buttons -->
<div class="controls">
  <button class="btn" id="up">↑</button>
  <button class="btn" id="left">←</button>
  <button class="btn" id="right">→</button>
  <button class="btn" id="down">↓</button>
</div>
<button class="jump" id="jump">ENTER</button>

<!-- THREE.JS -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 5, 12);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(20, 30, 20);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x444444 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* GRID */
scene.add(new THREE.GridHelper(500, 50));

/* PLAYER */
const player = new THREE.Object3D();
player.position.set(0, 0, 0);
scene.add(player);

/* MOVEMENT */
const keys = { up:false, down:false, left:false, right:false };

document.getElementById("up").ontouchstart = () => keys.up = true;
document.getElementById("up").ontouchend = () => keys.up = false;
document.getElementById("down").ontouchstart = () => keys.down = true;
document.getElementById("down").ontouchend = () => keys.down = false;
document.getElementById("left").ontouchstart = () => keys.left = true;
document.getElementById("left").ontouchend = () => keys.left = false;
document.getElementById("right").ontouchstart = () => keys.right = true;
document.getElementById("right").ontouchend = () => keys.right = false;

/* LOAD BUILDING */
const loader = new GLTFLoader();

loader.load(
  "models/building.glb",
  (gltf) => {
    const base = gltf.scene;

    /* SCALE FIX (MOST IMPORTANT) */
    base.scale.set(0.005, 0.005, 0.005);

    /* CENTER MODEL */
    const box = new THREE.Box3().setFromObject(base);
    const center = box.getCenter(new THREE.Vector3());
    base.position.sub(center);

    /* CITY GENERATION */
    const spacing = 25;
    for (let x = -2; x <= 2; x++) {
      for (let z = -2; z <= 2; z++) {
        const b = base.clone();
        b.position.set(x * spacing, 0, z * spacing);
        scene.add(b);
      }
    }
  },
  undefined,
  (e) => console.error("GLB LOAD ERROR:", e)
);

/* RESIZE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* LOOP */
function animate() {
  requestAnimationFrame(animate);

  const speed = 0.15;
  if (keys.up) player.position.z -= speed;
  if (keys.down) player.position.z += speed;
  if (keys.left) player.position.x -= speed;
  if (keys.right) player.position.x += speed;

  camera.position.x = player.position.x;
  camera.position.z = player.position.z + 12;
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
