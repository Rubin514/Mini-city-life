<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        canvas { display: block; touch-action: none; }
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100; color: #fff;
        }
        #playBtn { font-size: 24px; padding: 15px 50px; border: 3px solid #00ff00; background: none; color: #00ff00; cursor: pointer; border-radius: 50px; }
        #minimapOverlay { position: fixed; top: 15px; right: 15px; width: 140px; height: 140px; border-radius: 50%; border: 3px solid white; pointer-events: none; z-index: 20; }
        #controls { position: fixed; bottom: 25px; left: 25px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; margin: 5px; border-radius: 15px; font-size: 24px; background: rgba(0,0,0,0.6); border: 2px solid white; color: white; display: flex; align-items: center; justify-content: center; }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }
        .action-container { position: fixed; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { width: 100px; height: 55px; border-radius: 15px; font-size: 18px; color: white; border: 2px solid #fff; font-weight: bold; cursor: pointer; }
        #jumpBtn { background: #ff9800; }
        #enterBtn { background: #f44336; }
        #msg { position: fixed; top: 20%; width: 100%; text-align: center; color: yellow; font-size: 24px; font-weight: bold; display: none; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>MINI CITY LIFE</h1>
    <p id="status">Loading Assets...</p>
    <button id="playBtn" style="display:none;">START GAME</button>
</div>

<div id="msg">ENTRY DETECTED - PRESS ENTER</div>
<div id="minimapOverlay"></div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<div class="action-container">
    <button class="action-btn" id="jumpBtn">JUMP</button>
    <button class="action-btn" id="enterBtn">ENTER</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* --- 1. SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 8000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const mapCamera = new THREE.OrthographicCamera(-800, 800, 800, -800, 1, 2000);
mapCamera.position.y = 1000;
mapCamera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(200, 500, 200);
scene.add(sun);

/* --- 2. INDIAN ROADS --- */
const land = new THREE.Mesh(new THREE.PlaneGeometry(15000, 15000), new THREE.MeshLambertMaterial({ color: 0x228b22 }));
land.rotation.x = -Math.PI / 2;
scene.add(land);

const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
const stripMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

for(let i = -10; i <= 10; i++) {
    const pos = i * 800;
    const rh = new THREE.Mesh(new THREE.PlaneGeometry(15000, 160), roadMat);
    rh.rotation.x = -Math.PI/2; rh.position.set(0, 0.1, pos); scene.add(rh);
    const rv = new THREE.Mesh(new THREE.PlaneGeometry(160, 15000), roadMat);
    rv.rotation.x = -Math.PI/2; rv.position.set(pos, 0.1, 0); scene.add(rv);

    for(let j = -7500; j < 7500; j += 100) {
        const dh = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), stripMat);
        dh.rotation.x = -Math.PI/2; dh.position.set(j, 0.15, pos); scene.add(dh);
        const dv = new THREE.Mesh(new THREE.PlaneGeometry(5, 40), stripMat);
        dv.rotation.x = -Math.PI/2; dv.position.set(pos, 0.15, j); scene.add(dv);
    }
}

/* --- 3. ASSET LOADING --- */
const loader = new GLTFLoader();
const entryPoints = [];
const colliders = [];
const models = { b: [], tree: null };
const manager = new THREE.LoadingManager();

manager.onLoad = () => {
    document.getElementById('status').innerText = "World Built!";
    document.getElementById('playBtn').style.display = "block";
    generateCity();
};

// RENAMED HERE: building.glb and building2.glb
loader.load('models/building.glb', (g) => models.b.push(g.scene), undefined, null, manager);
loader.load('models/building2.glb', (g) => models.b.push(g.scene), undefined, null, manager);
loader.load('models/tree1.glb', (g) => { 
    g.scene.traverse(n => { if(n.isMesh) n.material.alphaTest = 0.5; });
    models.tree = g.scene; 
}, undefined, null, manager);

function generateCity() {
    const markerGeo = new THREE.CircleGeometry(35, 32);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

    for (let x = -5; x <= 5; x++) {
        for (let z = -5; z <= 5; z++) {
            if (x === 0 && z === 0) continue;
            const bx = x * 800 + 250;
            const bz = z * 800 + 250;

            const b = models.b[Math.floor(Math.random() * models.b.length)].clone();
            b.scale.set(6, 6, 6);
            b.position.set(bx, 0, bz);
            scene.add(b);
            colliders.push({ box: new THREE.Box3().setFromObject(b) });

            const entry = new THREE.Mesh(markerGeo, markerMat);
            entry.rotation.x = -Math.PI / 2;
            entry.position.set(bx - 100, 0.5, bz); 
            scene.add(entry);
            entryPoints.push(entry.position);

            for(let i=0; i<4; i++) {
                if(!models.tree) continue;
                const tree = models.tree.clone();
                tree.scale.set(4, 4, 4);
                tree.position.set(bx + (Math.random()-0.5)*400, 0, bz + (Math.random()-0.5)*400);
                scene.add(tree);
            }
        }
    }
}

/* --- 4. PLAYER & LOOP --- */
const player = new THREE.Object3D();
player.position.set(0, 6, 400); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0, velocityY = 0;
const gravity = -0.015, jumpForce = 0.45, move = { up: false, down: false, left: false, right: false };
let isGrounded = true;

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    yaw += (targetYaw - yaw) * 0.1; pitch += (targetPitch - pitch) * 0.1;
    let nx = player.position.x, nz = player.position.z, spd = 220 * dt; // Faster walking
    
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(nx, 6, nz), new THREE.Vector3(15, 15, 15));
    let hit = false;
    for (const c of colliders) if (pBox.intersectsBox(c.box)) hit = true;
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY += gravity; player.position.y += velocityY;
    if (player.position.y <= 6) { player.position.y = 6; velocityY = 0; isGrounded = true; }

    player.rotation.y = yaw; camera.rotation.x = pitch;

    let near = false;
    for(const pos of entryPoints) if(player.position.distanceTo(pos) < 70) near = true;
    document.getElementById("msg").style.display = near ? "block" : "none";

    renderer.render(scene, camera);
}
animate();

/* --- 5. INPUTS --- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    el.onpointerup = () => move[k] = false;
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");
document.getElementById("jumpBtn").onpointerdown = () => { if(isGrounded){ velocityY=jumpForce; isGrounded=false; }};
document.getElementById("enterBtn").onclick = () => {
    let near = false;
    for(const pos of entryPoints) if(player.position.distanceTo(pos) < 70) near = true;
    if(near) alert("Building entry success!");
};
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

let drag = false, lx, ly;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => { if (drag) { targetYaw -= (e.clientX - lx) * 0.007; targetPitch -= (e.clientY - ly) * 0.007; lx = e.clientX; ly = e.clientY; } };
</script>
</body>
</html>
