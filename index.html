<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>City Life - Force Load</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: sans-serif; }
  #loading-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a1a; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 1000;
  }
  #loading-text { color: #fff; font-size: 18px; margin-bottom: 15px; }
  #bar-bg { width: 250px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; }
  #bar-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.3s; }
  #status-msg { margin-top: 10px; color: #888; font-size: 11px; }
</style>
</head>
<body>

<div id="loading-overlay">
  <div id="loading-text">Connecting to Server... 0%</div>
  <div id="bar-bg"><div id="bar-fill"></div></div>
  <div id="status-msg">Checking models/ folder...</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const text = document.getElementById("loading-text");
const fill = document.getElementById("bar-fill");
const msg = document.getElementById("status-msg");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 2));

// 1. Better Loading Manager
const manager = new THREE.LoadingManager();
manager.onProgress = (url, loaded, total) => {
    const p = Math.round((loaded / total) * 100);
    text.innerText = `Downloading: ${p}%`;
    fill.style.width = p + "%";
    msg.innerText = "Processing: " + url.split('/').pop();
};

manager.onLoad = () => {
    text.innerText = "Success!";
    setTimeout(() => document.getElementById("loading-overlay").style.display = "none", 500);
};

// 2. Optimized Draco Setup
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/'); 
draco.setDecoderConfig({ type: 'js' }); // Use JS decoder for better mobile compatibility

const loader = new GLTFLoader(manager);
loader.setDRACOLoader(draco);

const playerGroup = new THREE.Group();
scene.add(playerGroup);

function load(name, x, z, isP = false) {
    // Force bypass cache to see if the files even exist
    loader.load(`./models/${name}?v=${Date.now()}`, (gltf) => {
        const m = gltf.scene;
        const box = new THREE.Box3().setFromObject(m);
        const size = box.getSize(new THREE.Vector3());
        const s = 12 / Math.max(size.x, size.y, size.z);
        m.scale.setScalar(s);
        if(isP) playerGroup.add(m);
        else { m.position.set(x, 0, z); scene.add(m); }
    }, undefined, (err) => {
        msg.innerHTML = `<span style="color:red">ERROR: ${name} not found in /models/</span>`;
    });
}

// Start Loading
load("building.glb", -25, -15);
load("b1.glb", 25, -15);
load("t1.glb", 0, 0, true);

function animate() {
    requestAnimationFrame(animate);
    camera.position.set(playerGroup.position.x, 20, playerGroup.position.z + 45);
    camera.lookAt(playerGroup.position);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
