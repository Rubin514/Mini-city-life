<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87ceeb; }
        canvas { display: block; touch-action: none; }
        
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #000 100%); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 100; color: #fff;
        }
        #playBtn { 
            font-size: 28px; padding: 15px 60px; border: 4px solid #00ff00; 
            background: none; color: #00ff00; cursor: pointer; font-weight: bold; 
            border-radius: 50px;
        }

        #minimapOverlay {
            position: fixed; top: 15px; right: 15px; width: 140px; height: 140px;
            border-radius: 50%; border: 3px solid white; pointer-events: none; z-index: 20;
        }

        #controls { position: fixed; bottom: 25px; left: 25px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn {
            width: 65px; height: 65px; margin: 6px; border-radius: 15px; 
            font-size: 26px; background: rgba(0,0,0,0.5);
            border: 2px solid white; color: white; 
            display: flex; align-items: center; justify-content: center;
        }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }

        .action-container { position: fixed; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 12px; }
        .action-btn { width: 110px; height: 55px; border-radius: 15px; font-size: 18px; color: white; border: 2px solid #fff; font-weight: bold; }
        #jumpBtn { background: #ff9800; }
        #enterBtn { background: #f44336; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>MINI CITY LIFE</h1>
    <button id="playBtn">START GAME</button>
</div>

<div id="minimapOverlay"></div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<div class="action-container">
    <button class="action-btn" id="jumpBtn">JUMP</button>
    <button class="action-btn" id="enterBtn">ENTER</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* --- 1. SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
const mapCamera = new THREE.OrthographicCamera(-400, 400, 400, -400, 1, 1500);
mapCamera.position.y = 1000;
mapCamera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 2.0));

/* --- 2. GROUND --- */
const land = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ color: 0x228b22 }));
land.rotation.x = -Math.PI / 2;
scene.add(land);

new THREE.TextureLoader().load('textures/grass.png', (tex) => {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(100, 100);
    land.material.map = tex;
    land.material.needsUpdate = true;
});

/* --- 3. PLAYER --- */
const player = new THREE.Object3D();
player.position.set(0, 4, 300); 
scene.add(player);
player.add(camera);

const pDot = new THREE.Mesh(new THREE.SphereGeometry(20), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
pDot.position.y = 800; 
player.add(pDot);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0, velocityY = 0;
const gravity = -0.018, jumpForce = 0.5, move = { up: false, down: false, left: false, right: false };
let isGrounded = true;

/* --- 4. BUILDINGS --- */
const buildings = [];
const clock = new THREE.Clock();
const loader = new GLTFLoader();

loader.load('models/building.glb', (gltf) => {
    const bModel = gltf.scene;
    bModel.scale.set(4.5, 4.5, 4.5);
    for (let x = -4; x <= 4; x++) {
        for (let z = -4; z <= 4; z++) {
            if (x === 0 && Math.abs(z) < 2) continue; // Keep spawn road clear
            const b = bModel.clone();
            b.position.set(x * 500, 0, z * 500);
            scene.add(b);
            buildings.push({ box: new THREE.Box3().setFromObject(b) });
        }
    }
});

/* --- 5. LOOP --- */
function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // Movement
    yaw += (targetYaw - yaw) * 0.15; pitch += (targetPitch - pitch) * 0.15;
    let nx = player.position.x, nz = player.position.z, spd = 130 * dt;
    
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(nx, 4, nz), new THREE.Vector3(12, 12, 12));
    let hit = false;
    for (const b of buildings) if (pBox.intersectsBox(b.box)) hit = true;
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY += gravity; player.position.y += velocityY;
    if (player.position.y <= 4) { player.position.y = 4; velocityY = 0; isGrounded = true; }

    player.rotation.y = yaw; camera.rotation.x = pitch;

    // Rendering
    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    renderer.clear();
    renderer.render(scene, camera);

    const mSize = 140;
    renderer.setScissorTest(true);
    renderer.setScissor(window.innerWidth - mSize - 15, window.innerHeight - mSize - 15, mSize, mSize);
    renderer.setViewport(window.innerWidth - mSize - 15, window.innerHeight - mSize - 15, mSize, mSize);
    mapCamera.position.set(player.position.x, 1000, player.position.z);
    renderer.render(scene, mapCamera);
    renderer.setScissorTest(false);
}
animate();

/* --- 6. CONTROLS --- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); move[k] = true; });
    el.addEventListener('pointerup', () => move[k] = false);
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");
document.getElementById("jumpBtn").onpointerdown = () => { if(isGrounded){ velocityY=jumpForce; isGrounded=false; }};
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display="none";

let drag = false, lx, ly;
renderer.domElement.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup', () => drag = false);
window.addEventListener('pointermove', e => { 
    if (drag) { 
        targetYaw -= (e.clientX - lx) * 0.007; 
        targetPitch -= (e.clientY - ly) * 0.007; 
        lx = e.clientX; ly = e.clientY; 
    } 
});
</script>
</body>
</html>
