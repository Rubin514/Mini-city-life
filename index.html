<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Stable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        
        /* HUD & Minimap */
        #hud { position: fixed; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
        #minimap { width: 100px; height: 100px; background: rgba(0,0,0,0.5); border: 2px solid #fff; position: relative; }
        #pDot { width: 6px; height: 6px; background: #fff; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
        #kDot { width: 8px; height: 8px; background: #ff0; position: absolute; border-radius: 2px; display: none; }
        #missionMsg { background: rgba(0,0,0,0.7); color: #ff0; padding: 5px 10px; font-weight: bold; margin-top: 5px; border-radius: 4px; }

        /* Controls */
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 100; display: grid; grid-template-areas: ". u ." "l d r"; }
        .btn { width: 55px; height: 55px; margin: 3px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
        #jump { position: fixed; bottom: 30px; right: 20px; width: 70px; height: 70px; border-radius: 50%; background: #ff9800; color: #fff; border: 3px solid #fff; font-weight: bold; }
        #setBtn { position: fixed; top: 10px; right: 10px; padding: 8px 15px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #fff; border-radius: 5px; z-index: 100; }
        
        #settings { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
    </style>
</head>
<body>

<div id="hud">
    <div id="minimap"><div id="pDot"></div><div id="kDot"></div></div>
    <div id="missionMsg">OBJECTIVE: FIND THE GOLDEN KEY</div>
</div>

<button id="setBtn">SETTINGS</button>

<div id="settings">
    <h2>SETTINGS</h2>
    <p>Look Sensitivity</p>
    <input type="range" id="sens" min="1" max="10" value="4">
    <button onclick="document.getElementById('settings').style.display='none'" style="margin-top:20px; padding:10px 30px;">SAVE & BACK</button>
</div>

<div id="controls">
    <div class="btn" style="grid-area:u" id="u">▲</div>
    <div class="btn" style="grid-area:l" id="l">◀</div>
    <div class="btn" style="grid-area:d" id="d">▼</div>
    <div class="btn" style="grid-area:r" id="r">▶</div>
</div>
<button id="jump">JUMP</button>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 200, 2000);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x44aa44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const loader = new GLTFLoader();
const models = { b1: null, b2: null, tree: null };
const colliders = [];
let keyObj, hasKey = false;
let config = { sens: 0.003 };

// Placeholder Boxes (In case models fail to load like in your screenshot)
const createBox = (color) => {
    const g = new THREE.Group();
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(40, 100, 40), new THREE.MeshLambertMaterial({ color }));
    mesh.position.y = 50;
    g.add(mesh);
    return g;
};

// Safe Loading
const load = (url, name) => {
    loader.load(url, (g) => { models[name] = g.scene; }, undefined, () => {
        console.warn("Failed to load " + url + " - using box.");
        models[name] = createBox(name === 'b1' ? 0x888888 : 0x555555);
    });
};

load('./models/building.glb', 'b1');
load('./models/building2.glb', 'b2');
load('./models/tree1.glb', 'tree');

// Mission setup
const kPos = { x: (Math.random()-0.5)*1500, z: (Math.random()-0.5)*1500 };
keyObj = new THREE.Mesh(new THREE.TorusGeometry(8, 3, 8, 16), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
keyObj.position.set(kPos.x, 15, kPos.z);
scene.add(keyObj);

function initCity() {
    for(let x=-5; x<=5; x++){
        for(let z=-5; z<=5; z++){
            if(x==0 && z==0) continue;
            const px=x*400, pz=z*400;
            const source = (x+z)%2==0 ? (models.b1||createBox(0x888888)) : (models.b2||createBox(0x555555));
            const b = source.clone();
            b.position.set(px, 0, pz);
            b.scale.set(4, 4, 4);
            scene.add(b);
            colliders.push({x:px, z:pz, r:50});
        }
    }
}

// Player
const player = new THREE.Object3D();
player.position.set(0, 10, 200);
scene.add(player);
player.add(camera);

let yaw=0, pitch=0, vY=0;
const input = { f:0, b:0, l:0, r:0 };

function animate() {
    requestAnimationFrame(animate);
    if(!models.b1) return; // Wait for at least one model or placeholder
    
    let nx=player.position.x, nz=player.position.z, spd=3.5;
    if(input.f){ nx -= Math.sin(yaw)*spd; nz -= Math.cos(yaw)*spd; }
    if(input.b){ nx += Math.sin(yaw)*spd; nz += Math.cos(yaw)*spd; }
    if(input.l){ nx -= Math.cos(yaw)*spd; nz += Math.sin(yaw)*spd; }
    if(input.r){ nx += Math.cos(yaw)*spd; nz -= Math.sin(yaw)*spd; }

    let hit=false;
    for(let c of colliders) if(Math.hypot(nx-c.x, nz-c.z) < c.r) hit=true;
    if(!hit){ player.position.x=nx; player.position.z=nz; }

    vY -= 0.02; player.position.y += vY;
    if(player.position.y < 10){ player.position.y=10; vY=0; }

    // Mission & Minimap
    if(keyObj && !hasKey){
        keyObj.rotation.y += 0.05;
        const dist = player.position.distanceTo(keyObj.position);
        document.getElementById('kDot').style.display = 'block';
        document.getElementById('kDot').style.left = (50 + (keyObj.position.x - player.position.x)/20) + 'px';
        document.getElementById('kDot').style.top = (50 + (keyObj.position.z - player.position.z)/20) + 'px';

        if(dist < 30){
            hasKey=true; scene.remove(keyObj);
            document.getElementById('missionMsg').innerText = "KEY OBTAINED! YOU WIN!";
            document.getElementById('kDot').style.display = 'none';
        }
    }

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}

// Timeout to force city build if models take too long
setTimeout(initCity, 2000);
animate();

// Inputs
const btn = (id, k) => {
    const e = document.getElementById(id);
    e.onpointerdown = (ev) => { ev.preventDefault(); input[k]=1; };
    e.onpointerup = () => input[k]=0;
    e.onpointerleave = () => input[k]=0;
};
btn("u","f"); btn("d","b"); btn("l","l"); btn("r","r");
document.getElementById("jump").onpointerdown = () => { if(player.position.y<=10.1) vY=0.4; };
document.getElementById("setBtn").onclick = () => document.getElementById('settings').style.display='flex';
document.getElementById("sens").oninput = (e) => config.sens = e.target.value * 0.001;

let drag=false, lx, ly;
renderer.domElement.onpointerdown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
window.onpointerup = () => drag=false;
window.onpointermove = e => {
    if(drag){
        yaw -= (e.clientX-lx)*config.sens;
        pitch = Math.max(-1, Math.min(1, pitch-(e.clientY-ly)*config.sens));
        lx=e.clientX; ly=e.clientY;
    }
};
</script>
</body>
</html>
