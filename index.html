<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Legend - Urban Nature</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.12); --border: rgba(255, 255, 255, 0.2); }
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }

        /* --- Glassy UI Elements --- */
        .glass { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 15px; position: absolute; color: white; pointer-events: none; }
        #health-bar { top: 20px; left: 20px; width: 150px; height: 18px; padding: 4px; }
        #health-fill { width: 100%; height: 100%; background: #27ae60; border-radius: 10px; }
        #mission-hud { top: 20px; right: 20px; padding: 12px; text-align: right; }
        #inventory { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px; pointer-events: auto; }
        .inv-slot { width: 45px; height: 45px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; }

        /* --- Glassy Joystick --- */
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: var(--glass); backdrop-filter: blur(8px); border: 2px solid var(--border); border-radius: 15px; pointer-events: auto; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 10px; }

        /* --- Loading Screen --- */
        #home-screen { position: fixed; inset: 0; background: #050505; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; }
        #loading-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.1); margin-top: 20px; overflow: hidden; }
        #loading-fill { width: 0%; height: 100%; background: #fff; transition: width 0.3s; }
        #start-btn { margin-top: 25px; padding: 10px 30px; background: #fff; color: #000; border-radius: 4px; font-weight: bold; display: none; cursor: pointer; border: none; }
    </style>
</head>
<body>

<div id="home-screen">
    <h2 style="letter-spacing: 4px;">URBAN EXPLORER</h2>
    <div id="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-text" style="margin-top:10px; font-size: 10px;">0%</div>
    <button id="start-btn">START MISSION</button>
</div>

<div id="health-bar" class="glass"><div id="health-fill"></div></div>
<div id="mission-hud" class="glass"><small>MISSION 1</small><br><b>Explore the Park</b></div>
<div id="inventory" class="glass">
    <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
</div>
<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{
    "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // 1. SCENE SETUP
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(1); 
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
    
    // Player is now just a point in space (human height)
    const player = new THREE.Group();
    scene.add(player);
    camera.position.set(0, 12, 0); 
    player.add(camera);

    scene.add(new THREE.AmbientLight(0xffffff, 2.5));

    // 2. WORLD GEOMETRY
    const road = new THREE.Mesh(new THREE.PlaneGeometry(100, 10000), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(1000, 10000), new THREE.MeshBasicMaterial({ color: 0x333333 }));
    sidewalk.rotation.x = -Math.PI / 2;
    sidewalk.position.y = -0.1;
    scene.add(sidewalk);

    // 3. ASSET LOADING & PLACEMENT
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);

    let progress = 0;
    const updateProgress = () => {
        progress += 33.4;
        const p = Math.min(Math.round(progress), 100);
        document.getElementById('loading-fill').style.width = p + '%';
        document.getElementById('loading-text').innerText = p + '%';
        if(p >= 100) document.getElementById('start-btn').style.display = 'block';
    }

    // Spawn buildings and trees along the road
    loader.load('./models/building.glb', (gltf) => {
        const b = gltf.scene; b.scale.setScalar(35);
        for(let i = 0; i < 8; i++) {
            const clone = b.clone();
            clone.position.set(-180, 0, -600 * i);
            scene.add(clone);
        }
        updateProgress();
    });

    loader.load('./models/b1.glb', (gltf) => {
        const b = gltf.scene; b.scale.setScalar(35);
        for(let i = 0; i < 8; i++) {
            const clone = b.clone();
            clone.position.set(180, 0, -600 * i);
            scene.add(clone);
        }
        updateProgress();
    });

    // NOW: t1 (The Tree) is part of the city!
    loader.load('./models/t1.glb', (gltf) => {
        const tree = gltf.scene;
        tree.scale.setScalar(10);
        for(let i = 0; i < 15; i++) {
            const tLeft = tree.clone();
            tLeft.position.set(-80, 0, -300 * i); // Line of trees on left sidewalk
            scene.add(tLeft);

            const tRight = tree.clone();
            tRight.position.set(80, 0, -300 * i); // Line of trees on right sidewalk
            scene.add(tRight);
        }
        updateProgress();
    });

    // 4. UI HANDLER
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('home-screen').style.display = 'none';
    };

    // 5. CONTROLS
    let moveDir = { x: 0, z: 0 }, joyActive = false;
    const jBase = document.getElementById('joy-base'), jKnob = document.getElementById('joy-knob');

    jBase.onpointerdown = (e) => { joyActive = true; jBase.setPointerCapture(e.pointerId); };
    jBase.onpointermove = (e) => {
        if (!joyActive) return;
        const r = jBase.getBoundingClientRect();
        const dx = (e.clientX - (r.left + 50)) / 50, dy = (e.clientY - (r.top + 50)) / 50;
        const d = Math.min(Math.sqrt(dx*dx + dy*dy), 1);
        const a = Math.atan2(dy, dx);
        jKnob.style.transform = `translate(${Math.cos(a)*d*30}px, ${Math.sin(a)*d*30}px)`;
        moveDir.x = Math.cos(a) * d; moveDir.z = Math.sin(a) * d;
    };
    window.onpointerup = () => { joyActive = false; jKnob.style.transform = ''; moveDir = {x:0, z:0}; };

    let yaw = 0, pitch = 0;
    window.onpointermove = (e) => {
        if (joyActive) return;
        if (e.pointerType === 'touch' || e.buttons === 1) {
            yaw -= e.movementX * 0.005;
            pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.005));
        }
    };

    function animate() {
        requestAnimationFrame(animate);
        player.rotation.y = yaw;
        camera.rotation.x = pitch;
        const f = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
        const r = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
        player.position.addScaledVector(f, -moveDir.z * 2.5);
        player.position.addScaledVector(r, moveDir.x * 2.5);
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
