<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini City Life</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; }
        #loading {
            position: absolute; width: 100%; height: 100%; background: #000;
            color: #0f0; display: flex; align-items: center; justify-content: center;
            z-index: 100; font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="loading">LOADING ASSETS...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- SCENE & CAMERA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const ambient = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // --- GROUND ---
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x555555 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // --- MODEL LOADER ---
        const loader = new GLTFLoader();

        function loadModel(path, x, z, scale = 1) {
            loader.load(path, (gltf) => {
                const model = gltf.scene;
                model.position.set(x, 0, z);
                model.scale.set(scale, scale, scale);
                scene.add(model);
                document.getElementById('loading').style.display = 'none';
            });
        }

        // --- BUILDING YOUR CITY ---
        // Using your file structure paths
        loadModel('models/building.glb', -10, 0, 2);   // Left building
        loadModel('models/building1.glb', 10, 0, 2);   // Right building
        
        // Let's add some trees from your tree1.glb
        loadModel('models/tree1.glb', -5, 5, 1);
        loadModel('models/tree1.glb', 5, 5, 1);
        loadModel('models/tree1.glb', 0, -10, 1);

        // --- SIMPLE CAMERA CONTROLS ---
        function animate() {
            requestAnimationFrame(animate);
            // Rotate camera slowly to see the city
            const timer = Date.now() * 0.0005;
            camera.position.x = Math.cos(timer) * 30;
            camera.position.z = Math.sin(timer) * 30;
            camera.lookAt(0, 5, 0);
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
