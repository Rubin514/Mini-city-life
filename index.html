<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mini City Life 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  touch-action: none;
  font-family: sans-serif;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 10;
}

.btn {
  width: 60px;
  height: 60px;
  margin: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  color: white;
  border: 2px solid white;
  font-size: 20px;
}

#enterBtn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 110px;
  height: 60px;
  border-radius: 12px;
  background: #ff9800;
  font-weight: bold;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="controls">
  <button class="btn" id="up">⬆</button><br>
  <button class="btn" id="left">⬅</button>
  <button class="btn" id="jump">J</button>
  <button class="btn" id="right">➡</button><br>
  <button class="btn" id="down">⬇</button>
</div>

<button id="enterBtn">ENTER</button>

<!-- THREE CORE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<!-- GLTF LOADER (NON MODULE) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
/* ---------------- SCENE ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* ---------------- CAMERA ---------------- */
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);
camera.position.set(0, 6, 15);

/* ---------------- RENDERER ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ---------------- LIGHTS (CRITICAL) ---------------- */
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(20, 40, 20);
scene.add(sun);

/* ---------------- GROUND ---------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshStandardMaterial({ color: 0x2e7d32 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------------- PLAYER ---------------- */
const player = new THREE.Object3D();
player.position.set(0, 2, 20);
scene.add(player);

/* ---------------- GLB LOAD ---------------- */
const loader = new THREE.GLTFLoader();

loader.load(
  "models/building.glb",
  function (gltf) {
    const model = gltf.scene;

    model.scale.set(2, 2, 2);     // IMPORTANT
    model.position.set(0, 0, 0);  // IMPORTANT

    scene.add(model);
    console.log("GLB LOADED OK");
  },
  undefined,
  function (error) {
    console.error("GLB ERROR", error);
  }
);

/* ---------------- CONTROLS ---------------- */
let keys = {};
let yVel = 0;
let grounded = true;

function bind(id, key) {
  const b = document.getElementById(id);
  b.addEventListener("touchstart", e => { e.preventDefault(); keys[key] = true; });
  b.addEventListener("touchend", e => { e.preventDefault(); keys[key] = false; });
}
bind("up","w"); bind("down","s"); bind("left","a"); bind("right","d");

document.getElementById("jump").ontouchstart = () => {
  if (grounded) {
    yVel = 0.6;
    grounded = false;
  }
};

/* ---------------- LOOP ---------------- */
function animate() {
  requestAnimationFrame(animate);

  const speed = 0.3;

  if (keys.w) player.position.z -= speed;
  if (keys.s) player.position.z += speed;
  if (keys.a) player.position.x -= speed;
  if (keys.d) player.position.x += speed;

  yVel -= 0.03;
  player.position.y += yVel;

  if (player.position.y < 2) {
    player.position.y = 2;
    yVel = 0;
    grounded = true;
  }

  camera.position.set(
    player.position.x,
    player.position.y + 4,
    player.position.z + 10
  );
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}
animate();

/* ---------------- RESIZE ---------------- */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
