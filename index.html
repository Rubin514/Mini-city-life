<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini City Life</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    touch-action: none;
  }

  canvas {
    display: block;
  }

  /* Controls */
  .controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 10px;
  }

  .btn {
    background: #555;
    color: white;
    font-size: 20px;
    border-radius: 50%;
    border: none;
  }

  .enter {
    position: fixed;
    bottom: 30px;
    right: 20px;
    background: orange;
    color: black;
    font-size: 20px;
    padding: 15px 25px;
    border-radius: 10px;
    border: none;
  }
</style>
</head>

<body>

<div class="controls">
  <button class="btn" id="up">↑</button>
  <div></div>
  <div></div>

  <button class="btn" id="left">←</button>
  <button class="btn">J</button>
  <button class="btn" id="right">→</button>

  <div></div>
  <button class="btn" id="down">↓</button>
  <div></div>
</div>

<button class="enter">ENTER</button>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.158.0/build/three.module.js";
import { GLTFLoader } from "https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // sky blue

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  2000
);

camera.position.set(0, 10, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* LIGHTS (VERY IMPORTANT) */
scene.add(new THREE.AmbientLight(0xffffff, 2.5));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(100, 200, 100);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x555555 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* TEST CUBE (PROVES SCENE WORKS) */
const testCube = new THREE.Mesh(
  new THREE.BoxGeometry(3, 3, 3),
  new THREE.MeshStandardMaterial({ color: 0xff0000 })
);
testCube.position.set(0, 1.5, 0);
scene.add(testCube);

/* LOAD GLB */
const loader = new GLTFLoader();
loader.load(
  "models/building.glb",
  (gltf) => {
    const model = gltf.scene;

    model.scale.set(0.05, 0.05, 0.05); // REQUIRED FOR BIG MODELS
    model.position.set(0, 0, 0);

    // Center model
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    scene.add(model);

    camera.lookAt(0, 5, 0);
    console.log("✅ GLB LOADED");
  },
  (xhr) => {
    console.log("Loading:", (xhr.loaded / xhr.total * 100).toFixed(0) + "%");
  },
  (error) => {
    console.error("❌ GLB ERROR", error);
  }
);

/* MOVEMENT */
const speed = 0.6;

document.getElementById("up").onclick = () => camera.position.z -= speed;
document.getElementById("down").onclick = () => camera.position.z += speed;
document.getElementById("left").onclick = () => camera.position.x -= speed;
document.getElementById("right").onclick = () => camera.position.x += speed;

/* RESIZE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* LOOP */
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
