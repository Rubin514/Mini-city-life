<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini City Life – City Build</title>

<style>
body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: sans-serif; }

#home-screen {
    position: fixed; inset: 0;
    background: #111;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 1000; color: white;
}

#loading-bar { width: 220px; height: 8px; background: #333; border-radius: 10px; overflow: hidden; }
#loading-fill { width: 0%; height: 100%; background: #00d2d3; transition: width 0.3s; }
#loading-text { margin-top: 10px; }
#start-btn { margin-top: 25px; padding: 15px 45px; background: #00d2d3; border: none; border-radius: 8px; font-weight: bold; display: none; }

.glass {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    position: absolute;
    color: white;
    padding: 10px 20px;
    pointer-events: none;
}

#mission-hud { top: 20px; left: 50%; transform: translateX(-50%); }

#joy-base {
    position: absolute; bottom: 40px; left: 40px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
}
#joy-knob {
    position: absolute; top: 25px; left: 25px;
    width: 50px; height: 50px;
    background: #fff; border-radius: 50%;
}
</style>
</head>

<body>

<div id="home-screen">
    <h1>GENERATING CITY</h1>
    <div id="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-text">0%</div>
    <button id="start-btn">START</button>
</div>

<div id="mission-hud" class="glass">HIGHWAY 101</div>
<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{
 "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 400, 2500);

/* PLAYER + CAMERA */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 4000);
const player = new THREE.Group();
player.position.set(0, 15, 150);
scene.add(player);
player.add(camera);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff, 2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(300, 500, 300);
scene.add(sun);

/* ROAD */
const road = new THREE.Mesh(
    new THREE.PlaneGeometry(180, 12000),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
);
road.rotation.x = -Math.PI/2;
scene.add(road);

/* LOADER */
const loader = new GLTFLoader();
let loaded = 0;
const update = () => {
    loaded++;
    const p = Math.floor((loaded / 3) * 100);
    document.getElementById("loading-fill").style.width = p+"%";
    document.getElementById("loading-text").innerText = p+"%";
    if (p === 100) document.getElementById("start-btn").style.display = "block";
};

/* CITY FUNCTION */
function spawnCity(model, startX) {
    for (let x = 0; x < 4; x++) {
        for (let z = 0; z < 12; z++) {
            const c = model.clone();
            c.position.set(startX + x*180, 0, -z*350);
            c.rotation.y = Math.random()*Math.PI*2;
            scene.add(c);
        }
    }
}

/* BUILDINGS */
loader.load('./models/building.glb', g => {
    const m = g.scene; m.scale.setScalar(50);
    spawnCity(m, -700);
    update();
});
loader.load('./models/b1.glb', g => {
    const m = g.scene; m.scale.setScalar(50);
    spawnCity(m, 350);
    update();
});

/* TREES */
loader.load('./models/t1.glb', g => {
    const t = g.scene; t.scale.setScalar(3);
    for (let i=0;i<40;i++) {
        const l=t.clone(); l.position.set(-120,0,-i*300); scene.add(l);
        const r=t.clone(); r.position.set(120,0,-i*300); scene.add(r);
    }
    update();
});

/* JOYSTICK */
let move={x:0,z:0}, active=false, yaw=0, pitch=0;
const base=document.getElementById("joy-base"), knob=document.getElementById("joy-knob");

base.onpointerdown=e=>{active=true;base.setPointerCapture(e.pointerId)};
base.onpointermove=e=>{
 if(!active)return;
 const r=base.getBoundingClientRect();
 const dx=(e.clientX-(r.left+50))/50, dy=(e.clientY-(r.top+50))/50;
 const d=Math.min(Math.hypot(dx,dy),1);
 const a=Math.atan2(dy,dx);
 knob.style.transform=`translate(${Math.cos(a)*30}px,${Math.sin(a)*30}px)`;
 move.x=Math.cos(a)*d; move.z=Math.sin(a)*d;
};
onpointerup=()=>{active=false;knob.style.transform='';move={x:0,z:0}};

/* START */
document.getElementById("start-btn").onclick=()=>{
 document.getElementById("home-screen").style.display="none";
 animate();
};

/* LOOP */
function animate(){
 requestAnimationFrame(animate);
 player.rotation.y=yaw;
 const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
 const r=new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
 player.position.addScaledVector(f,-move.z*8);
 player.position.addScaledVector(r,move.x*8);
 renderer.render(scene,camera);
}
</script>

</body>
</html>
