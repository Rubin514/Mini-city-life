<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life 3D - Marker Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        canvas { display: block; touch-action: none; }

        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
        }
        #homeScreen h1 { font-size: 3em; color: orange; margin-bottom: 20px; }
        #homeScreen button {
            font-size: 24px; padding: 15px 40px; border: none; 
            border-radius: 12px; background: orange; color: white; cursor: pointer;
        }

        #uiHint {
            position: fixed; top: 20%; left: 50%; transform: translate(-50%, -50%);
            color: white; background: rgba(255,165,0,0.8); padding: 15px 30px;
            border-radius: 50px; display: none; pointer-events: none;
            font-weight: bold; font-size: 20px; z-index: 5; border: 2px solid white;
        }

        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn {
            width: 65px; height: 65px; margin: 5px; border-radius: 50%; 
            font-size: 24px; background: rgba(255,255,255,0.2);
            border: 2px solid white; color: white; user-select: none;
            display: flex; align-items: center; justify-content: center;
        }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }

        #enterBtn {
            position: fixed; bottom: 25px; right: 25px; width: 110px; height: 60px; 
            border-radius: 14px; font-size: 18px; background: orange; border: none;
            color: white; z-index: 10; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>Mini City 3D</h1>
    <button id="playBtn">START GAME</button>
</div>

<div id="uiHint">DOOR DETECTED: PRESS ENTER</div>

<div id="controls">
    <div class="btn" id="up">⬆</div>
    <div class="btn" id="left">⬅</div>
    <div class="btn" id="right">➡</div>
    <div class="btn" id="down">⬇</div>
</div>

<button id="enterBtn">ENTER</button>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ---------- SCENE SETUP ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(50, 100, 50);
scene.add(sun);

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(5000, 5000),
    new THREE.MeshStandardMaterial({ color: 0x444444 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------- PLAYER ---------- */
const player = new THREE.Object3D();
player.position.set(0, 2, 0); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
const speed = 0.6;
const move = { up: false, down: false, left: false, right: false };

/* ---------- LOADING BUILDINGS & X-RAY MARKERS ---------- */
const buildings = [];
const loader = new GLTFLoader();

loader.load('models/building.glb', (gltf) => {
    const baseBuilding = gltf.scene;
    baseBuilding.scale.set(3, 3, 3);
    const spacing = 150; 

    for (let x = -3; x <= 3; x++) {
        for (let z = -3; z <= 3; z++) {
            if (Math.abs(x) <= 1 && Math.abs(z) <= 1) continue; 

            const b = baseBuilding.clone();
            b.position.set(x * spacing, 0, z * spacing);
            scene.add(b);

            const box = new THREE.Box3().setFromObject(b);

            // Door Point: Try Z + 15 (further out so it's not inside the wall)
            const doorWorldPos = new THREE.Vector3(x * spacing, 5, z * spacing + 15);

            // X-RAY MARKER: Visible through walls
            const markerGeo = new THREE.SphereGeometry(2.5);
            const markerMat = new THREE.MeshBasicMaterial({ 
                color: 0xff0000, 
                depthTest: false, // THIS MAKES IT VISIBLE THROUGH WALLS
                transparent: true,
                opacity: 0.8
            });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.copy(doorWorldPos);
            marker.renderOrder = 999; // Ensures it draws on top
            scene.add(marker);

            buildings.push({ mesh: b, box: box, doorWorld: doorWorldPos });
        }
    }
    console.log("Buildings loaded: " + buildings.length);
});

/* ---------- CONTROLS ---------- */
function bindBtn(id, key) {
    const el = document.getElementById(id);
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); move[key] = true; });
    const stop = (e) => { e.preventDefault(); move[key] = false; };
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointerleave", stop);
}
bindBtn("up", "up"); bindBtn("down", "down");
bindBtn("left", "left"); bindBtn("right", "right");

/* MOUSE/TOUCH LOOK */
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener("pointerup", () => dragging = false);
window.addEventListener("pointermove", e => {
    if (!dragging) return;
    targetYaw -= (e.clientX - lastX) * 0.007;
    targetPitch -= (e.clientY - lastY) * 0.007;
    targetPitch = Math.max(-1.1, Math.min(1.1, targetPitch));
    lastX = e.clientX; lastY = e.clientY;
});

/* ---------- GAME LOGIC ---------- */
const playerHitbox = new THREE.Box3();
const uiHint = document.getElementById("uiHint");

document.getElementById("enterBtn").onclick = () => {
    let near = false;
    for (const b of buildings) {
        if (player.position.distanceTo(b.doorWorld) < 20) {
            player.position.set(0, 2, -2000); // Teleport
            near = true; break;
        }
    }
    if(!near && player.position.z > -1000) alert("Walk into a Red Glow first!");
    if(player.position.z < -1000) player.position.set(0,2,0); // Exit
};

document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

function animate() {
    requestAnimationFrame(animate);

    yaw += (targetYaw - yaw) * 0.15;
    pitch += (targetPitch - pitch) * 0.15;

    let nx = player.position.x;
    let nz = player.position.z;

    if (move.up) { nx -= Math.sin(yaw) * speed; nz -= Math.cos(yaw) * speed; }
    if (move.down) { nx += Math.sin(yaw) * speed; nz += Math.cos(yaw) * speed; }
    if (move.left) { nx -= Math.cos(yaw) * speed; nz += Math.sin(yaw) * speed; }
    if (move.right) { nx += Math.cos(yaw) * speed; nz -= Math.sin(yaw) * speed; }

    // Collision Check
    playerHitbox.setFromCenterAndSize(new THREE.Vector3(nx, 2, nz), new THREE.Vector3(3, 4, 3));
    let collision = false;
    for (const b of buildings) {
        if (playerHitbox.intersectsBox(b.box)) { collision = true; break; }
    }
    if (!collision) { player.position.x = nx; player.position.z = nz; }

    // UI Hint Logic
    let nearDoor = false;
    for(const b of buildings) {
        if(player.position.distanceTo(b.doorWorld) < 20) { nearDoor = true; break; }
    }
    uiHint.style.display = nearDoor ? "block" : "none";

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}
animate();

window.onresize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
};
</script>
</body>
</html>
