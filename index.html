<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini City Life 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body { margin:0; overflow:hidden; background:#87ceeb; font-family:sans-serif; }
canvas { display:block; touch-action:none; }

#controls {
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:10;
}
.btn {
  width:60px;
  height:60px;
  margin:4px;
  border-radius:50%;
  font-size:20px;
  background:rgba(255,255,255,0.4);
  border:2px solid white;
}

#enterBtn {
  position:fixed;
  bottom:25px;
  right:25px;
  width:110px;
  height:60px;
  border-radius:14px;
  font-size:18px;
  background:orange;
  border:none;
  z-index:10;
}
</style>
</head>

<body>

<div id="controls">
  <button class="btn" id="up">⬆</button><br>
  <button class="btn" id="left">⬅</button>
  <button class="btn" id="right">➡</button><br>
  <button class="btn" id="down">⬇</button>
</div>

<button id="enterBtn">ENTER</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ---------- SCENE ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* ---------- CAMERA ---------- */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

/* ---------- RENDERER ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ---------- LIGHT ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50,100,50);
scene.add(sun);

/* ---------- GROUND ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({ color:0x2e7d32 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ---------- PLAYER ---------- */
const player = new THREE.Object3D();
player.position.set(0,2,40);
scene.add(player);
player.add(camera);

let yaw = 0;
let pitch = 0;
const speed = 0.35;

/* ---------- MOVEMENT INPUT ---------- */
const move = { up:false, down:false, left:false, right:false };

function bindBtn(id, key){
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", e=>{
    e.preventDefault();
    move[key]=true;
  });
  el.addEventListener("pointerup", ()=>move[key]=false);
  el.addEventListener("pointerleave", ()=>move[key]=false);
}

bindBtn("up","up");
bindBtn("down","down");
bindBtn("left","left");
bindBtn("right","right");

/* ---------- KEYBOARD ---------- */
window.addEventListener("keydown",e=>{
  if(e.key==="w") move.up=true;
  if(e.key==="s") move.down=true;
  if(e.key==="a") move.left=true;
  if(e.key==="d") move.right=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="w") move.up=false;
  if(e.key==="s") move.down=false;
  if(e.key==="a") move.left=false;
  if(e.key==="d") move.right=false;
});

/* ---------- SMOOTH LOOK ---------- */
let dragging=false;
let lastX=0, lastY=0;
let targetYaw=0, targetPitch=0;

renderer.domElement.addEventListener("pointerdown", e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

renderer.domElement.addEventListener("pointerup", ()=>dragging=false);
renderer.domElement.addEventListener("pointerleave", ()=>dragging=false);

renderer.domElement.addEventListener("pointermove", e=>{
  if(!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  targetYaw   -= dx * 0.003;
  targetPitch -= dy * 0.003;

  targetPitch = Math.max(-0.9, Math.min(0.9, targetPitch));

  lastX=e.clientX;
  lastY=e.clientY;
});

/* ---------- BUILDINGS ---------- */
const buildings=[];
const loader=new GLTFLoader();

loader.load("models/building.glb", gltf=>{
  const base=gltf.scene;
  base.scale.set(3,3,3);

  const spacing=50;

  for(let x=-2;x<=2;x++){
    for(let z=-2;z<=2;z++){
      if(x===0 && z===0) continue;

      const b=base.clone();
      b.position.set(x*spacing,0,z*spacing);
      scene.add(b);

      const box=new THREE.Box3().setFromObject(b);

      const door=new THREE.Mesh(
        new THREE.BoxGeometry(2,4,0.4),
        new THREE.MeshStandardMaterial({color:0x4e342e})
      );
      door.position.set(0,2,6);
      b.add(door);

      const doorWorld=new THREE.Vector3();
      door.getWorldPosition(doorWorld);

      buildings.push({box,doorWorld});
    }
  }
});

/* ---------- COLLISION ---------- */
function canMove(nx,nz){
  const pBox=new THREE.Box3(
    new THREE.Vector3(nx-1,0,nz-1),
    new THREE.Vector3(nx+1,4,nz+1)
  );
  for(const b of buildings){
    if(pBox.intersectsBox(b.box)) return false;
  }
  return true;
}

/* ---------- ENTER ---------- */
let inside=false;
document.getElementById("enterBtn").onclick=()=>{
  if(!inside){
    for(const b of buildings){
      if(player.position.distanceTo(b.doorWorld)<3){
        player.position.set(0,2,-150);
        inside=true;
        return;
      }
    }
    alert("Go near the door");
  }else{
    player.position.set(0,2,40);
    inside=false;
  }
};

/* ---------- LOOP ---------- */
function animate(){
  requestAnimationFrame(animate);

  // Smooth interpolation (NO LAG)
  yaw += (targetYaw - yaw) * 0.15;
  pitch += (targetPitch - pitch) * 0.15;

  let nx=player.position.x;
  let nz=player.position.z;

  if(move.up){
    nx -= Math.sin(yaw)*speed;
    nz -= Math.cos(yaw)*speed;
  }
  if(move.down){
    nx += Math.sin(yaw)*speed;
    nz += Math.cos(yaw)*speed;
  }

  if(canMove(nx,nz)){
    player.position.x=nx;
    player.position.z=nz;
  }

  player.rotation.y=yaw;
  camera.rotation.x=pitch;

  renderer.render(scene,camera);
}
animate();

onresize=()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
