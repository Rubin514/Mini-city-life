<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Legend - Night City Fixed</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --border: rgba(255, 255, 255, 0.2); }
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 15px; position: absolute; color: white; pointer-events: none; z-index: 10; }
        #health-bar { top: 20px; left: 20px; width: 160px; height: 12px; padding: 4px; }
        #health-fill { width: 100%; height: 100%; background: #27ae60; border-radius: 6px; }
        #mission-hud { top: 20px; right: 20px; padding: 15px; text-align: right; }
        #mission-hud b { color: #f1c40f; display: block; margin-top: 5px; }
        #joy-base { position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; background: var(--glass); border-radius: 50%; pointer-events: auto; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 50%; }
        #home-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; }
        #start-btn { margin-top: 20px; padding: 15px 40px; background: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1>CITY LEGEND</h1>
    <div id="loading-text">Loading Assets... 0%</div>
    <button id="start-btn">START MISSION</button>
</div>

<div id="health-bar" class="glass"><div id="health-fill"></div></div>
<div id="mission-hud" class="glass"><small>OBJECTIVE</small><b>Enter the City</b></div>
<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{
    "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // 1. SCENE SETUP (Midnight Atmosphere)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205); // Deep night sky
    scene.fog = new THREE.FogExp2(0x020205, 0.005); // Thick night fog

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1500);
    const player = new THREE.Group();
    player.position.set(0, 1.6, 50); // Human eye-level height
    scene.add(player);
    player.add(camera);

    // Night Lighting
    scene.add(new THREE.AmbientLight(0x4040ff, 0.5)); // Blueish moonlight
    const streetLamp = new THREE.PointLight(0xffaa00, 2, 100); // Warm orange glow
    player.add(streetLamp);

    // 2. THE GROUND
    const floorGeo = new THREE.PlaneGeometry(2000, 2000);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // 3. ASSET LOADING (Balanced Scaling)
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);

    let loadedCount = 0;
    const updateProgress = () => {
        loadedCount++;
        const p = Math.floor((loadedCount / 3) * 100);
        document.getElementById('loading-text').innerText = `Loading Assets... ${p}%`;
        if(p >= 100) document.getElementById('start-btn').style.display = 'block';
    }

    // Buildings: Scaled UP to be massive
    loader.load('./models/building.glb', (gltf) => {
        const b = gltf.scene;
        b.scale.set(15, 25, 15); // Large skyscraper scale
        for(let i = 0; i < 10; i++) {
            const clone = b.clone();
            clone.position.set(-150 - Math.random()*50, 0, -300 * i);
            scene.add(clone);
        }
        updateProgress();
    });

    loader.load('./models/b1.glb', (gltf) => {
        const b = gltf.scene;
        b.scale.set(15, 25, 15);
        for(let i = 0; i < 10; i++) {
            const clone = b.clone();
            clone.position.set(150 + Math.random()*50, 0, -300 * i);
            scene.add(clone);
        }
        updateProgress();
    });

    // Trees: Scaled DOWN so they don't look like giants
    loader.load('./models/t1.glb', (gltf) => {
        const t = gltf.scene;
        t.scale.set(0.8, 0.8, 0.8); // Tiny compared to buildings
        for(let i = 0; i < 30; i++) {
            const tL = t.clone(); tL.position.set(-60, 0, -100 * i); scene.add(tL);
            const tR = t.clone(); tR.position.set(60, 0, -100 * i); scene.add(tR);
        }
        updateProgress();
    });

    // 4. PLAYER MOVEMENT
    let moveDir = { x: 0, z: 0 }, joyActive = false;
    let yaw = 0, pitch = 0;
    const jBase = document.getElementById('joy-base'), jKnob = document.getElementById('joy-knob');

    jBase.onpointerdown = (e) => { joyActive = true; jBase.setPointerCapture(e.pointerId); };
    jBase.onpointermove = (e) => {
        if (!joyActive) return;
        const r = jBase.getBoundingClientRect();
        const dx = (e.clientX - (r.left + 50)) / 50;
        const dy = (e.clientY - (r.top + 50)) / 50;
        const d = Math.min(Math.sqrt(dx*dx + dy*dy), 1);
        const a = Math.atan2(dy, dx);
        jKnob.style.transform = `translate(${Math.cos(a)*d*25}px, ${Math.sin(a)*d*25}px)`;
        moveDir.x = Math.cos(a) * d; moveDir.z = Math.sin(a) * d;
    };
    window.onpointerup = () => { joyActive = false; jKnob.style.transform = ''; moveDir = {x:0, z:0}; };

    window.addEventListener('pointermove', (e) => {
        if (joyActive && e.clientX < window.innerWidth/2) return;
        if (e.buttons === 1 || e.pointerType === 'touch') {
            yaw -= e.movementX * 0.003;
            pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.003));
        }
    });

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('home-screen').style.display = 'none';
    };

    function animate() {
        requestAnimationFrame(animate);
        player.rotation.y = yaw;
        camera.rotation.x = pitch;
        if (moveDir.x !== 0 || moveDir.z !== 0) {
            const speed = 1.2; // Slower, more realistic walking speed
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
            player.position.addScaledVector(forward, -moveDir.z * speed);
            player.position.addScaledVector(right, moveDir.x * speed);
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
