<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini City Life 3D + Minimap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
  body { margin:0; overflow:hidden; background:#87ceeb; font-family:sans-serif; }
  canvas { display:block; }
  #controls { position:fixed; bottom:20px; left:20px; z-index:10; }
  .btn { width:60px; height:60px; margin:4px; border-radius:50%; font-size:20px; background:rgba(255,255,255,0.5); border:2px solid white; }
  #enterBtn { position:fixed; bottom:25px; right:25px; width:110px; height:60px; border-radius:14px; font-size:18px; background:orange; border:none; z-index:10; cursor:pointer;}
</style>
</head>
<body>

<div id="controls">
  <button class="btn" id="up">⬆</button><br>
  <button class="btn" id="left">⬅</button>
  <button class="btn" id="right">➡</button><br>
  <button class="btn" id="down">⬇</button>
</div>
<button id="enterBtn">ENTER</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ---------- SCENE & RENDERER ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
// Enable Scissor test for Minimap
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

/* ---------- CAMERAS ---------- */
// Main Camera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

// Minimap Camera (Top-down view)
const mapSize = 200; // Size of the area the map sees
const minimapCamera = new THREE.OrthographicCamera(-mapSize/2, mapSize/2, mapSize/2, -mapSize/2, 1, 1000);
minimapCamera.position.set(0, 100, 0); // High above
minimapCamera.lookAt(0, 0, 0);

/* ---------- LIGHTS ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 100, 50);
scene.add(sun);

/* ---------- GROUND ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({ color:0x2e7d32 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ---------- PLAYER ---------- */
const player = new THREE.Object3D();
player.position.set(0, 2, 40);
scene.add(player);
player.add(camera);

// Player Marker for Minimap (Red Cube)
const markerGeo = new THREE.ConeGeometry(2, 5, 4);
const markerMat = new THREE.MeshBasicMaterial({color: 0xff0000});
const marker = new THREE.Mesh(markerGeo, markerMat);
marker.rotation.x = Math.PI / 2;
player.add(marker);

let yaw = 0;
const speed = 0.6;

/* ---------- INPUTS ---------- */
const keys = { up: false, down: false, left: false, right: false };
const setupBtn = (id) => {
  const btn = document.getElementById(id);
  btn.onpointerdown = () => keys[id] = true;
  btn.onpointerup = () => keys[id] = false;
};
["up","down","left","right"].forEach(setupBtn);

window.onkeydown = (e) => {
  if(e.key === "w" || e.key === "ArrowUp") keys.up = true;
  if(e.key === "s" || e.key === "ArrowDown") keys.down = true;
  if(e.key === "a" || e.key === "ArrowLeft") keys.left = true;
  if(e.key === "d" || e.key === "ArrowRight") keys.right = true;
};
window.onkeyup = (e) => {
  if(e.key === "w" || e.key === "ArrowUp") keys.up = false;
  if(e.key === "s" || e.key === "ArrowDown") keys.down = false;
  if(e.key === "a" || e.key === "ArrowLeft") keys.left = false;
  if(e.key === "d" || e.key === "ArrowRight") keys.right = false;
};

/* ---------- BUILDINGS ---------- */
const buildings = [];
const loader = new GLTFLoader();

function createBuildingPlaceholder(x, z) {
  const geo = new THREE.BoxGeometry(15, 30, 15);
  const mat = new THREE.MeshStandardMaterial({color: 0x808080});
  const b = new THREE.Mesh(geo, mat);
  b.position.set(x, 15, z);
  scene.add(b);
  buildings.push({ box: new THREE.Box3().setFromObject(b), doorWorld: new THREE.Vector3(x, 2, z + 8) });
}

// Try loading GLB, fallback to cubes if it fails
loader.load("models/building.glb", 
  (gltf) => { /* Logic for actual model if exists */ },
  undefined,
  () => {
    // Fallback: Generate a grid of simple boxes
    const spacing = 60;
    for(let x = -2; x <= 2; x++){
      for(let z = -2; z <= 2; z++){
        if(x === 0 && z === 0) continue;
        createBuildingPlaceholder(x * spacing, z * spacing);
      }
    }
  }
);

/* ---------- COLLISION ---------- */
function canMove(nx, nz){
  const pBox = new THREE.Box3(
    new THREE.Vector3(nx-1, 0, nz-1),
    new THREE.Vector3(nx+1, 4, nz+1)
  );
  for(const b of buildings){
    if(pBox.intersectsBox(b.box)) return false;
  }
  return true;
}

/* ---------- LOOP ---------- */
function animate() {
  requestAnimationFrame(animate);

  let nx = player.position.x;
  let nz = player.position.z;

  if (keys.up) { nx -= Math.sin(yaw) * speed; nz -= Math.cos(yaw) * speed; }
  if (keys.down) { nx += Math.sin(yaw) * speed; nz += Math.cos(yaw) * speed; }
  if (keys.left) yaw += 0.04;
  if (keys.right) yaw -= 0.04;

  if (canMove(nx, nz)) {
    player.position.x = nx;
    player.position.z = nz;
  }
  player.rotation.y = yaw;

  // 1. Render Main View
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
  renderer.render(scene, camera);

  // 2. Render Minimap View
  const mapWidth = 200;
  const mapHeight = 200;
  // Update minimap camera to follow player from above
  minimapCamera.position.set(player.position.x, 100, player.position.z);
  minimapCamera.lookAt(player.position.x, 0, player.position.z);
  
  renderer.setViewport(window.innerWidth - mapWidth - 10, window.innerHeight - mapHeight - 10, mapWidth, mapHeight);
  renderer.setScissor(window.innerWidth - mapWidth - 10, window.innerHeight - mapHeight - 10, mapWidth, mapHeight);
  renderer.render(scene, minimapCamera);
}
animate();

window.onresize = () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
};
</script>
</body>
</html>
