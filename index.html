<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Fixed & Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87ceeb; }
        canvas { display: block; touch-action: none; }
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100; color: #fff;
        }
        #playBtn { font-size: 22px; padding: 12px 40px; border: 2px solid #00ff00; background: none; color: #00ff00; cursor: pointer; border-radius: 50px; display: none; }
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 55px; height: 55px; margin: 4px; border-radius: 12px; font-size: 20px; background: rgba(0,0,0,0.5); border: 1.5px solid white; color: white; display: flex; align-items: center; justify-content: center; user-select: none; }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }
        .action-container { position: fixed; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 8px; }
        .action-btn { width: 90px; height: 50px; border-radius: 12px; font-size: 16px; color: white; border: 1.5px solid #fff; font-weight: bold; }
        #jumpBtn { background: #ff9800; } #enterBtn { background: #f44336; }
        #msg { position: fixed; top: 20%; width: 100%; text-align: center; color: yellow; font-size: 20px; font-weight: bold; display: none; text-shadow: 2px 2px #000; pointer-events: none; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>MINI CITY LIFE</h1>
    <p id="status">Engine Warmup...</p>
    <button id="playBtn">START GAME</button>
</div>

<div id="msg">ENTRY DETECTED</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<div class="action-container">
    <button class="action-btn" id="jumpBtn">JUMP</button>
    <button class="action-btn" id="enterBtn">ENTER</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* --- 1. CORE SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 200, 3000); // Added fog to hide edge of world

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.5, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Capped at 1.5 for better mobile fps
document.body.appendChild(renderer.domElement);

const light = new THREE.AmbientLight(0xffffff, 2.0);
scene.add(light);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(100, 500, 100);
scene.add(sun);

/* --- 2. ENVIRONMENT --- */
const land = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x228b22 }));
land.rotation.x = -Math.PI / 2;
scene.add(land);

// Standard Roads
const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
const roadHGeo = new THREE.PlaneGeometry(10000, 180);
const roadVGeo = new THREE.PlaneGeometry(180, 10000);

for(let i = -5; i <= 5; i++) {
    const pos = i * 1000;
    const rh = new THREE.Mesh(roadHGeo, roadMat);
    rh.rotation.x = -Math.PI/2; rh.position.set(0, 0.2, pos); scene.add(rh);
    const rv = new THREE.Mesh(roadVGeo, roadMat);
    rv.rotation.x = -Math.PI/2; rv.position.set(pos, 0.2, 0); scene.add(rv);
}

/* --- 3. ASSET MANAGEMENT --- */
const manager = new THREE.LoadingManager();
const loader = new GLTFLoader(manager);
let modelData = { b1: null, b2: null, tree: null, npc: null };
const colliders = [];
const entryPoints = [];

manager.onLoad = () => {
    document.getElementById('status').innerText = "Ready!";
    document.getElementById('playBtn').style.display = "block";
    generateCityInstanced();
};

// FIX: Helper to find the actual Mesh inside the GLB
function getMesh(scene) {
    let mesh = null;
    scene.traverse((child) => {
        if (child.isMesh && !mesh) mesh = child;
    });
    return mesh;
}

loader.load('models/building.glb', (g) => { modelData.b1 = getMesh(g.scene); });
loader.load('models/building2.glb', (g) => { modelData.b2 = getMesh(g.scene); });
loader.load('models/tree1.glb', (g) => { 
    const t = getMesh(g.scene);
    if(t) t.material.alphaTest = 0.5; // Fix transparent leaves
    modelData.tree = t; 
});
loader.load('models/npc.glb', (g) => { modelData.npc = g.scene; });

function generateCityInstanced() {
    const dummy = new THREE.Object3D();
    const markerGeo = new THREE.CircleGeometry(40, 16);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.4 });

    // --- INSTANCING SETUP ---
    // We create "InstancedMesh" which draws 100 buildings with the cost of 1.
    let iMesh1, iMesh2, iTree;
    
    // Safety check: Only create if models loaded correctly
    if (modelData.b1) {
        iMesh1 = new THREE.InstancedMesh(modelData.b1.geometry, modelData.b1.material, 100);
        scene.add(iMesh1);
    }
    if (modelData.b2) {
        iMesh2 = new THREE.InstancedMesh(modelData.b2.geometry, modelData.b2.material, 100);
        scene.add(iMesh2);
    }
    if (modelData.tree) {
        iTree = new THREE.InstancedMesh(modelData.tree.geometry, modelData.tree.material, 200);
        scene.add(iTree);
    }

    let idx1 = 0, idx2 = 0, idxTree = 0;

    for (let x = -4; x <= 4; x++) {
        for (let z = -4; z <= 4; z++) {
            if (x === 0 && z === 0) continue;
            
            const bx = x * 1000 + 400;
            const bz = z * 1000 + 400;

            // 1. PLACE BUILDINGS
            dummy.position.set(bx, 0, bz);
            dummy.scale.set(6, 6, 6);
            dummy.rotation.set(0, 0, 0);
            dummy.updateMatrix();

            if(Math.random() > 0.5 && iMesh1) {
                iMesh1.setMatrixAt(idx1++, dummy.matrix);
            } else if (iMesh2) {
                iMesh2.setMatrixAt(idx2++, dummy.matrix);
            }

            // Collider
            colliders.push({ x: bx, z: bz, r: 120 }); // Simple circle collision

            // Entry Marker
            const entry = new THREE.Mesh(markerGeo, markerMat);
            entry.rotation.x = -Math.PI / 2;
            entry.position.set(bx - 120, 0.3, bz); 
            scene.add(entry);
            entryPoints.push(entry.position);

            // 2. PLACE TREES (Added this back!)
            if(iTree) {
                // Place 2 trees per block
                for(let t=0; t<2; t++) {
                    dummy.position.set(bx + (Math.random()-0.5)*500, 0, bz + (Math.random()-0.5)*500);
                    dummy.scale.set(4, 4, 4);
                    dummy.rotation.set(0, Math.random() * Math.PI, 0); // Random rotation
                    dummy.updateMatrix();
                    iTree.setMatrixAt(idxTree++, dummy.matrix);
                }
            }
        }
    }
    
    // Notify three.js that the instances are ready
    if(iMesh1) iMesh1.instanceMatrix.needsUpdate = true;
    if(iMesh2) iMesh2.instanceMatrix.needsUpdate = true;
    if(iTree) iTree.instanceMatrix.needsUpdate = true;

    // Place NPC
    if(modelData.npc) {
        modelData.npc.scale.set(6, 6, 6);
        modelData.npc.position.set(60, 0, 400);
        scene.add(modelData.npc);
    }
}

/* --- 4. GAME LOOP --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 500); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0, velocityY = 0;
const move = { up: false, down: false, left: false, right: false };
let isGrounded = true;

function updatePhysics() {
    let nx = player.position.x, nz = player.position.z, spd = 5.0; // Slightly faster speed
    
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    // Fast Circle Collision Check
    let collision = false;
    for (let i = 0; i < colliders.length; i++) {
        const c = colliders[i];
        const distSq = (nx - c.x)**2 + (nz - c.z)**2;
        if (distSq < c.r * c.r) { collision = true; break; }
    }

    if (!collision) { player.position.x = nx; player.position.z = nz; }

    velocityY -= 0.02; player.position.y += velocityY;
    if (player.position.y <= 10) { player.position.y = 10; velocityY = 0; isGrounded = true; }
}

function animate() {
    requestAnimationFrame(animate);
    
    yaw += (targetYaw - yaw) * 0.15;
    pitch += (targetPitch - pitch) * 0.15;
    player.rotation.y = yaw; 
    camera.rotation.x = pitch;

    updatePhysics();

    let near = false;
    // 80 * 80 = 6400 (Squared distance check is faster for CPU)
    for(let i = 0; i < entryPoints.length; i++) {
        if(player.position.distanceToSquared(entryPoints[i]) < 6400) {
            near = true; break;
        }
    }
    document.getElementById("msg").style.display = near ? "block" : "none";

    renderer.render(scene, camera);
}
animate();

/* --- CONTROLS --- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    el.onpointerup = () => move[k] = false;
    el.onpointerleave = () => move[k] = false;
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

document.getElementById("jumpBtn").onpointerdown = () => { if(isGrounded){ velocityY=0.5; isGrounded=false; }};
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

let drag = false, lx, ly;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => { 
    if (drag) { 
        targetYaw -= (e.clientX - lx) * 0.007; 
        targetPitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, targetPitch - (e.clientY - ly) * 0.007)); 
        lx = e.clientX; ly = e.clientY; 
    } 
};

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
