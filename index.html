<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini City Life - GitHub Fixed</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
  #status {
    position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
    color: #0f0; padding: 10px; z-index: 100; font-size: 12px; border-radius: 5px;
    pointer-events: none; max-width: 80%;
  }
  #start-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); display: flex; justify-content: center;
    align-items: center; z-index: 1000; color: white; flex-direction: column;
  }
  #start-btn {
    padding: 15px 30px; font-size: 18px; cursor: pointer; background: #4caf50;
    border: none; color: white; border-radius: 5px; font-weight: bold;
  }
  #joystick-base { 
    position: absolute; bottom: 50px; left: 50px; width: 80px; height: 80px; 
    background: rgba(255,255,255,0.2); border-radius: 50%; z-index: 10; border: 2px solid white;
  }
  #joystick-knob { 
    position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; 
    background: #fff; border-radius: 50%; 
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>Mini City Life</h1>
  <button id="start-btn">TAP TO START</button>
</div>

<div id="status">Ready to load...</div>
<div id="joystick-base"><div id="joystick-knob"></div></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { DRACOLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js";

const statusUI = document.getElementById("status");
const log = (t) => { statusUI.innerHTML += "<br>" + t; };

/* SCENE SETUP */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(50, 100, 50);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000, 1000),
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* PLAYER SETUP */
const playerGroup = new THREE.Group();
scene.add(playerGroup);
const dummyPlayer = new THREE.Mesh(
  new THREE.BoxGeometry(2, 2, 2), 
  new THREE.MeshBasicMaterial({ color: 0xff0000 })
);
playerGroup.add(dummyPlayer);

/* --- LOADER SETUP --- */
const dracoLoader = new DRACOLoader();
// Using CDN for Draco decoder binaries
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

function loadGLB(file, x, z, isPlayer = false) {
  // Use ./ to ensure GitHub Pages looks in the current folder
  const path = `./models/${file}`;
  
  const marker = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true })
  );
  marker.position.set(x, 0.5, z);
  scene.add(marker);

  loader.load(path, (gltf) => {
      scene.remove(marker);
      const model = gltf.scene;

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const scale = 12 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);

      if (isPlayer) {
        playerGroup.remove(dummyPlayer);
        playerGroup.add(model);
        log(`✅ Player Loaded: ${file}`);
      } else {
        model.position.set(x, 0, z);
        scene.add(model);
        log(`✅ Building Loaded: ${file}`);
      }
    },
    (xhr) => {
      const p = (xhr.loaded / xhr.total * 100).toFixed(0);
      if(p < 100) statusUI.innerText = `Loading ${file}: ${p}%`;
    },
    (err) => {
      log(`❌ FAILED: ${file}`);
      console.error("Error loading " + path, err);
    }
  );
}

/* INTERACTION START (Essential for Mobile) */
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  log("Initializing models...");
  loadGLB("building.glb", -30, -20);
  loadGLB("b1.glb", 30, -20);
  loadGLB("t1.glb", 0, 0, true);
});

/* JOYSTICK & ANIMATION (Rest of your original code) */
let moveX = 0, moveZ = 0, dragging = false;
const knob = document.getElementById('joystick-knob');
const base = document.getElementById('joystick-base');

base.onpointerdown = (e) => { dragging = true; base.setPointerCapture(e.pointerId); };
window.onpointermove = (e) => {
    if (!dragging) return;
    const b = base.getBoundingClientRect();
    let dx = e.clientX - (b.left + 40);
    let dy = e.clientY - (b.top + 40);
    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 30);
    const angle = Math.atan2(dy, dx);
    knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
    moveX = (Math.cos(angle) * dist) / 30;
    moveZ = (Math.sin(angle) * dist) / 30;
};
window.onpointerup = () => { dragging = false; knob.style.transform = ''; moveX = 0; moveZ = 0; };

function animate() {
  requestAnimationFrame(animate);
  playerGroup.position.x += moveX * 0.5;
  playerGroup.position.z += moveZ * 0.5;
  camera.position.lerp(new THREE.Vector3(playerGroup.position.x, 35, playerGroup.position.z + 50), 0.1);
  camera.lookAt(playerGroup.position);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
