<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js GLB Test</title>
<style>
  body { margin: 0; overflow: hidden; }
</style>
</head>
<body>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { GLTFLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

console.log("SCRIPT STARTED");

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 15);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff, 2));

/* GROUND (PROOF SCENE WORKS) */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshStandardMaterial({ color: 0x00ff00 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* LOAD ONE MODEL — ABSOLUTE URL */
const loader = new GLTFLoader();

loader.load(
  "https://rubin514.github.io/Mini-city-life/b1.glb",
  (gltf) => {
    console.log("MODEL LOADED");
    const model = gltf.scene;

    // FORCE VISIBILITY
    model.scale.set(10, 10, 10);
    model.position.set(0, 0, 0);

    scene.add(model);
  },
  (xhr) => {
    console.log("Loading:", (xhr.loaded / xhr.total * 100).toFixed(0) + "%");
  },
  (error) => {
    console.error("GLB ERROR", error);
  }
);

/* ANIMATE */
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
