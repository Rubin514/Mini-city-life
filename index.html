<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini City Life 3D</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87ceeb;
    font-family: monospace;
    touch-action: none;
}

#status {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.8);
    color: #0f0;
    padding: 8px;
    font-size: 11px;
    border-radius: 5px;
    z-index: 10;
}

#joystick-base {
    position: absolute;
    bottom: 40px;
    left: 40px;
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
}

#joystick-knob {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 40px;
    height: 40px;
    background: white;
    border-radius: 50%;
}
</style>
</head>

<body>

<div id="status">Starting engine...</div>
<div id="joystick-base"><div id="joystick-knob"></div></div>

<!-- IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const statusUI = document.getElementById("status");
const log = (t) => statusUI.innerHTML += "<br>" + t;

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// CAMERA
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

// RENDERER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(10, 20, 10);
scene.add(sun);

// GROUND
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// PLAYER GROUP
const player = new THREE.Group();
scene.add(player);

// LOADER
const loader = new GLTFLoader();

function loadModel(name, x, z, isPlayer = false) {
    const path = `./models/${name}`;

    loader.load(path, (gltf) => {
        const model = gltf.scene;

        // AUTO SCALE
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const scale = 12 / Math.max(size.x, size.y, size.z);
        model.scale.set(scale, scale, scale);

        if (isPlayer) {
            player.add(model);
            log("✅ Player loaded");
        } else {
            model.position.set(x, 0, z);
            scene.add(model);
            log(`✅ Building loaded: ${name}`);
        }
    },
    undefined,
    () => log(`❌ Failed: ${name}`)
    );
}

// LOAD MODELS
loadModel("building.glb", -25, -10);
loadModel("b1.glb", 25, -10);
loadModel("t1.glb", 0, 0, true);

// CAMERA START
camera.position.set(0, 15, 35);
camera.lookAt(player.position);

// JOYSTICK
let moveX = 0, moveZ = 0, dragging = false;
const base = document.getElementById("joystick-base");
const knob = document.getElementById("joystick-knob");

base.onpointerdown = () => dragging = true;

window.onpointermove = (e) => {
    if (!dragging) return;

    const b = base.getBoundingClientRect();
    let dx = e.clientX - (b.left + 40);
    let dy = e.clientY - (b.top + 40);

    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 30);
    const ang = Math.atan2(dy, dx);

    knob.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;

    moveX = Math.cos(ang) * (dist / 30);
    moveZ = Math.sin(ang) * (dist / 30);
};

window.onpointerup = () => {
    dragging = false;
    knob.style.transform = "";
    moveX = 0;
    moveZ = 0;
};

// LOOP
function animate() {
    requestAnimationFrame(animate);

    player.position.x += moveX * 0.3;
    player.position.z += moveZ * 0.3;

    camera.position.set(
        player.position.x,
        15,
        player.position.z + 35
    );
    camera.lookAt(player.position);

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
