<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dr. City Life - Fixed Spawn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87ceeb; }
        canvas { display: block; touch-action: none; }
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: #00ff00;
        }
        #playBtn { font-size: 24px; padding: 15px 50px; border: 3px solid #00ff00; background: none; color: #00ff00; cursor: pointer; font-weight: bold; border-radius: 8px; }
        #minimapOverlay {
            position: fixed; top: 10px; right: 10px; width: 150px; height: 150px;
            border-radius: 50%; border: 4px solid white; pointer-events: none; z-index: 20;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn {
            width: 65px; height: 65px; margin: 5px; border-radius: 12px; 
            font-size: 28px; background: rgba(0,0,0,0.6);
            border: 2px solid #ffffff; color: white; display: flex; align-items: center; justify-content: center;
        }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }
        .action-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { width: 120px; height: 60px; border-radius: 12px; font-size: 18px; color: white; border: 3px solid #fff; cursor: pointer; font-weight: bold; }
        #jumpBtn { background: #ffa500; }
        #enterBtn { background: #ff0000; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>DR. CITY LIFE</h1>
    <button id="playBtn">START GAME</button>
</div>

<div id="minimapOverlay"></div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<div class="action-container">
    <button class="action-btn" id="jumpBtn">JUMP</button>
    <button class="action-btn" id="enterBtn">ENTER</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ---------- 1. SETUP ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
const mapCamera = new THREE.OrthographicCamera(-300, 300, 300, -300, 1, 1000);
mapCamera.position.y = 800; // Looking down
mapCamera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 2.0)); // Brightened light

/* ---------- 2. WORLD ---------- */
const land = new THREE.Mesh(
    new THREE.PlaneGeometry(5000, 5000), 
    new THREE.MeshLambertMaterial({ color: 0x228b22 }) // Solid green until texture loads
);
land.rotation.x = -Math.PI / 2;
scene.add(land);

// Texture loader for grass
new THREE.TextureLoader().load('textures/grass.png', (tex) => {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(150, 150);
    land.material.map = tex;
    land.material.needsUpdate = true;
});

/* ---------- 3. PLAYER SPAWN (AWAY FROM BUILDINGS) ---------- */
const player = new THREE.Object3D();
player.position.set(0, 4, 150); // Spawning you on the road
scene.add(player);
player.add(camera);

const pDot = new THREE.Mesh(new THREE.SphereGeometry(15), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
pDot.position.y = 600; // Only visible to map camera
player.add(pDot);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0, velocityY = 0;
const gravity = -0.018, jumpForce = 0.5, move = { up: false, down: false, left: false, right: false };
let isGrounded = true;

/* ---------- 4. ASSET LOADING ---------- */
const buildings = [];
const npcs = [];
const mixers = []; 
const clock = new THREE.Clock();
const loader = new GLTFLoader();

// Load Buildings - Grid adjusted to keep center (0,0) clear
loader.load('models/building.glb', (gltf) => {
    gltf.scene.scale.set(4, 4, 4);
    for (let x = -4; x <= 4; x++) {
        for (let z = -4; z <= 4; z++) {
            if (x === 0 && z === 0) continue; // DO NOT spawn a building at (0,0)
            const b = gltf.scene.clone();
            b.position.set(x * 400 + 100, 0, z * 400 + 100);
            scene.add(b);
            buildings.push({ box: new THREE.Box3().setFromObject(b) });
        }
    }
});

// Load Claude NPCs with fix for "flying" and visibility
loader.load('models/npc.glb', (gltf) => {
    const npcBase = gltf.scene;
    npcBase.traverse((n) => {
        if (n.isMesh) {
            n.material.side = THREE.DoubleSide; 
            n.material.alphaTest = 0.5;
            n.material.transparent = false;
        }
    });

    for (let i = 0; i < 20; i++) {
        const npc = npcBase.clone();
        npc.scale.set(3.5, 3.5, 3.5);
        // Randomly scatter, but away from spawn
        npc.position.set((Math.random()-0.5)*2500, 0, (Math.random()-0.5)*2500); 
        scene.add(npc);

        const mixer = new THREE.AnimationMixer(npc);
        if (gltf.animations.length > 0) mixer.clipAction(gltf.animations[0]).play();
        mixers.push(mixer);

        const nDot = new THREE.Mesh(new THREE.SphereGeometry(12), new THREE.MeshBasicMaterial({ color: 0x0000ff }));
        nDot.position.y = 600; 
        npc.add(nDot);

        npcs.push({ mesh: npc, speed: 25 + Math.random() * 20, turnTimer: Math.random() * 5 });
    }
});

/* ---------- 5. ANIMATION LOOP ---------- */
function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    mixers.forEach(m => m.update(dt));
    npcs.forEach(n => {
        n.mesh.position.x += Math.sin(n.mesh.rotation.y) * n.speed * dt;
        n.mesh.position.z += Math.cos(n.mesh.rotation.y) * n.speed * dt;
        n.turnTimer -= dt;
        if(n.turnTimer <= 0) {
            n.mesh.rotation.y += (Math.random()-0.5)*3;
            n.turnTimer = 3 + Math.random()*5;
        }
        if(Math.abs(n.mesh.position.x) > 2400 || Math.abs(n.mesh.position.z) > 2400) n.mesh.rotation.y += Math.PI;
    });

    // Player Rotation/Movement
    yaw += (targetYaw - yaw) * 0.1; pitch += (targetPitch - pitch) * 0.1;
    let nx = player.position.x, nz = player.position.z, spd = 130 * dt;
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(nx, 4, nz), new THREE.Vector3(8, 8, 8));
    let hit = false;
    for (const b of buildings) if (pBox.intersectsBox(b.box)) hit = true;
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY += gravity; player.position.y += velocityY;
    if (player.position.y <= 4) { player.position.y = 4; velocityY = 0; isGrounded = true; }

    player.rotation.y = yaw; camera.rotation.x = pitch;

    // RENDER MAIN
    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    renderer.clear();
    renderer.render(scene, camera);

    // RENDER MINIMAP
    const mSize = 150;
    renderer.setScissorTest(true);
    renderer.setScissor(window.innerWidth - mSize - 10, window.innerHeight - mSize - 10, mSize, mSize);
    renderer.setViewport(window.innerWidth - mSize - 10, window.innerHeight - mSize - 10, mSize, mSize);
    mapCamera.position.set(player.position.x, 800, player.position.z);
    renderer.render(scene, mapCamera);
    renderer.setScissorTest(false);
}
animate();

/* ---------- 6. UI & CONTROLS ---------- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    el.onpointerup = el.onpointerleave = () => move[k] = false;
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");
document.getElementById("jumpBtn").onpointerdown = () => { if(isGrounded){ velocityY=jumpForce; isGrounded=false; }};
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display="none";

let drag = false, lx, ly;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => { if (drag) { targetYaw -= (e.clientX - lx) * 0.007; targetPitch -= (e.clientY - ly) * 0.007; lx = e.clientX; ly = e.clientY; } };

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
