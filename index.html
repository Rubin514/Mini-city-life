<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Legend - Urban Edition</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.15); --border: rgba(255, 255, 255, 0.25); }
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: sans-serif; }

        /* --- Glassy HUD --- */
        .glass { background: var(--glass); backdrop-filter: blur(12px); border: 1.5px solid var(--border); border-radius: 12px; position: absolute; color: white; pointer-events: none; z-index: 10; }
        #mission-hud { top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 30px; font-weight: bold; letter-spacing: 1px; }
        
        /* --- Square Joystick --- */
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: var(--glass); border: 2px solid var(--border); border-radius: 20px; pointer-events: auto; }
        #joy-knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(255,255,255,0.4); border-radius: 15px; border: 1px solid #fff; }

        #home-screen { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; transition: opacity 0.5s; }
        #start-btn { margin-top: 20px; padding: 15px 40px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="home-screen">
    <h1 style="letter-spacing:5px">CITY LEGEND</h1>
    <button id="start-btn">ENTER CITY</button>
</div>

<div id="mission-hud" class="glass">MAIN BOULEVARD</div>
<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. SETUP
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 200, 1500);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 3000);
    const player = new THREE.Group();
    player.position.set(0, 14, 0); 
    scene.add(player);
    player.add(camera);

    scene.add(new THREE.AmbientLight(0xffffff, 1.8));

    // 2. THE BOULEVARD (The "Dr. Driving" Road)
    const createCityFloor = () => {
        const group = new THREE.Group();
        
        // Main Road (6 Lanes total)
        const road = new THREE.Mesh(new THREE.PlaneGeometry(160, 10000), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        road.rotation.x = -Math.PI / 2;
        group.add(road);

        // Yellow Median (Center)
        const median = new THREE.Mesh(new THREE.PlaneGeometry(2, 10000), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
        median.rotation.x = -Math.PI / 2;
        median.position.y = 0.1;
        group.add(median);

        // Lane Dashes
        const dashGeo = new THREE.PlaneGeometry(0.8, 15);
        const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i = 0; i < 150; i++) {
            const z = 5000 - (i * 60);
            [-55, -28, 28, 55].forEach(x => {
                const dash = new THREE.Mesh(dashGeo, dashMat);
                dash.rotation.x = -Math.PI / 2;
                dash.position.set(x, 0.15, z);
                group.add(dash);
            });
        }

        // Sidewalks
        const sw = new THREE.Mesh(new THREE.PlaneGeometry(600, 10000), new THREE.MeshStandardMaterial({ color: 0x444444 }));
        sw.rotation.x = -Math.PI / 2;
        sw.position.y = -0.2;
        group.add(sw);

        return group;
    };
    scene.add(createCityFloor());

    // 3. ASSET PLACEMENT (No Overlapping)
    const loader = new GLTFLoader();

    // Load Buildings (Pushed far back)
    const spawnBuildings = (url, xPos) => {
        loader.load(url, (gltf) => {
            const b = gltf.scene; b.scale.setScalar(35);
            for(let i = 0; i < 15; i++) {
                const c = b.clone();
                c.position.set(xPos, 0, -700 * i);
                scene.add(c);
            }
        });
    };
    spawnBuildings('./models/building.glb', -280);
    spawnBuildings('./models/b1.glb', 280);

    // Load Trees (t1) - Placed neatly on sidewalk edge
    loader.load('./models/t1.glb', (gltf) => {
        const tree = gltf.scene;
        tree.scale.setScalar(3); // Normal sized trees
        for(let i = 0; i < 40; i++) {
            const tL = tree.clone(); tL.position.set(-100, 0, -250 * i); scene.add(tL);
            const tR = tree.clone(); tR.position.set(100, 0, -250 * i); scene.add(tR);
        }
    });

    // 4. CONTROLS
    let moveDir = { x: 0, z: 0 }, joyActive = false;
    let yaw = 0, pitch = 0;
    const jBase = document.getElementById('joy-base'), jKnob = document.getElementById('joy-knob');

    jBase.onpointerdown = (e) => { joyActive = true; jBase.setPointerCapture(e.pointerId); };
    jBase.onpointermove = (e) => {
        if (!joyActive) return;
        const r = jBase.getBoundingClientRect();
        const dx = (e.clientX - (r.left + 50)) / 50, dy = (e.clientY - (r.top + 50)) / 50;
        const d = Math.min(Math.sqrt(dx*dx + dy*dy), 1);
        const a = Math.atan2(dy, dx);
        jKnob.style.transform = `translate(${Math.cos(a)*d*30}px, ${Math.sin(a)*d*30}px)`;
        moveDir.x = Math.cos(a) * d; moveDir.z = Math.sin(a) * d;
    };
    window.onpointerup = () => { joyActive = false; jKnob.style.transform = ''; moveDir = {x:0, z:0}; };

    window.addEventListener('pointermove', (e) => {
        if (joyActive && e.clientX < window.innerWidth/2) return;
        if (e.buttons === 1 || e.pointerType === 'touch') {
            yaw -= e.movementX * 0.004;
            pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.004));
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        player.rotation.y = yaw;
        camera.rotation.x = pitch;
        const f = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
        const r = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
        player.position.addScaledVector(f, -moveDir.z * 5);
        player.position.addScaledVector(r, moveDir.x * 5);
        renderer.render(scene, camera);
    }

    document.getElementById('start-btn').onclick = () => {
        document.getElementById('home-screen').style.display = 'none';
        animate();
    };
</script>
</body>
</html>
