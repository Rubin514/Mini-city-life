<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini City Life</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}
#info {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 10px;
  border-radius: 6px;
  font-size: 14px;
}
</style>
</head>

<body>
<div id="info">Loading models...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------------- SCENE ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* ---------------- CAMERA ---------------- */
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 30, 60);

/* ---------------- RENDERER ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ---------------- CONTROLS ---------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

/* ---------------- LIGHTS ---------------- */
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(30, 50, 20);
scene.add(sun);

/* ---------------- GROUND ---------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x4caf50 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------------- LOADER ---------------- */
const loader = new GLTFLoader();
const info = document.getElementById('info');

function loadModel(url, x, z) {
  loader.load(
    url,
    (gltf) => {
      const model = gltf.scene;

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const scale = 12 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);

      model.position.set(x, 0, z);
      scene.add(model);

      info.innerHTML += `<br>✅ Loaded ${url.split('/').pop()}`;
    },
    undefined,
    () => {
      info.innerHTML += `<br>❌ Failed ${url.split('/').pop()}`;
    }
  );
}

/* ---------------- ABSOLUTE URLs (FINAL FIX) ---------------- */
loadModel(
  'https://rubin514.github.io/Mini-city-life/models/building.glb',
  -25, 0
);

loadModel(
  'https://rubin514.github.io/Mini-city-life/models/building1.glb',
  25, 0
);

loadModel(
  'https://rubin514.github.io/Mini-city-life/models/tree1.glb',
  0, 25
);

/* ---------------- RESIZE ---------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- LOOP ---------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
