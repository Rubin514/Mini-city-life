<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dr. City Life - Claude Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87ceeb; }
        canvas { display: block; touch-action: none; }

        /* UI ELEMENTS */
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: #00ff00;
        }
        #playBtn { font-size: 24px; padding: 15px 50px; border: 3px solid #00ff00; background: none; color: #00ff00; cursor: pointer; font-weight: bold; border-radius: 8px; }

        #minimapOverlay {
            position: fixed; top: 10px; right: 10px; width: 150px; height: 150px;
            border-radius: 50%; border: 4px solid white; pointer-events: none; z-index: 20;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn {
            width: 65px; height: 65px; margin: 5px; border-radius: 12px; 
            font-size: 28px; background: rgba(0,0,0,0.6);
            border: 2px solid #ffffff; color: white; display: flex; align-items: center; justify-content: center;
        }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }

        .action-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { width: 120px; height: 60px; border-radius: 12px; font-size: 18px; color: white; border: 3px solid #fff; cursor: pointer; font-weight: bold; }
        #jumpBtn { background: #ffa500; }
        #enterBtn { background: #ff0000; }

        #uiHint { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); color: #ffff00; font-size: 22px; font-weight: bold; text-shadow: 2px 2px #000; display: none; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>DR. CITY LIFE</h1>
    <button id="playBtn">START GAME</button>
</div>

<div id="minimapOverlay"></div>
<div id="uiHint">PARK HERE</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<div class="action-container">
    <button class="action-btn" id="jumpBtn">JUMP</button>
    <button class="action-btn" id="enterBtn">ENTER</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ---------- 1. SCENE & CAMERAS ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
const mapCamera = new THREE.OrthographicCamera(-200, 200, 200, -200, 1, 1000);
mapCamera.position.y = 500;
mapCamera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.3));

/* ---------- 2. GRASS & ENVIRONMENT ---------- */
const textureLoader = new THREE.TextureLoader();
const landMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
textureLoader.load('textures/grass.png', (tex) => {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(100, 100);
    landMat.map = tex;
    landMat.color.set(0xffffff);
    landMat.needsUpdate = true;
});
const land = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), landMat);
land.rotation.x = -Math.PI / 2;
scene.add(land);

/* ---------- 3. PLAYER & PHYSICS ---------- */
const player = new THREE.Object3D();
player.position.set(0, 4, 100);
scene.add(player);
player.add(camera);

const pDot = new THREE.Mesh(new THREE.SphereGeometry(12), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
pDot.position.y = 50; 
player.add(pDot);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0, velocityY = 0;
const gravity = -0.018, jumpForce = 0.5, move = { up: false, down: false, left: false, right: false };
let isGrounded = true;

/* ---------- 4. MODELS & ANIMATED NPCs ---------- */
const buildings = [];
const npcs = [];
const mixers = []; // For NPC Animations
const clock = new THREE.Clock();
const loader = new GLTFLoader();

// Buildings
loader.load('models/building.glb', (gltf) => {
    const base = gltf.scene; base.scale.set(4, 4, 4);
    for (let x = -4; x <= 4; x++) {
        for (let z = -4; z <= 4; z++) {
            const bx = x * 300 + 80, bz = z * 300 + 80;
            const b = base.clone(); b.position.set(bx, 0, bz); scene.add(b);
            buildings.push({ box: new THREE.Box3().setFromObject(b), door: new THREE.Vector3(bx-25, 4, bz-25) });
        }
    }
});

// Animated NPCs (Claude)
loader.load('models/npc.glb', (gltf) => {
    const npcBase = gltf.scene;
    npcBase.scale.set(3, 3, 3);

    for (let i = 0; i < 15; i++) {
        const npc = npcBase.clone();
        const rx = (Math.random() - 0.5) * 2000;
        const rz = (Math.random() - 0.5) * 2000;
        npc.position.set(rx, 0, rz);
        scene.add(npc);

        // Animation Player
        const mixer = new THREE.AnimationMixer(npc);
        if (gltf.animations.length > 0) {
            const action = mixer.clipAction(gltf.animations[0]);
            action.play();
        }
        mixers.push(mixer);

        // Minimap Dot
        const nDot = new THREE.Mesh(new THREE.SphereGeometry(10), new THREE.MeshBasicMaterial({ color: 0x0000ff }));
        nDot.position.y = 60;
        npc.add(nDot);

        npcs.push({ 
            mesh: npc, 
            speed: 0.3 + Math.random() * 0.4, 
            turnTimer: Math.random() * 200 
        });
    }
});

/* ---------- 5. CONTROLS ---------- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    el.onpointerup = el.onpointerleave = () => move[k] = false;
}
bind("up", "up"); bind("down", "down"); bind("left", "left"); bind("right", "right");

document.getElementById("jumpBtn").onpointerdown = () => { if (isGrounded) { velocityY = jumpForce; isGrounded = false; } };
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

/* ---------- 6. GAME LOOP ---------- */
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    // Update NPC Animations
    mixers.forEach(m => m.update(delta));

    // NPC AI (Walking)
    npcs.forEach(npc => {
        npc.mesh.position.x += Math.sin(npc.mesh.rotation.y) * npc.speed;
        npc.mesh.position.z += Math.cos(npc.mesh.rotation.y) * npc.speed;
        npc.turnTimer--;
        if(npc.turnTimer <= 0) {
            npc.mesh.rotation.y += (Math.random() - 0.5) * 2;
            npc.turnTimer = 100 + Math.random() * 300;
        }
        // Map Bound check
        if(Math.abs(npc.mesh.position.x) > 1900 || Math.abs(npc.mesh.position.z) > 1900) { npc.mesh.rotation.y += Math.PI; }
    });

    // Player Movement
    yaw += (targetYaw - yaw) * 0.1; pitch += (targetPitch - pitch) * 0.1;
    let nx = player.position.x, nz = player.position.z, spd = 2.2;
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(nx, player.position.y, nz), new THREE.Vector3(6, 6, 6));
    let hit = false;
    for (const b of buildings) if (pBox.intersectsBox(b.box)) { hit = true; break; }
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    // Physics
    velocityY += gravity; player.position.y += velocityY;
    if (player.position.y <= 4) { player.position.y = 4; velocityY = 0; isGrounded = true; }

    player.rotation.y = yaw; camera.rotation.x = pitch;

    // RENDER MAIN
    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    renderer.clear();
    renderer.render(scene, camera);

    // RENDER MINIMAP
    const mSize = 150;
    renderer.setScissorTest(true);
    renderer.setScissor(window.innerWidth - mSize - 10, window.innerHeight - mSize - 10, mSize, mSize);
    renderer.setViewport(window.innerWidth - mSize - 10, window.innerHeight - mSize - 10, mSize, mSize);
    mapCamera.position.set(player.position.x, 500, player.position.z);
    renderer.render(scene, mapCamera);
    renderer.setScissorTest(false);
}
animate();

// Camera Drag
let drag = false, lx, ly;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => { if (drag) { targetYaw -= (e.clientX - lx) * 0.008; targetPitch -= (e.clientY - ly) * 0.008; lx = e.clientX; ly = e.clientY; } };
</script>
</body>
    </html>
