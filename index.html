<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - GitHub Version</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        canvas { display: block; touch-action: none; }
        
        /* Loading Screen */
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100; color: #fff;
        }
        #playBtn { font-size: 24px; padding: 15px 50px; border: 3px solid #00ff00; background: none; color: #00ff00; cursor: pointer; border-radius: 50px; display: none; }
        
        /* HUD */
        #msg { position: fixed; top: 20%; width: 100%; text-align: center; color: yellow; font-size: 24px; font-weight: bold; display: none; text-shadow: 2px 2px #000; pointer-events: none; }
        
        /* Controls */
        #controls { position: fixed; bottom: 25px; left: 25px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; margin: 5px; border-radius: 15px; font-size: 24px; background: rgba(0,0,0,0.6); border: 2px solid white; color: white; display: flex; align-items: center; justify-content: center; user-select: none; }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }

        .action-container { position: fixed; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { width: 100px; height: 55px; border-radius: 15px; font-size: 18px; color: white; border: 2px solid #fff; font-weight: bold; }
        #jumpBtn { background: #ff9800; }
        #enterBtn { background: #f44336; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>MINI CITY LIFE</h1>
    <p id="status">Loading Assets...</p>
    <button id="playBtn">START GAME</button>
</div>

<div id="msg">ENTRY DETECTED</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<div class="action-container">
    <button class="action-btn" id="jumpBtn">JUMP</button>
    <button class="action-btn" id="enterBtn">ENTER</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 2.5));

/* --- WORLD DESIGN --- */
// Grass
const land = new THREE.Mesh(new THREE.PlaneGeometry(15000, 15000), new THREE.MeshLambertMaterial({ color: 0x228b22 }));
land.rotation.x = -Math.PI / 2;
scene.add(land);

// Indian Roads
const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

for(let i = -8; i <= 8; i++) {
    const pos = i * 900;
    // Roads - Slightly elevated (0.2) to avoid clipping with grass
    const rh = new THREE.Mesh(new THREE.PlaneGeometry(15000, 180), roadMat);
    rh.rotation.x = -Math.PI/2; rh.position.set(0, 0.2, pos); scene.add(rh);
    
    const rv = new THREE.Mesh(new THREE.PlaneGeometry(180, 15000), roadMat);
    rv.rotation.x = -Math.PI/2; rv.position.set(pos, 0.2, 0); scene.add(rv);

    // White Strips
    for(let j = -7500; j < 7500; j += 120) {
        const dh = new THREE.Mesh(new THREE.PlaneGeometry(50, 6), dashMat);
        dh.rotation.x = -Math.PI/2; dh.position.set(j, 0.25, pos); scene.add(dh);
        const dv = new THREE.Mesh(new THREE.PlaneGeometry(6, 50), dashMat);
        dv.rotation.x = -Math.PI/2; dv.position.set(pos, 0.25, j); scene.add(dv);
    }
}

/* --- LOADING ASSETS --- */
const manager = new THREE.LoadingManager();
const loader = new GLTFLoader(manager);
const models = { b: [], tree: null, npc: null };
const colliders = [];
const entryPoints = [];

manager.onLoad = () => {
    document.getElementById('status').innerText = "Ready!";
    document.getElementById('playBtn').style.display = "block";
    generateCity();
};

manager.onError = (url) => console.error("Error loading: " + url);

// Use relative paths for GitHub
loader.load('models/building.glb', (g) => models.b.push(g.scene));
loader.load('models/building2.glb', (g) => models.b.push(g.scene));
loader.load('models/tree1.glb', (g) => { 
    g.scene.traverse(n => { if(n.isMesh) n.material.alphaTest = 0.5; });
    models.tree = g.scene; 
});
loader.load('models/npc.glb', (g) => { models.npc = g.scene; });

function generateCity() {
    const markerGeo = new THREE.CircleGeometry(40, 32);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

    for (let x = -4; x <= 4; x++) {
        for (let z = -4; z <= 4; z++) {
            if (x === 0 && z === 0) continue;
            const bx = x * 900 + 350;
            const bz = z * 900 + 350;

            // Add Building
            const b = models.b[Math.floor(Math.random() * models.b.length)].clone();
            b.scale.set(7, 7, 7);
            b.position.set(bx, 0, bz);
            scene.add(b);
            colliders.push({ box: new THREE.Box3().setFromObject(b) });

            // Add Entry Marker
            const entry = new THREE.Mesh(markerGeo, markerMat);
            entry.rotation.x = -Math.PI / 2;
            entry.position.set(bx - 120, 0.3, bz); 
            scene.add(entry);
            entryPoints.push(entry.position);

            // Add Tree
            if(models.tree) {
                const t = models.tree.clone();
                t.scale.set(5, 5, 5);
                t.position.set(bx + 200, 0, bz + 200);
                scene.add(t);
            }
        }
    }
    // Place NPC near spawn
    if(models.npc) {
        const n = models.npc.clone();
        n.scale.set(6, 6, 6);
        n.position.set(50, 0, 450);
        scene.add(n);
    }
}

/* --- PLAYER LOGIC --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 500); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0, velocityY = 0;
const move = { up: false, down: false, left: false, right: false };
let isGrounded = true;

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    yaw += (targetYaw - yaw) * 0.1; pitch += (targetPitch - pitch) * 0.1;
    let nx = player.position.x, nz = player.position.z, spd = 250 * dt;
    
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(nx, 10, nz), new THREE.Vector3(20, 20, 20));
    let hit = false;
    for (const c of colliders) if (pBox.intersectsBox(c.box)) hit = true;
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY -= 0.02; player.position.y += velocityY;
    if (player.position.y <= 10) { player.position.y = 10; velocityY = 0; isGrounded = true; }

    player.rotation.y = yaw; camera.rotation.x = pitch;

    let near = false;
    for(const pos of entryPoints) if(player.position.distanceTo(pos) < 80) near = true;
    document.getElementById("msg").style.display = near ? "block" : "none";

    renderer.render(scene, camera);
}
animate();

/* --- INPUTS --- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    el.onpointerup = () => move[k] = false;
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");
document.getElementById("jumpBtn").onpointerdown = () => { if(isGrounded){ velocityY=0.5; isGrounded=false; }};
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

let drag = false, lx, ly;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => { if (drag) { targetYaw -= (e.clientX - lx) * 0.007; targetPitch -= (e.clientY - ly) * 0.007; lx = e.clientX; ly = e.clientY; } };
</script>
</body>
</html>
