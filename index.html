<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Full Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; touch-action: none; }
        #loader { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: #00ff00; }
        .bar-bg { width: 200px; height: 10px; background: #333; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: #00ff00; transition: width 0.2s; }
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". u ." "l d r"; gap: 5px; }
        .btn { width: 60px; height: 60px; background: rgba(0,0,0,0.5); border: 2px solid #fff; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        #jump { position: fixed; bottom: 30px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: #ff9800; border: 2px solid #fff; color: white; font-weight: bold; }
        #mBtn { position: fixed; top: 15px; right: 15px; padding: 10px 20px; background: #00ff00; border: none; border-radius: 5px; font-weight: bold; }
        #mHUD { position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; color: white; display: none; }
    </style>
</head>
<body>

<div id="loader">
    <div id="perc">0%</div>
    <div class="bar-bg"><div id="bar"></div></div>
</div>

<div id="mHUD"><b id="mTitle"></b><br><span id="mDist"></span></div>
<button id="mBtn">MISSIONS</button>

<div id="controls">
    <div class="btn" style="grid-area:u" id="up">▲</div>
    <div class="btn" style="grid-area:l" id="left">◀</div>
    <div class="btn" style="grid-area:d" id="down">▼</div>
    <div class="btn" style="grid-area:r" id="right">▶</div>
</div>
<button id="jump">JUMP</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.152.2/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 20000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(500, 1000, 500);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000, 20000), new THREE.MeshLambertMaterial({ color: 0x44aa44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const manager = new THREE.LoadingManager();
const loader = new GLTFLoader(manager);
const assets = { b1: null, b2: null, tree: null };
const colliders = [];

manager.onProgress = (url, loaded, total) => {
    const p = Math.floor((loaded / total) * 100);
    document.getElementById('bar').style.width = p + '%';
    document.getElementById('perc').innerText = p + '%';
};

manager.onLoad = () => {
    createCity();
    document.getElementById('loader').style.display = 'none';
};

// Paths are exactly as shown in your GitHub screenshot
loader.load('models/building.glb', (g) => assets.b1 = g.scene);
loader.load('models/building2.glb', (g) => assets.b2 = g.scene);
loader.load('tree1.glb', (g) => assets.tree = g.scene, undefined, () => {
    // Fallback if tree1.glb is NOT in models folder
    loader.load('models/tree1.glb', (g) => assets.tree = g.scene);
});

function createCity() {
    for (let x = -6; x <= 6; x++) {
        for (let z = -6; z <= 6; z++) {
            if (x === 0 && z === 0) continue;
            const px = x * 1200, pz = z * 1200;
            
            const bSource = (x + z) % 2 === 0 ? assets.b1 : assets.b2;
            if (bSource) {
                const b = bSource.clone();
                // We set a massive scale because exported GLBs are often tiny
                b.scale.set(50, 50, 50); 
                b.position.set(px, 0, pz);
                scene.add(b);
                colliders.push({ x: px, z: pz, r: 150 });
            }

            if (assets.tree) {
                const t = assets.tree.clone();
                t.scale.set(20, 20, 20);
                t.position.set(px + 400, 0, pz + 400);
                scene.add(t);
            }
        }
    }
}

// 20 Missions Logic
const missions = Array.from({length: 20}, (_, i) => ({
    title: `Contract #${i+1}`,
    pos: { x: (Math.random()-0.5)*15000, z: (Math.random()-0.5)*15000 }
}));

let activeM = null, targetPoint = null;
document.getElementById('mBtn').onclick = () => {
    const m = missions[Math.floor(Math.random()*20)];
    activeM = m;
    if(targetPoint) scene.remove(targetPoint);
    targetPoint = new THREE.Mesh(new THREE.SphereGeometry(50), new THREE.MeshBasicMaterial({color: 0xff00ff}));
    targetPoint.position.set(m.pos.x, 50, m.pos.z);
    scene.add(targetPoint);
    document.getElementById('mTitle').innerText = m.title;
    document.getElementById('mHUD').style.display = 'block';
};

const player = new THREE.Object3D();
player.position.set(0, 15, 600);
scene.add(player);
player.add(camera);

let yaw = 0, vY = 0, move = {f:0, b:0, l:0, r:0};

function animate() {
    requestAnimationFrame(animate);
    let nx = player.position.x, nz = player.position.z, s = 8;
    if(move.f){ nx -= Math.sin(yaw)*s; nz -= Math.cos(yaw)*s; }
    if(move.b){ nx += Math.sin(yaw)*s; nz += Math.cos(yaw)*s; }
    if(move.l){ nx -= Math.cos(yaw)*s; nz += Math.sin(yaw)*s; }
    if(move.r){ nx += Math.cos(yaw)*s; nz -= Math.sin(yaw)*s; }

    let hit = false;
    for(let c of colliders) if(Math.hypot(nx-c.x, nz-c.z) < c.r) hit = true;
    if(!hit){ player.position.x = nx; player.position.z = nz; }

    vY -= 0.02; player.position.y += vY;
    if(player.position.y < 15) { player.position.y = 15; vY = 0; }

    if(activeM) {
        const d = player.position.distanceTo(targetPoint.position);
        document.getElementById('mDist').innerText = Math.round(d) + "m to target";
        if(d < 100) { alert("Mission Clear!"); activeM = null; scene.remove(targetPoint); document.getElementById('mHUD').style.display='none'; }
    }

    player.rotation.y = yaw;
    renderer.render(scene, camera);
}
animate();

// Controls
const b = (id, k) => {
    const e = document.getElementById(id);
    e.onpointerdown = () => move[k] = 1;
    e.onpointerup = () => move[k] = 0;
};
b("up","f"); b("down","b"); b("left","l"); b("right","r");
document.getElementById("jump").onpointerdown = () => { if(player.position.y <= 16) vY = 0.6; };

let drag = false, lx;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; };
window.onpointerup = () => drag = false;
window.onpointermove = e => { if(drag){ yaw -= (e.clientX - lx) * 0.005; lx = e.clientX; } };
</script>
</body>
</html>
