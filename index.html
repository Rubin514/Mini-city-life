<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City - Crazy Key Mission</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; background: #000; touch-action: none; }
        canvas { display: block; }

        /* GTA HUD & Minimap */
        #hud { position: fixed; top: 15px; left: 15px; z-index: 50; color: #fff; text-shadow: 2px 2px #000; pointer-events: none; }
        #minimap { width: 120px; height: 120px; background: rgba(0,0,0,0.6); border: 3px solid #fff; border-radius: 10px; position: relative; overflow: hidden; }
        #playerDot { width: 8px; height: 8px; background: #fff; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 5; }
        #keyDot { width: 10px; height: 10px; background: #ffff00; position: absolute; display: none; border-radius: 2px; }

        #missionText { color: #fbc02d; font-size: 16px; margin-top: 10px; background: rgba(0,0,0,0.5); padding: 5px; }

        /* Settings Toggle */
        #settingsBtn { position: fixed; top: 15px; right: 15px; z-index: 60; background: rgba(0,0,0,0.7); border: 1px solid #fff; color: #fff; padding: 10px; border-radius: 5px; font-size: 12px; }
        #settingsMenu { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }

        /* Controls */
        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; margin: 4px; border-radius: 15px; font-size: 20px; background: rgba(0,0,0,0.6); border: 2px solid #fff; color: white; display: flex; align-items: center; justify-content: center; user-select: none; }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }
        #jumpBtn { position: fixed; bottom: 30px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: #fbc02d; color: #000; border: 3px solid #fff; font-weight: bold; }
    </style>
</head>
<body>

<div id="hud">
    <div id="minimap">
        <div id="playerDot"></div>
        <div id="keyDot"></div>
    </div>
    <div id="missionText">FIND THE GOLDEN KEY</div>
</div>

<button id="settingsBtn">⚙️ SETTINGS</button>

<div id="settingsMenu">
    <h2>SETTINGS</h2>
    <label>SENSITIVITY</label>
    <input type="range" id="sensRange" min="1" max="10" value="4">
    <label>FOV (ZOOM)</label>
    <input type="range" id="fovRange" min="50" max="90" value="65">
    <button onclick="document.getElementById('settingsMenu').style.display='none'" style="margin-top:20px; padding:10px 30px; background:#fbc02d;">SAVE</button>
</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>
<button id="jumpBtn">JUMP</button>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

/* --- ENGINE --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 800, 5000);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(500, 1000, 500);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(15000, 15000), new THREE.MeshLambertMaterial({ color: 0x44aa44 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* --- ASSETS & MISSION --- */
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(draco);

const models = { b1: null, b2: null, tree: null };
const colliders = [];
let keyObj = null;
let hasKey = false;
let config = { sens: 0.004 };

// Multi-Loader
const loadModels = async () => {
    const [m1, m2, mt] = await Promise.all([
        loader.loadAsync('./models/building.glb'),
        loader.loadAsync('./models/building2.glb'),
        loader.loadAsync('./models/tree1.glb')
    ]);
    models.b1 = m1.scene;
    models.b2 = m2.scene;
    models.tree = mt.scene;
    initCity();
};
loadModels();

function initCity() {
    // Generate Random Key Position
    const kx = (Math.random() * 4000) - 2000;
    const kz = (Math.random() * 4000) - 2000;
    
    // Create Key Marker
    const keyGeo = new THREE.TorusGeometry(15, 5, 10, 30);
    const keyMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    keyObj = new THREE.Mesh(keyGeo, keyMat);
    keyObj.position.set(kx, 30, kz);
    scene.add(keyObj);
    document.getElementById('keyDot').style.display = 'block';

    for (let x = -5; x <= 5; x++) {
        for (let z = -5; z <= 5; z++) {
            if (Math.abs(x) < 1 && Math.abs(z) < 1) continue;
            
            const px = x * 1000, pz = z * 1000;
            // MIXING BUILDINGS: Flip-flop based on grid
            const source = (x + z) % 2 === 0 ? models.b1 : models.b2;
            const b = source.clone();
            b.scale.set(12, 12, 12);
            b.position.set(px, 0, pz);
            scene.add(b);
            colliders.push({ x: px, z: pz, r: 80 });

            // ADD TREES: Randomly place trees near buildings
            if(models.tree) {
                const t = models.tree.clone();
                t.scale.set(6, 6, 6);
                t.position.set(px + 300, 0, pz + 300);
                scene.add(t);
            }
        }
    }
}

/* --- PLAYER & CONTROLS --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 500);
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, velocityY = 0;
const move = { f: 0, b: 0, l: 0, r: 0 };

function animate() {
    requestAnimationFrame(animate);
    
    // Movement logic (Fixed Flicker)
    let spd = 6.0;
    let nx = player.position.x, nz = player.position.z;
    if (move.f) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.b) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.l) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.r) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    let hit = false;
    for (let c of colliders) if (Math.hypot(nx - c.x, nz - c.z) < c.r) hit = true;
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY -= 0.02; player.position.y += velocityY;
    if (player.position.y < 10) { player.position.y = 10; velocityY = 0; }

    // Mission & Minimap Update
    if(keyObj) {
        keyObj.rotation.y += 0.05;
        const dist = player.position.distanceTo(keyObj.position);
        
        // Update Key Dot on Minimap
        const mapX = 60 + (keyObj.position.x - player.position.x) / 50;
        const mapZ = 60 + (keyObj.position.z - player.position.z) / 50;
        const kDot = document.getElementById('keyDot');
        kDot.style.left = mapX + 'px';
        kDot.style.top = mapZ + 'px';

        if(dist < 100 && !hasKey) {
            hasKey = true;
            scene.remove(keyObj);
            document.getElementById('missionText').innerText = "KEY OBTAINED! FIND THE CRAZY EXIT";
            document.getElementById('missionText').style.color = "#00ff00";
            kDot.style.display = 'none';
        }
    }

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}
animate();

/* --- INPUTS --- */
const bind = (id, k) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); move[k] = 1; });
    el.addEventListener('pointerup', () => move[k] = 0);
};
bind("up","f"); bind("down","b"); bind("left","l"); bind("right","r");
document.getElementById("jumpBtn").onclick = () => { if(player.position.y <= 10.1) velocityY = 0.5; };
document.getElementById("settingsBtn").onclick = () => document.getElementById("settingsMenu").style.display = "flex";

// Settings Listeners
document.getElementById("sensRange").oninput = (e) => config.sens = e.target.value * 0.001;
document.getElementById("fovRange").oninput = (e) => { 
    camera.fov = e.target.value; 
    camera.updateProjectionMatrix(); 
};

// Smooth Look
let drag = false, lx, ly;
renderer.domElement.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('pointerup', () => drag = false);
window.addEventListener('pointermove', e => {
    if (drag) {
        yaw -= (e.clientX - lx) * config.sens;
        pitch = Math.max(-1, Math.min(1, pitch - (e.clientY - ly) * config.sens));
        lx = e.clientX; ly = e.clientY;
    }
});
</script>
</body>
</html>
