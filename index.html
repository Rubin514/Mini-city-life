<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini City Life</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        /* Loading Screen Styles */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        
        .loader-bar-container {
            width: 300px; height: 10px;
            background: #333; border-radius: 5px;
            margin-top: 20px; overflow: hidden;
        }
        #progress-bar { width: 0%; height: 100%; background: #00ff88; transition: width 0.2s; }
        h1 { color: white; letter-spacing: 5px; margin: 0; }
        #percent-text { color: #888; margin-top: 10px; font-size: 0.9rem; }

        /* HUD */
        #controls-hint {
            position: absolute; bottom: 20px; left: 20px;
            color: white; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 5px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h1>MINI CITY LIFE</h1>
        <div class="loader-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div id="percent-text">Loading: 0%</div>
    </div>

    <div id="controls-hint">WASD to Move | Models: Building 1, Building 2, Tree</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
