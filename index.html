<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life - Final Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; }
        canvas { display: block; touch-action: none; }
        #homeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; }
        #loaderBar { width: 240px; height: 10px; background: #333; border-radius: 5px; margin-top: 20px; overflow: hidden; }
        #loaderProgress { width: 0%; height: 100%; background: #00ff00; }
        #playBtn { font-size: 22px; padding: 12px 50px; border: 2px solid #00ff00; background: none; color: #00ff00; cursor: pointer; border-radius: 50px; display: none; margin-top: 25px; }
        #controls { position: fixed; bottom: 25px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; margin: 5px; border-radius: 15px; font-size: 24px; background: rgba(0,0,0,0.6); border: 1.5px solid #fff; color: white; display: flex; align-items: center; justify-content: center; user-select: none; }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }
        #jumpBtn { position: fixed; bottom: 35px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: #ff9800; color: white; border: 2px solid #fff; font-weight: bold; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>MINI CITY LIFE</h1>
    <div id="loaderBar"><div id="loaderProgress"></div></div>
    <div id="status" style="margin-top:10px; color:#00ff00;">Loading City Assets...</div>
    <button id="playBtn">START GAME</button>
</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>
<button id="jumpBtn">JUMP</button>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

/* --- 1. SCENE SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 200, 3000);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 6000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(100, 1000, 100);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshLambertMaterial({ color: 0x3d8c40 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* --- 2. ASSET LOADING --- */
const manager = new THREE.LoadingManager();
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader(manager);
loader.setDRACOLoader(draco);

const models = { b1: null, b2: null, tree: null };
const colliders = [];

manager.onProgress = (url, loaded, total) => {
    document.getElementById('loaderProgress').style.width = (loaded/total * 100) + '%';
};

manager.onLoad = () => {
    document.getElementById('status').innerText = "Ready!";
    document.getElementById('playBtn').style.display = "block";
    generateCity();
};

// Check filenames carefully: no spaces!
loader.load('./models/building.glb', (g) => { models.b1 = g.scene; });
loader.load('./models/building2.glb', (g) => { models.b2 = g.scene; });
loader.load('./models/tree1.glb', (g) => { models.tree = g.scene; });

function generateCity() {
    for (let x = -4; x <= 4; x++) {
        for (let z = -4; z <= 4; z++) {
            if (x === 0 && z === 0) continue; 
            
            const px = x * 900;
            const pz = z * 900;

            // Use Building 2 if available, otherwise Building 1
            let source = (Math.random() > 0.5 && models.b2) ? models.b2 : models.b1;

            if (source) {
                const b = source.clone();
                b.scale.set(12, 12, 12); // Taller buildings
                b.position.set(px, 0, pz);
                scene.add(b);
                
                // Tight collision radius (40) to walk near walls
                colliders.push({ x: px, z: pz, r: 40 });
            }

            if (models.tree) {
                const t = models.tree.clone();
                t.scale.set(5, 5, 5); // Visible trees
                t.position.set(px + 250, 0, pz + 250);
                scene.add(t);
            }
        }
    }
}

/* --- 3. PLAYER & MOVEMENT --- */
const player = new THREE.Object3D();
player.position.set(0, 10, 300); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, velocityY = 0;
const move = { up: false, down: false, left: false, right: false };

function animate() {
    requestAnimationFrame(animate);
    
    let nx = player.position.x, nz = player.position.z, spd = 4.5;
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    let hit = false;
    for (let c of colliders) {
        if (Math.hypot(nx - c.x, nz - c.z) < c.r) { hit = true; break; }
    }
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY -= 0.02; player.position.y += velocityY;
    if (player.position.y < 10) { player.position.y = 10; velocityY = 0; }

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}
animate();

/* --- 4. INPUTS --- */
const bind = (id, k) => {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    el.onpointerup = () => move[k] = false;
    el.onpointerleave = () => move[k] = false;
};
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");

document.getElementById("jumpBtn").onclick = () => { if(player.position.y <= 10.1) velocityY = 0.5; };
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

let drag = false, lx, ly;
window.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => {
    if (drag) {
        yaw -= (e.clientX - lx) * 0.007;
        pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - ly) * 0.007));
        lx = e.clientX; ly = e.clientY;
    }
};
</script>
</body>
</html>
