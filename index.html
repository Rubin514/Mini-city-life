<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini City Life</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87ceeb;
}
canvas {
    display: block;
}

/* Mobile Controls */
.controls {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 10;
}

.btn {
    width: 60px;
    height: 60px;
    margin: 6px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    background: rgba(80,80,80,0.8);
    color: white;
}

.enter {
    position: fixed;
    bottom: 30px;
    right: 20px;
    background: orange;
    color: black;
    width: 110px;
    height: 60px;
    border-radius: 12px;
    font-size: 18px;
}
</style>
</head>

<body>

<!-- MOBILE CONTROLS -->
<div class="controls">
    <div style="text-align:center">
        <button class="btn" id="up">↑</button>
    </div>
    <div>
        <button class="btn" id="left">←</button>
        <button class="btn" id="down">↓</button>
        <button class="btn" id="right">→</button>
    </div>
</div>

<button class="enter">ENTER</button>

<!-- THREE.JS IMPORT -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 2, 6);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHTS */
scene.add(new THREE.AmbientLight(0xffffff, 0.9));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(20, 30, 10);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* GRID */
scene.add(new THREE.GridHelper(500, 50));

/* PLAYER (camera holder) */
const player = new THREE.Object3D();
player.position.set(0, 0, 0);
scene.add(player);

/* MOVEMENT */
const speed = 0.12;
let move = { up:false, down:false, left:false, right:false };

document.getElementById("up").ontouchstart = () => move.up = true;
document.getElementById("up").ontouchend = () => move.up = false;

document.getElementById("down").ontouchstart = () => move.down = true;
document.getElementById("down").ontouchend = () => move.down = false;

document.getElementById("left").ontouchstart = () => move.left = true;
document.getElementById("left").ontouchend = () => move.left = false;

document.getElementById("right").ontouchstart = () => move.right = true;
document.getElementById("right").ontouchend = () => move.right = false;

/* LOAD BUILDING */
const loader = new GLTFLoader();

loader.load(
    "models/building.glb",
    (gltf) => {

        const base = gltf.scene;

        /* 🔥 IMPORTANT SCALE FIX */
        base.scale.set(0.2, 0.2, 0.2);

        const citySize = 5;
        const spacing = 15;

        for (let x = -citySize; x <= citySize; x++) {
            for (let z = -citySize; z <= citySize; z++) {
                const b = base.clone();
                b.position.set(x * spacing, 0, z * spacing);
                b.rotation.y = Math.random() * Math.PI * 2;
                scene.add(b);
            }
        }

        console.log("City loaded");
    },
    undefined,
    (err) => console.error(err)
);

/* RESIZE */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ANIMATION LOOP */
function animate() {
    requestAnimationFrame(animate);

    if (move.up) player.position.z -= speed;
    if (move.down) player.position.z += speed;
    if (move.left) player.position.x -= speed;
    if (move.right) player.position.x += speed;

    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 6;
    camera.lookAt(player.position);

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
