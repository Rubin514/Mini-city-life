<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini City Life Mobile</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }

        /* Loading Screen */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            transition: opacity 0.5s;
        }
        .loader { width: 200px; height: 10px; background: #333; border-radius: 5px; margin: 20px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #00ff88; }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }

        /* Mobile Joystick */
        #joystick-wrapper {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.3); z-index: 10;
        }
        #joystick-knob {
            width: 50px; height: 50px; background: white;
            border-radius: 50%; position: relative;
        }

        #ui-text {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; text-shadow: 1px 1px 2px black; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h2 style="color:white">LOADING CITY...</h2>
        <div class="loader"><div id="progress"></div></div>
    </div>

    <div id="ui-text">Use Joystick or WASD to Move</div>

    <div id="joystick-wrapper">
        <div id="joystick-knob"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
