<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini City Life</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        canvas { display: block; touch-action: none; }
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100; color: #fff;
        }
        #playBtn { font-size: 24px; padding: 15px 50px; border: 3px solid #00ff00; background: none; color: #00ff00; cursor: pointer; border-radius: 50px; }
        #minimapOverlay { position: fixed; top: 15px; right: 15px; width: 140px; height: 140px; border-radius: 50%; border: 3px solid white; pointer-events: none; z-index: 20; }
        #controls { position: fixed; bottom: 25px; left: 25px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn { width: 60px; height: 60px; margin: 5px; border-radius: 15px; font-size: 24px; background: rgba(0,0,0,0.6); border: 2px solid white; color: white; display: flex; align-items: center; justify-content: center; }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }
        .action-container { position: fixed; bottom: 35px; right: 25px; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { width: 100px; height: 55px; border-radius: 15px; font-size: 18px; color: white; border: 2px solid #fff; font-weight: bold; cursor: pointer; }
        #jumpBtn { background: #ff9800; }
        #enterBtn { background: #f44336; }
        #msg { position: fixed; top: 20%; width: 100%; text-align: center; color: yellow; font-size: 24px; font-weight: bold; display: none; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>MINI CITY LIFE</h1>
    <p id="status">Building Roads...</p>
    <button id="playBtn" style="display:none;">START GAME</button>
</div>

<div id="msg">ENTRY DETECTED - PRESS ENTER</div>
<div id="minimapOverlay"></div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<div class="action-container">
    <button class="action-btn" id="jumpBtn">JUMP</button>
    <button class="action-btn" id="enterBtn">ENTER</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* --- 1. SETUP --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const mapCamera = new THREE.OrthographicCamera(-600, 600, 600, -600, 1, 2000);
mapCamera.position.y = 1000;
mapCamera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff, 2.5));

/* --- 2. GROUND & INDIAN ROADS --- */
const land = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000), new THREE.MeshLambertMaterial({ color: 0x228b22 }));
land.rotation.x = -Math.PI / 2;
scene.add(land);

const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
const stripMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

for(let i = -5; i <= 5; i++) {
    const pos = i * 600;

    // Horizontal Road
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(12000, 140), roadMat);
    roadH.rotation.x = -Math.PI / 2;
    roadH.position.set(0, 0.1, pos);
    scene.add(roadH);

    // Vertical Road
    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(140, 12000), roadMat);
    roadV.rotation.x = -Math.PI / 2;
    roadV.position.set(pos, 0.1, 0);
    scene.add(roadV);

    // White Strips (Dashed Indian Style)
    for(let j = -6000; j < 6000; j += 80) {
        // Dash for Horizontal
        const dashH = new THREE.Mesh(new THREE.PlaneGeometry(40, 4), stripMat);
        dashH.rotation.x = -Math.PI / 2;
        dashH.position.set(j, 0.15, pos);
        scene.add(dashH);

        // Dash for Vertical
        const dashV = new THREE.Mesh(new THREE.PlaneGeometry(4, 40), stripMat);
        dashV.rotation.x = -Math.PI / 2;
        dashV.position.set(pos, 0.15, j);
        scene.add(dashV);
    }
}

/* --- 3. BUILDINGS & ENTRIES --- */
const buildings = [];
const entryPoints = []; // List of all building doors
const loader = new GLTFLoader();

const markerGeo = new THREE.CircleGeometry(30, 32);
const markerMat = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5, side: THREE.DoubleSide });

loader.load('models/building.glb', 
    (gltf) => {
        document.getElementById('status').innerText = "City Ready!";
        document.getElementById('playBtn').style.display = "block";
        createCity(gltf.scene);
    },
    undefined,
    () => {
        document.getElementById('status').innerText = "Using Backup City...";
        document.getElementById('playBtn').style.display = "block";
        const box = new THREE.Mesh(new THREE.BoxGeometry(150, 250, 150), new THREE.MeshLambertMaterial({ color: 0x777777 }));
        createCity(box);
    }
);

function createCity(template) {
    for (let x = -3; x <= 3; x++) {
        for (let z = -3; z <= 3; z++) {
            if (x === 0 && z === 0) continue; 
            const bx = x * 600 + 150;
            const bz = z * 600 + 150;

            const b = template.clone();
            if(!b.isMesh) b.scale.set(5, 5, 5);
            b.position.set(bx, 0, bz);
            scene.add(b);
            buildings.push({ box: new THREE.Box3().setFromObject(b) });

            // Add an Entry Marker in front of every building
            const entry = new THREE.Mesh(markerGeo, markerMat);
            entry.rotation.x = -Math.PI / 2;
            // Place it slightly in front of the building
            entry.position.set(bx - 80, 0.5, bz); 
            scene.add(entry);
            entryPoints.push(entry.position);
        }
    }
}

/* --- 4. PLAYER --- */
const player = new THREE.Object3D();
player.position.set(0, 5, 450); 
scene.add(player);
player.add(camera);

const pDot = new THREE.Mesh(new THREE.SphereGeometry(25), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
pDot.position.y = 800; 
player.add(pDot);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0, velocityY = 0;
const gravity = -0.015, jumpForce = 0.45, move = { up: false, down: false, left: false, right: false };
let isGrounded = true;

/* --- 5. LOOP --- */
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    yaw += (targetYaw - yaw) * 0.1; pitch += (targetPitch - pitch) * 0.1;
    let nx = player.position.x, nz = player.position.z, spd = 160 * dt;
    
    if (move.up) { nx -= Math.sin(yaw) * spd; nz -= Math.cos(yaw) * spd; }
    if (move.down) { nx += Math.sin(yaw) * spd; nz += Math.cos(yaw) * spd; }
    if (move.left) { nx -= Math.cos(yaw) * spd; nz += Math.sin(yaw) * spd; }
    if (move.right) { nx += Math.cos(yaw) * spd; nz -= Math.sin(yaw) * spd; }

    const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(nx, 5, nz), new THREE.Vector3(15, 15, 15));
    let hit = false;
    for (const b of buildings) if (pBox.intersectsBox(b.box)) hit = true;
    if (!hit) { player.position.x = nx; player.position.z = nz; }

    velocityY += gravity; player.position.y += velocityY;
    if (player.position.y <= 5) { player.position.y = 5; velocityY = 0; isGrounded = true; }

    player.rotation.y = yaw; camera.rotation.x = pitch;

    // Proximity check for ALL entries
    let nearEntry = false;
    for(const pos of entryPoints) {
        if(player.position.distanceTo(pos) < 60) { nearEntry = true; break; }
    }
    document.getElementById("msg").style.display = nearEntry ? "block" : "none";

    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    renderer.render(scene, camera);

    // Minimap
    renderer.setScissorTest(true);
    renderer.setScissor(window.innerWidth - 155, window.innerHeight - 155, 140, 140);
    renderer.setViewport(window.innerWidth - 155, window.innerHeight - 155, 140, 140);
    mapCamera.position.set(player.position.x, 1000, player.position.z);
    renderer.render(scene, mapCamera);
    renderer.setScissorTest(false);
}
animate();

/* --- 6. INPUTS --- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    el.onpointerup = () => move[k] = false;
}
bind("up","up"); bind("down","down"); bind("left","left"); bind("right","right");
document.getElementById("jumpBtn").onpointerdown = () => { if(isGrounded){ velocityY=jumpForce; isGrounded=false; }};
document.getElementById("enterBtn").onclick = () => {
    let near = false;
    for(const pos of entryPoints) { if(player.position.distanceTo(pos) < 60) near = true; }
    if(near) alert("Building Entered!");
};
document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

let drag = false, lx, ly;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => { if (drag) { targetYaw -= (e.clientX - lx) * 0.007; targetPitch -= (e.clientY - ly) * 0.007; lx = e.clientX; ly = e.clientY; } };
</script>
</body>
</html>
