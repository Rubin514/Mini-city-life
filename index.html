<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini City Life – DRACO Supported</title>

<style>
body { margin:0; overflow:hidden; background:#87ceeb; font-family:sans-serif; }
#home-screen {
    position:fixed; inset:0; background:#111;
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    z-index:1000; color:white;
}
#loading-bar { width:220px; height:8px; background:#333; border-radius:10px; overflow:hidden; }
#loading-fill { width:0%; height:100%; background:#00d2d3; transition:0.3s; }
#start-btn { margin-top:25px; padding:15px 45px; display:none;
    background:#00d2d3; border:none; border-radius:8px;
    color:white; font-weight:bold; }
.glass {
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;
    position:absolute; color:white;
    padding:10px 20px;
}
#mission-hud { top:20px; left:50%; transform:translateX(-50%); }
#joy-base {
    position:absolute; bottom:40px; left:40px;
    width:100px; height:100px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:2px solid rgba(255,255,255,0.3);
}
#joy-knob {
    width:50px; height:50px;
    background:white;
    border-radius:50%;
    position:absolute; top:25px; left:25px;
}
</style>
</head>

<body>

<div id="home-screen">
    <h1>GENERATING CITY</h1>
    <div id="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-text">0%</div>
    <button id="start-btn">START</button>
</div>

<div id="mission-hud" class="glass">HIGHWAY 101</div>
<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/// RENDERER
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 400, 2000);

/// CAMERA + PLAYER
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 3000);
const player = new THREE.Group();
player.position.set(0,15,100);
player.add(camera);
scene.add(player);

/// LIGHT
scene.add(new THREE.AmbientLight(0xffffff, 2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(200,500,100);
scene.add(sun);

/// ROAD
const road = new THREE.Mesh(
    new THREE.PlaneGeometry(180, 10000),
    new THREE.MeshStandardMaterial({ color:0x1a1a1a })
);
road.rotation.x = -Math.PI/2;
scene.add(road);

/// LOADERS (✅ DRACO ENABLED)
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
loader.setDRACOLoader(draco);

let loaded = 0;
const update = () => {
    loaded++;
    const p = Math.floor((loaded / 3) * 100);
    document.getElementById('loading-fill').style.width = p + '%';
    document.getElementById('loading-text').innerText = p + '%';
    if (p >= 100) document.getElementById('start-btn').style.display = 'block';
};

/// BUILDINGS
function spawnRow(url, x) {
    loader.load(url, g => {
        const m = g.scene;
        m.scale.setScalar(50);
        for(let i=0;i<15;i++){
            const c = m.clone();
            c.position.set(x,0,-800*i);
            scene.add(c);
        }
        update();
    });
}

spawnRow('./models/building.glb', -350);
spawnRow('./models/b1.glb', 350);

/// TREES
loader.load('./models/t1.glb', g => {
    const t = g.scene;
    t.scale.setScalar(3);
    for(let i=0;i<30;i++){
        const l=t.clone(); l.position.set(-110,0,-300*i); scene.add(l);
        const r=t.clone(); r.position.set(110,0,-300*i); scene.add(r);
    }
    update();
});

/// CONTROLS
let move={x:0,z:0}, joy=false;
let yaw=0,pitch=0;
const jb=document.getElementById('joy-base');
const jk=document.getElementById('joy-knob');

jb.onpointerdown=e=>{ joy=true; jb.setPointerCapture(e.pointerId); };
jb.onpointermove=e=>{
    if(!joy)return;
    const r=jb.getBoundingClientRect();
    const dx=(e.clientX-(r.left+50))/50;
    const dy=(e.clientY-(r.top+50))/50;
    const d=Math.min(Math.hypot(dx,dy),1);
    const a=Math.atan2(dy,dx);
    jk.style.transform=`translate(${Math.cos(a)*d*30}px,${Math.sin(a)*d*30}px)`;
    move.x=Math.cos(a)*d; move.z=Math.sin(a)*d;
};
onpointerup=()=>{ joy=false; jk.style.transform=''; move={x:0,z:0}; };

onpointermove=e=>{
    if(e.buttons){
        yaw -= e.movementX*0.003;
        pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*0.003));
    }
};

document.getElementById('start-btn').onclick=()=>{
    document.getElementById('home-screen').style.display='none';
    animate();
};

function animate(){
    requestAnimationFrame(animate);
    player.rotation.y=yaw;
    camera.rotation.x=pitch;
    const f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
    const r=new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
    player.position.addScaledVector(f,-move.z*8);
    player.position.addScaledVector(r,move.x*8);
    renderer.render(scene,camera);
}
</script>
</body>
</html>
