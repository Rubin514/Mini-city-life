<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini City Life – Multi Model</title>
<style>
    body { margin: 0; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
</style>
</head>
<body>

<!-- THREE JS (NON MODULE – STABLE) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
/* ===============================
   1. SCENE SETUP
================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, 120);

/* ===============================
   2. CAMERA & RENDERER
================================ */
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(20, 20, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* ===============================
   3. CONTROLS
================================ */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

/* ===============================
   4. LIGHTING
================================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(20, 30, 10);
scene.add(sun);

/* ===============================
   5. GROUND
================================ */
const grid = new THREE.GridHelper(200, 50);
scene.add(grid);

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ===============================
   6. LOAD MODELS
================================ */
const loader = new THREE.GLTFLoader();
const models = {
    buildings: [],
    tree: null
};

let loadedCount = 0;
const TOTAL_MODELS = 3;

function checkAllLoaded() {
    loadedCount++;
    if (loadedCount === TOTAL_MODELS) {
        createCity();
    }
}

// Building 1
loader.load("models/building.glb", gltf => {
    models.buildings.push(gltf.scene);
    checkAllLoaded();
});

// Building 2
loader.load("models/building1.glb", gltf => {
    models.buildings.push(gltf.scene);
    checkAllLoaded();
});

// Tree
loader.load("models/tree1.glb", gltf => {
    models.tree = gltf.scene;
    checkAllLoaded();
});

/* ===============================
   7. CITY GENERATION
================================ */
function createCity() {
    const spacing = 15;
    const size = 4;

    for (let x = -size; x <= size; x++) {
        for (let z = -size; z <= size; z++) {

            // Skip center
            if (x === 0 && z === 0) continue;

            // 70% buildings, 30% trees
            const isTree = Math.random() < 0.3;

            let obj;
            if (isTree && models.tree) {
                obj = models.tree.clone();
                obj.scale.set(2, 2, 2);
            } else {
                const b =
                    models.buildings[
                        Math.floor(Math.random() * models.buildings.length)
                    ];
                obj = b.clone();
                obj.scale.set(2, 2, 2);
            }

            obj.position.set(x * spacing, 0, z * spacing);
            obj.rotation.y = Math.random() * Math.PI * 2;
            scene.add(obj);
        }
    }

    console.log("City generated ✔");
}

/* ===============================
   8. RESIZE
================================ */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ===============================
   9. ANIMATE
================================ */
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
