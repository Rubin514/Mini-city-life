<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini City Life 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body { margin:0; overflow:hidden; background:#87ceeb; touch-action:none; font-family:sans-serif; }
button {
  width:60px; height:60px; border-radius:50%;
  background:rgba(255,255,255,0.35);
  color:#fff; font-size:20px;
  border:2px solid #fff;
}
#controls {
  position:fixed; bottom:20px; left:20px;
  display:flex; flex-direction:column; align-items:center;
}
#row { display:flex; gap:10px; }
#enterBtn {
  position:fixed; right:20px; bottom:20px;
  width:120px; height:60px;
  border-radius:12px;
  background:#ff9800; color:#000;
  font-weight:bold;
}
</style>
</head>
<body>

<div id="controls">
  <button id="up">⬆</button>
  <div id="row">
    <button id="left">⬅</button>
    <button id="jump">⤒</button>
    <button id="right">➡</button>
  </div>
  <button id="down">⬇</button>
</div>
<button id="enterBtn">ENTER</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* SCENE */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50,100,50);
scene.add(sun);

/* GROUND */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1000,1000),
  new THREE.MeshStandardMaterial({color:0x2e7d32})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* PLAYER */
const player = new THREE.Group();
player.position.set(0, 2, 0); // SAFE SPAWN
scene.add(player);
player.add(camera);

let yaw = 0;
let yVel = 0;
let grounded = true;
let inside = false;

/* BUILDINGS */
const buildings = [];
const loader = new GLTFLoader();

loader.load(
  "models/building.glb",
  gltf => {
    const base = gltf.scene;
    base.scale.set(1,1,1);

    const size = 4;
    const spacing = 30;

    for (let x=-size; x<=size; x++) {
      for (let z=-size; z<=size; z++) {

        if (x === 0 && z === 0) continue; // SPAWN AREA

        const b = base.clone();
        b.position.set(x*spacing, 0, z*spacing);
        scene.add(b);

        buildings.push({
          pos: new THREE.Vector3(x*spacing,0,z*spacing),
          door: new THREE.Vector3(x*spacing,0,z*spacing+6)
        });
      }
    }
  }
);

/* CONTROLS */
const keys = {up:false,down:false,left:false,right:false};

function bind(id,key){
  const el = document.getElementById(id);
  el.onpointerdown = e => { e.preventDefault(); keys[key]=true; };
  el.onpointerup = e => { e.preventDefault(); keys[key]=false; };
}

bind("up","up");
bind("down","down");
bind("left","left");
bind("right","right");

document.getElementById("jump").onpointerdown = () => {
  if (grounded) { yVel = 0.6; grounded = false; }
};

/* ENTER / EXIT BUILDING */
document.getElementById("enterBtn").onclick = () => {
  if (!inside) {
    for (const b of buildings) {
      const d = new THREE.Vector2(
        player.position.x, player.position.z
      ).distanceTo(
        new THREE.Vector2(b.door.x, b.door.z)
      );
      if (d < 5) {
        player.position.set(0,2,-120); // INTERIOR
        inside = true;
        return;
      }
    }
    alert("Go near a building door!");
  } else {
    player.position.set(0,2,0);
    inside = false;
  }
};

/* LOOP */
const speed = 0.5;
function animate(){
  requestAnimationFrame(animate);

  if (keys.up) {
    player.position.x -= Math.sin(yaw)*speed;
    player.position.z -= Math.cos(yaw)*speed;
  }
  if (keys.down) {
    player.position.x += Math.sin(yaw)*speed;
    player.position.z += Math.cos(yaw)*speed;
  }
  if (keys.left) yaw += 0.04;
  if (keys.right) yaw -= 0.04;

  yVel -= 0.03;
  player.position.y += yVel;
  if (player.position.y < 2) {
    player.position.y = 2;
    yVel = 0;
    grounded = true;
  }

  player.rotation.y = yaw;

  renderer.render(scene, camera);
}
animate();

onresize = () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
};
</script>
</body>
</html>
