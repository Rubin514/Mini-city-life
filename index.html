<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City FPS - Road Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Single Joystick for Movement */
        #joy-base { position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 50%; }
        #joy-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: #fff; border-radius: 50%; }

        #loading { position: absolute; inset: 0; background: #111; color: #0f0; display: flex; justify-content: center; align-items: center; z-index: 100; font-family: monospace; }
    </style>
</head>
<body>

<div id="loading">BUILDING CITY STREETS...</div>
<div id="crosshair"></div>

<div id="joy-base"><div id="joy-knob"></div></div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // 1. SCENE & FPS RIG
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const player = new THREE.Group();
    scene.add(player);
    camera.position.set(0, 12, 0); // Eye level
    player.add(camera);

    // 2. LIGHTS
    scene.add(new THREE.AmbientLight(0xffffff, 2));
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(50, 100, 50);
    scene.add(sun);

    // 3. CITY ROADS & SIDEWALKS
    // Dark Asphalt Road
    const road = new THREE.Mesh(new THREE.PlaneGeometry(60, 2000), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    road.rotation.x = -Math.PI / 2;
    scene.add(road);

    // Road Lines
    const lines = new THREE.GridHelper(2000, 40, 0xffffff, 0x333333);
    lines.rotation.y = Math.PI / 2;
    scene.add(lines);

    // Concrete Sidewalks
    const sidewalkL = new THREE.Mesh(new THREE.PlaneGeometry(40, 2000), new THREE.MeshStandardMaterial({ color: 0x888888 }));
    sidewalkL.rotation.x = -Math.PI / 2;
    sidewalkL.position.set(-50, 0.1, 0);
    scene.add(sidewalkL);

    const sidewalkR = sidewalkL.clone();
    sidewalkR.position.set(50, 0.1, 0);
    scene.add(sidewalkR);

    // 4. LOAD MODELS
    const draco = new DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);

    const load = (file, x, z, isP = false) => {
        loader.load(`./models/${file}`, (gltf) => {
            const m = gltf.scene;
            const box = new THREE.Box3().setFromObject(m);
            const size = box.getSize(new THREE.Vector3());
            const s = 25 / Math.max(size.x, size.y, size.z);
            m.scale.setScalar(s);

            if (isP) {
                m.visible = false; // Hide player model in FPS
                document.getElementById('loading').style.display = 'none';
            } else {
                // Place buildings along the sidewalk
                m.position.set(x, 0, z);
                scene.add(m);
            }
        });
    };

    // Create a row of buildings along the road
    for(let i = 0; i < 5; i++) {
        load("building.glb", -55, -200 * i);
        load("b1.glb", 55, -200 * i);
    }
    load("t1.glb", 0, 0, true);

    // 5. MOVEMENT (One Joystick)
    let moveInput = { x: 0, z: 0 };
    const joyBase = document.getElementById('joy-base');
    const joyKnob = document.getElementById('joy-knob');
    let joyActive = false;

    joyBase.addEventListener('pointerdown', (e) => { joyActive = true; joyBase.setPointerCapture(e.pointerId); });
    joyBase.addEventListener('pointermove', (e) => {
        if (!joyActive) return;
        const rect = joyBase.getBoundingClientRect();
        const dx = (e.clientX - (rect.left + 50)) / 50;
        const dy = (e.clientY - (rect.top + 50)) / 50;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 1);
        const angle = Math.atan2(dy, dx);
        joyKnob.style.transform = `translate(${Math.cos(angle)*dist*40}px, ${Math.sin(angle)*dist*40}px)`;
        moveInput.x = Math.cos(angle) * dist;
        moveInput.z = Math.sin(angle) * dist;
    });
    window.addEventListener('pointerup', () => { joyActive = false; joyKnob.style.transform = ''; moveInput = {x:0, z:0}; });

    // 6. LOOKING (Hand/Screen Drag)
    let yaw = 0, pitch = 0;
    window.addEventListener('pointermove', (e) => {
        if (joyActive) return; // Don't look if dragging the joystick
        if (e.pointerType === 'touch' || e.buttons === 1) {
            yaw -= e.movementX * 0.005;
            pitch -= e.movementY * 0.005;
            pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch));
        }
    });

    // 7. ANIMATION
    function animate() {
        requestAnimationFrame(animate);

        // Update Rotation
        player.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Move relative to view
        const speed = 1.2;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.quaternion);
        
        player.position.addScaledVector(forward, -moveInput.z * speed);
        player.position.addScaledVector(right, moveInput.x * speed);

        renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
