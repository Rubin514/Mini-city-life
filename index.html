<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini City Life - Fully Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: sans-serif; }
        /* Mobile UI Joystick */
        #joystick-base { 
            position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; 
            background: rgba(255,255,255,0.3); border-radius: 50%; z-index: 10;
        }
        #joystick-knob { 
            position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; 
            background: #fff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="joystick-base"><div id="joystick-knob"></div></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting (Essential for GLB models to be visible)
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // 3. Ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x4caf50 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 4. Loading Manager & Models
        const loader = new GLTFLoader();
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Load Building 1 (Left)
        loader.load('models/building.glb', (gltf) => {
            const b = gltf.scene;
            b.position.set(-20, 0, -10);
            scene.add(b);
        });

        // Load Building 2 (Right - Path Fixed)
        loader.load('models/building1.glb', (gltf) => {
            const b = gltf.scene;
            b.position.set(20, 0, -10);
            scene.add(b);
        });

        // Load Tree (The Player)
        loader.load('models/tree1.glb', (gltf) => {
            const t = gltf.scene;
            // Scale adjustment in case tree is too small/large
            t.scale.set(1.5, 1.5, 1.5); 
            playerGroup.add(t);
        });

        // 5. Joystick Logic
        const knob = document.getElementById('joystick-knob');
        const base = document.getElementById('joystick-base');
        let moveX = 0, moveZ = 0, dragging = false;

        base.addEventListener('pointerdown', () => dragging = true);
        window.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const rect = base.getBoundingClientRect();
            let dx = e.clientX - (rect.left + 50);
            let dy = e.clientY - (rect.top + 50);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const angle = Math.atan2(dy, dx);
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = (Math.cos(angle) * dist) / 40;
            moveZ = (Math.sin(angle) * dist) / 40;
        });
        window.addEventListener('pointerup', () => {
            dragging = false;
            knob.style.transform = `translate(0,0)`;
            moveX = 0; moveZ = 0;
        });

        // 6. Animation Loop & Camera Follow
        function animate() {
            requestAnimationFrame(animate);
            
            // Movement speed
            playerGroup.position.x += moveX * 0.3;
            playerGroup.position.z += moveZ * 0.3;
            
            // Third-Person Camera Position
            const offset = new THREE.Vector3(0, 10, 25);
            camera.position.lerp(playerGroup.position.clone().add(offset), 0.1);
            camera.lookAt(playerGroup.position);
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
