<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dr. City Life 3D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87ceeb; }
        canvas { display: block; touch-action: none; }

        /* VINTAGE ARCADE UI */
        #homeScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: #00ff00;
        }
        #homeScreen h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px #000; text-align: center; }
        #homeScreen button {
            font-size: 24px; padding: 10px 40px; border: 3px solid #00ff00; 
            background: none; color: #00ff00; cursor: pointer; font-weight: bold; border-radius: 8px;
        }

        #uiHint {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            color: #ffff00; font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000;
            display: none; z-index: 5;
        }

        #controls { position: fixed; bottom: 20px; left: 20px; z-index: 10; display: grid; grid-template-areas: ". up ." "left down right"; }
        .btn {
            width: 70px; height: 70px; margin: 5px; border-radius: 12px; 
            font-size: 28px; background: rgba(0,0,0,0.6);
            border: 2px solid #ffffff; color: white; display: flex; align-items: center; justify-content: center;
        }
        #up { grid-area: up; } #left { grid-area: left; } #right { grid-area: right; } #down { grid-area: down; }

        #enterBtn {
            position: fixed; bottom: 30px; right: 30px; width: 130px; height: 70px; 
            border-radius: 12px; font-size: 22px; background: #ff0000; border: 3px solid #fff;
            color: white; z-index: 10; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="homeScreen">
    <h1>DR. CITY LIFE</h1>
    <button id="playBtn">START GAME</button>
</div>

<div id="uiHint">DOOR REACHED</div>

<div id="controls">
    <div class="btn" id="up">▲</div>
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
    <div class="btn" id="down">▼</div>
</div>

<button id="enterBtn">ENTER</button>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ---------- 1. SCENE SETUP ---------- */
const scene = new THREE.Scene();
const skyColor = 0x87ceeb;
scene.background = new THREE.Color(skyColor);
scene.fog = new THREE.FogExp2(skyColor, 0.0012);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(50, 200, 50);
scene.add(sun);

/* ---------- 2. GRASS TEXTURE ---------- */
const textureLoader = new THREE.TextureLoader();
// Force re-load and check path. Try 'grass.png' if it's in the same folder as index.html
const grassTexture = textureLoader.load('textures/grass.png', 
    (tex) => {
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(100, 100);
        console.log("Texture loaded!");
    },
    undefined,
    (err) => console.error("Grass image not found! Check your 'textures' folder.")
);

/* ---------- 3. MAP (LAND & SEA) ---------- */
const spacing = 200;
const gridSize = 8;
const mapSize = (gridSize + 2) * spacing;

// Ground with fallback color
const land = new THREE.Mesh(
    new THREE.PlaneGeometry(mapSize, mapSize),
    new THREE.MeshStandardMaterial({ 
        map: (grassTexture), 
        color: 0x1a4d1a // Dark green fallback if texture fails
    })
);
land.rotation.x = -Math.PI / 2;
scene.add(land);

const sea = new THREE.Mesh(
    new THREE.PlaneGeometry(15000, 15000),
    new THREE.MeshStandardMaterial({ color: 0x0044ff })
);
sea.rotation.x = -Math.PI / 2;
sea.position.y = -5;
scene.add(sea);

/* ---------- 4. ROADS ---------- */
function createRoads() {
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

    for (let i = -gridSize; i <= gridSize; i++) {
        const pos = i * spacing;
        // Vert roads
        const vR = new THREE.Mesh(new THREE.PlaneGeometry(50, mapSize), roadMat);
        vR.rotation.x = -Math.PI/2; vR.position.set(pos, 0.1, 0); scene.add(vR);
        // Yellow line
        const vL = new THREE.Mesh(new THREE.PlaneGeometry(2, mapSize), lineMat);
        vL.rotation.x = -Math.PI/2; vL.position.set(pos, 0.12, 0); scene.add(vL);
        
        // Horiz roads
        const hR = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, 50), roadMat);
        hR.rotation.x = -Math.PI/2; hR.position.set(0, 0.1, pos); scene.add(hR);
        // Yellow line
        const hL = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, 2), lineMat);
        hL.rotation.x = -Math.PI/2; hL.position.set(0, 0.12, pos); scene.add(hL);
    }
}
createRoads();

/* ---------- 5. PLAYER ---------- */
const player = new THREE.Object3D();
player.position.set(0, 4, 100); 
scene.add(player);
player.add(camera);

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
const speed = 1.5; 
const move = { up: false, down: false, left: false, right: false };

/* ---------- 6. BUILDINGS ---------- */
const buildings = [];
const loader = new GLTFLoader();

loader.load('models/building.glb', (gltf) => {
    const base = gltf.scene;
    base.scale.set(4, 4, 4);

    for (let x = -gridSize; x <= gridSize; x++) {
        for (let z = -gridSize; z <= gridSize; z++) {
            const bx = x * spacing + 70;
            const bz = z * spacing + 70;
            const b = base.clone();
            b.position.set(bx, 0, bz);
            scene.add(b);

            const box = new THREE.Box3().setFromObject(b);
            const doorPos = new THREE.Vector3(bx - 25, 4, bz - 25); // Raised to Y=4

            const marker = new THREE.Mesh(
                new THREE.SphereGeometry(4),
                new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: false, transparent: true, opacity: 0.8 })
            );
            marker.position.copy(doorPos);
            marker.renderOrder = 999;
            scene.add(marker);

            buildings.push({ box: box, door: doorPos });
        }
    }
});

/* ---------- 7. CONTROLS ---------- */
function bind(id, k) {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); move[k] = true; };
    const stop = () => move[k] = false;
    el.onpointerup = stop; el.onpointerleave = stop;
}
bind("up", "up"); bind("down", "down"); bind("left", "left"); bind("right", "right");

let drag = false, lx, ly;
renderer.domElement.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; };
window.onpointerup = () => drag = false;
window.onpointermove = e => {
    if (!drag) return;
    targetYaw -= (e.clientX - lx) * 0.008;
    targetPitch -= (e.clientY - ly) * 0.008;
    targetPitch = Math.max(-0.7, Math.min(0.7, targetPitch));
    lx = e.clientX; ly = e.clientY;
};

/* ---------- 8. GAME LOOP ---------- */
const hitbox = new THREE.Box3();
const hint = document.getElementById("uiHint");

document.getElementById("enterBtn").onclick = () => {
    for (const b of buildings) {
        if (player.position.distanceTo(b.door) < 30) {
            player.position.set(0, 4, -8000); // Interior
            return;
        }
    }
    if(player.position.z < -5000) player.position.set(0, 4, 100);
};

document.getElementById("playBtn").onclick = () => document.getElementById("homeScreen").style.display = "none";

function animate() {
    requestAnimationFrame(animate);
    yaw += (targetYaw - yaw) * 0.1;
    pitch += (targetPitch - pitch) * 0.1;

    let nx = player.position.x;
    let nz = player.position.z;

    if (move.up) { nx -= Math.sin(yaw) * speed; nz -= Math.cos(yaw) * speed; }
    if (move.down) { nx += Math.sin(yaw) * speed; nz += Math.cos(yaw) * speed; }
    if (move.left) { nx -= Math.cos(yaw) * speed; nz += Math.sin(yaw) * speed; }
    if (move.right) { nx += Math.cos(yaw) * speed; nz -= Math.sin(yaw) * speed; }

    hitbox.setFromCenterAndSize(new THREE.Vector3(nx, 4, nz), new THREE.Vector3(5, 6, 5));
    let col = false;
    for (const b of buildings) if (hitbox.intersectsBox(b.box)) { col = true; break; }
    if (!col) { player.position.x = nx; player.position.z = nz; }

    let near = false;
    for(const b of buildings) if(player.position.distanceTo(b.door) < 30) { near = true; break; }
    hint.style.display = near ? "block" : "none";

    player.rotation.y = yaw;
    camera.rotation.x = pitch;
    renderer.render(scene, camera);
}
animate();

window.onresize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
};
</script>
</body>
</html>
